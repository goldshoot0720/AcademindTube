<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AcademindTube · 雙語字幕預覽</title>
<style>
  :root{
    --bg:#fff; --bg-alt:#f9f9f9; --bg-hover:#f2f2f2;
    --border:#e5e5e5; --border-strong:#d9d9d9;
    --text:#0f0f0f; --muted:#606060; --muted-2:#909090;
    --accent:#065fd4; --accent-soft:#e8f0fe;
    --zh:#065fd4;
    --radius:12px;
    --topbar-h:56px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  [hidden]{display:none !important}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
  mark{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50; height:var(--topbar-h);
    display:flex; align-items:center; gap:16px; padding:0 16px;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;
    letter-spacing:-.2px;white-space:nowrap;color:inherit;text-decoration:none;
  }
  .brand .mark{
    width:28px;height:20px;border-radius:5px;background:#ff0033;
    display:grid;place-items:center;flex:none;
  }
  .brand .mark svg{width:11px;height:11px;fill:#fff}
  .brand small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
  .back{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
    border-radius:999px;background:var(--bg-alt);border:1px solid var(--border);
    font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap;
  }
  .back:hover{background:var(--bg-hover);color:var(--text)}
  .search{
    flex:1; max-width:520px; display:flex; align-items:center; gap:8px;
    border:1px solid var(--border-strong); border-radius:999px; padding:0 14px; height:38px;
    background:var(--bg);
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{width:16px;height:16px;fill:var(--muted);flex:none}
  .search input{border:0;outline:0;flex:1;font-size:14px;background:transparent;color:var(--text)}
  .topbar .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
    border-radius:999px;background:var(--bg-alt);border:1px solid var(--border);
    font-size:12px;color:var(--muted);white-space:nowrap;
  }
  .chip b{color:var(--text);font-weight:600}
  @media (max-width:900px){ .chip{display:none} }

  /* ---------- channel home ---------- */
  .home{max-width:1280px;margin:0 auto;padding:0 24px 56px}
  .banner{
    aspect-ratio:6.2/1; max-height:156px; border-radius:12px; overflow:hidden;
    background:linear-gradient(135deg,#5b2ea6,#9a6ee0); margin-top:16px;
  }
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .chan-head{display:flex;align-items:flex-start;gap:18px;padding:16px 0 2px}
  .chan-avatar{
    width:96px;height:96px;border-radius:50%;flex:none;object-fit:cover;
    background:#ececec;box-shadow:0 0 0 1px var(--border);
  }
  .chan-info{min-width:0;flex:1}
  .chan-info h1{
    font-size:22px;font-weight:700;margin:0 0 5px;line-height:1.25;
    display:flex;align-items:center;gap:6px;
  }
  .verified{
    width:14px;height:14px;flex:none;fill:#606060;
  }
  .chan-meta{color:var(--muted);font-size:12.5px}
  .chan-desc{
    color:var(--muted);font-size:12.5px;margin:8px 0 0;line-height:1.6;
    white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;
  }
  .chan-desc.open{-webkit-line-clamp:unset}
  .more{color:var(--text);font-weight:600;font-size:12.5px;margin-top:3px}
  .chan-actions{display:flex;gap:10px;flex:none;align-items:center}
  .subscribe{
    height:34px;padding:0 16px;border-radius:999px;
    background:var(--text);color:#fff;font-weight:600;font-size:13px;
  }
  .subscribe.on{background:var(--bg-alt);color:var(--text);border:1px solid var(--border)}
  .ghost-btn{
    height:34px;padding:0 15px;border-radius:999px;background:var(--bg-alt);
    border:1px solid var(--border);font-weight:600;font-size:13px;
  }
  .ghost-btn:hover{background:var(--bg-hover)}
  @media (max-width:760px){
    .chan-head{flex-wrap:wrap}
    .chan-avatar{width:72px;height:72px}
    .chan-info h1{font-size:19px}
  }

  .tabs{
    display:flex;gap:24px;border-bottom:1px solid var(--border);
    margin:12px 0 18px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:10px 2px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--text)}

  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
  .sec-head h2{font-size:16px;font-weight:700;margin:0}
  .sec-head .count{color:var(--muted);font-size:12px}
  .sec-head .sortchips{margin-left:auto}
  .sortchips{display:flex;gap:8px}
  .sortchip{
    height:32px;padding:0 15px;border-radius:999px;background:var(--bg-alt);
    border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);
  }
  .sortchip:hover{background:var(--bg-hover)}
  .sortchip.active{background:var(--text);color:#fff;border-color:var(--text)}

  .featured{
    display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;
    padding:14px;border:1px solid var(--border);border-radius:12px;
    margin-bottom:22px;width:100%;text-align:left;
  }
  .featured:hover{border-color:var(--border-strong);background:#fcfcfc}
  .featured .thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#e9e9e9}
  .featured .finfo{grid-column:2;min-width:0}
  .featured .ftitle{display:block;font-size:17px;font-weight:700;margin:0 0 7px;line-height:1.35}
  .featured .fmeta{display:block;color:var(--muted);font-size:12.5px;margin:0 0 9px}
  .featured .fdesc{display:block;color:var(--muted);font-size:12.5px;line-height:1.65}
  .featured .ftag{
    display:inline-block;margin-bottom:8px;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;
  }
  @media (max-width:900px){ .featured{grid-template-columns:minmax(0,1fr)} }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px 14px}
  .card{display:flex;flex-direction:column;text-align:left;padding:0;width:100%}
  .card .thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#e9e9e9}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .18s}
  .card:hover .thumb img{transform:scale(1.02)}
  .card .ct{
    font-weight:600;font-size:13.5px;line-height:1.4;margin:9px 0 3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card:hover .ct{color:var(--accent)}
  .card .cm{color:var(--muted);font-size:12px;line-height:1.5}
  .dur{
    position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.82);color:#fff;
    font-size:11px;font-weight:600;padding:2px 5px;border-radius:4px;
    font-variant-numeric:tabular-nums;
  }
  .empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- layout ---------- */
  .layout{
    display:grid; grid-template-columns:minmax(0,1fr) 402px; gap:24px;
    max-width:1600px; margin:0 auto; padding:24px;
  }
  @media (max-width:1180px){ .layout{grid-template-columns:minmax(0,1fr)} }

  /* ---------- player ---------- */
  .player-wrap{
    position:relative; width:100%; aspect-ratio:16/9; background:#000;
    border-radius:var(--radius); overflow:hidden;
  }
  .player-wrap #player, .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .captions{
    position:absolute; left:0; right:0; bottom:9%; z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    pointer-events:none; padding:0 6%; text-align:center;
    transition:opacity .15s;
  }
  .captions[hidden]{display:none}
  .captions .line{
    display:inline-block; padding:2px 8px; border-radius:4px;
    background:rgba(8,8,8,.78); color:#fff;
    font-size:calc(var(--cap,20px)); line-height:1.35;
    text-shadow:0 1px 2px rgba(0,0,0,.5); max-width:100%;
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
  }
  .captions .line.zh{ color:#bfe0ff; font-size:calc(var(--cap,20px) * .92) }
  .player-fallback{
    position:absolute; inset:0; display:none; place-items:center; color:#fff;
    background:#111; font-size:13px; text-align:center; padding:24px; z-index:6;
  }
  .player-fallback.show{display:grid}

  /* ---------- meta ---------- */
  .meta h1{font-size:20px;font-weight:700;margin:16px 0 10px;line-height:1.35}
  .meta .subline{color:var(--muted);font-size:13px;margin:-4px 0 14px}
  .channel-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .avatar{
    width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;
    background:linear-gradient(135deg,#ff0033,#ff7a00);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .channel-name{font-weight:600}
  .channel-subs{color:var(--muted);font-size:12px}
  .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;
    border-radius:999px;background:var(--bg-alt);font-size:13px;font-weight:600;
    border:1px solid var(--border);
  }
  .pill:hover{background:var(--bg-hover)}
  .pill.on{background:var(--accent-soft);border-color:#c9dcfb;color:var(--accent)}
  .pill svg{width:16px;height:16px;fill:currentColor}

  .description{
    margin-top:16px;background:var(--bg-alt);border-radius:var(--radius);
    padding:14px 16px;font-size:13px;color:var(--text);
  }
  .description .stats{font-weight:600;margin-bottom:8px}
  .description p{margin:0;color:var(--muted);line-height:1.65}
  .kv{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:12px;color:var(--muted)}
  .kv b{color:var(--text);font-weight:600}
  .badge-ok{color:#0f7b3f;font-weight:600}
  .badge-warn{color:#b25e00;font-weight:600}

  /* ---------- transcript ---------- */
  .panel-head{
    display:flex;align-items:center;gap:10px;margin:22px 0 10px;
  }
  .panel-head h2{font-size:15px;font-weight:700;margin:0}
  .panel-head .count{color:var(--muted);font-size:12px;font-weight:400}
  .panel-head .tools{margin-left:auto;display:flex;gap:6px}
  .icon-btn{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    color:var(--muted);
  }
  .icon-btn:hover{background:var(--bg-hover);color:var(--text)}
  .icon-btn svg{width:18px;height:18px;fill:currentColor}
  .icon-btn.on{color:var(--accent);background:var(--accent-soft)}

  .transcript{
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    background:var(--bg);
  }
  .transcript[hidden]{display:none}
  .transcript .list{max-height:460px;overflow-y:auto;overscroll-behavior:contain}
  .cue{
    display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;width:100%;
    text-align:left;padding:9px 14px;border-bottom:1px solid #f0f0f0;
    align-items:start;
  }
  .cue:last-child{border-bottom:0}
  .cue:hover{background:var(--bg-hover)}
  .cue .t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
  .cue .body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .cue .en{color:var(--text)}
  .cue .zh{color:var(--zh)}
  .cue.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .cue.active .t{color:var(--accent);font-weight:600}
  .cue.missing .zh{color:#b25e00;font-style:italic}
  .empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- related ---------- */
  .secondary h2{font-size:15px;font-weight:700;margin:0 0 12px}
  .rel{
    display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px;width:100%;
    text-align:left;padding:8px;border-radius:10px;
  }
  .rel:hover{background:var(--bg-hover)}
  .rel.playing{background:var(--accent-soft)}
  .thumb{
    position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#ddd;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .rel .info{min-width:0}
  .rel .rt{
    font-weight:600;font-size:13px;line-height:1.4;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .rel .rm{color:var(--muted);font-size:12px}

  .hint{
    margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg-alt);
    color:var(--muted);font-size:12px;line-height:1.7;
  }
  .hint kbd{
    background:#fff;border:1px solid var(--border-strong);border-bottom-width:2px;
    border-radius:4px;padding:0 5px;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--text);
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:#0f0f0f;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    AcademindTube <small>雙語字幕預覽</small>
  </a>
  <a class="back" id="btnBack" href="#/" hidden>← 首頁</a>
  <label class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="搜尋影片標題" autocomplete="off" />
  </label>
  <div class="spacer"></div>
  <span class="chip">視窗 <b id="chipWindow">1m</b></span>
  <span class="chip">影片 <b id="chipVideos">–</b></span>
  <span class="chip">字幕段數 <b id="chipCues">–</b></span>
</header>

<!-- ======================= channel home ======================= -->
<main class="home" id="homeView">
  <div class="banner"><img id="chanBanner" alt="" /></div>

  <div class="chan-head">
    <img class="chan-avatar" id="chanAvatar" alt="" />
    <div class="chan-info">
      <h1 id="chanName">–</h1>
      <div class="chan-meta" id="chanMeta">–</div>
      <p class="chan-desc" id="chanDesc"></p>
      <button class="more" id="btnMore" hidden>…更多</button>
    </div>
    <div class="chan-actions">
      <button class="subscribe" id="btnSubscribe">訂閱</button>
      <button class="ghost-btn">加入</button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="home">首頁</button>
    <button class="tab" data-tab="videos">影片</button>
    <button class="tab" data-tab="shorts">Shorts</button>
    <button class="tab" data-tab="live">直播</button>
    <button class="tab" data-tab="playlists">播放清單</button>
    <button class="tab" data-tab="community">社群</button>
  </nav>

  <button class="featured" id="featured" hidden></button>

  <div class="sec-head">
    <h2 id="gridTitle">最新上傳</h2>
    <span class="count" id="gridCount"></span>
    <div class="sortchips" id="sortChips" hidden>
      <button class="sortchip active" data-sort="new">最新</button>
      <button class="sortchip" data-sort="old">最早</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="gridEmpty" hidden></div>
</main>

<!-- ======================= watch ======================= -->
<main class="layout" id="watchView" hidden>
  <section class="primary">
    <div class="player-wrap">
      <div id="player"></div>
      <div class="captions" id="captions">
        <span class="line en" id="capEn"></span>
        <span class="line zh" id="capZh"></span>
      </div>
      <div class="player-fallback" id="fallback">
        播放器載入中…<br />若持續無法載入，請確認網路可連線至 YouTube。
      </div>
    </div>

    <div class="meta">
      <h1 id="title">–</h1>
      <div class="subline" id="subline">–</div>
      <div class="channel-row">
        <div class="avatar" id="chAvatar"></div>
        <div>
          <div class="channel-name" id="chName">Academind</div>
          <div class="channel-subs" id="chSubs">YouTube 頻道 · 自動產製雙語字幕</div>
        </div>
        <button class="subscribe" id="btnSubscribe2">訂閱</button>
        <div class="actions">
          <button class="pill" id="btnLike">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1z"/></svg>
            <span id="likeCount">–</span>
          </button>
          <button class="pill" id="btnShare">
            <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
            分享
          </button>
          <button class="pill on" id="btnCc">
            <svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 01-1 1H8a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 01-1 1h-2a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v1z"/></svg>
            雙語字幕
          </button>
        </div>
      </div>

      <div class="description">
        <div class="stats" id="descStats">–</div>
        <p id="descText">–</p>
        <div class="kv" id="descKv"></div>
      </div>
    </div>

    <div class="panel-head">
      <h2>轉錄稿</h2>
      <span class="count" id="trCount"></span>
      <div class="tools">
        <button class="icon-btn on" id="btnFollow" title="自動跟隨播放">
          <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A8.99 8.99 0 0013 3.06V1h-2v2.06A8.99 8.99 0 003.06 11H1v2h2.06A8.99 8.99 0 0011 20.94V23h2v-2.06A8.99 8.99 0 0020.94 13H23v-2h-2.06zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg>
        </button>
        <button class="icon-btn" id="btnCopy" title="複製目前字幕">
          <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 00-2 2v14h2V3h12V1zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>

    <div class="transcript" id="transcript">
      <div class="list" id="cueList"></div>
    </div>
  </section>

  <aside class="secondary">
    <h2>相關影片</h2>
    <div id="related"></div>

":2,"start":5.545,"end":9.632,"en":"on the Alchemy library framework, whatever you wanna call it.","zh":"在 Alchemy 庫框架上，無論你想怎麼稱呼它。"},{"i":3,"start":10.353,"end":11.683,"en":"It's really amazing.","zh":"真是太神奇了。"},{"i":4,"start":11.731,"end":17.982,"en":"Now, last week I shared my thoughts about Effect and that Effect is really good when","zh":"現在，上週我分享了我對 Effect 的想法，當 Effect 非常好時"},{"i":5,"start":17.982,"end":19.103,"en":"working with AI agents.","zh":"與人工智慧代理合作。"},{"i":6,"start":19.488,"end":25.787,"en":"Alchemy kind of builds up on Effect, but it's actually about managing the infrastructure","zh":"Alchemy 有點建立在 Effect 的基礎上，但它實際上是關於管理基礎設施"},{"i":7,"start":25.915,"end":27.229,"en":"that powers your application.","zh":"為您的應用程式提供動力。"},{"i":8,"start":27.277,"end":29.136,"en":"It's about deploying that infrastructure.","zh":"這是關於部署該基礎設施的。"},{"i":9,"start":29.184,"end":32.906,"en":"It's about infrastructure as code and merging that with your code.","zh":"這是關於基礎設施即代碼並將其與您的程式碼合併。"},{"i":10,"start":32.954,"end":34.559,"en":"And I got an example for you.","zh":"我給你舉了一個例子。"},{"i":11,"start":35.121,"end":37.335,"en":"So I got a very simple codebase here.","zh":"所以我在這裡得到了一個非常簡單的程式碼庫。"},{"i":12,"start":37.705,"end":39.518,"en":"And first, an example without Alchemy.","zh":"首先，舉一個沒有煉金術的例子。"},{"i":13,"start":39.951,"end":45.135,"en":"Let's say we want to deploy on Cloudflare, which is already one of the better use cases","zh":"假設我們想要在 Cloudflare 上部署，這已經是更好的用例之一"},{"i":14,"start":45.247,"end":50.382,"en":"because if you do that, by default you can write your worker code.","zh":"因為如果你這樣做，預設情況下你可以編寫你的工作代碼。"},{"i":15,"start":50.462,"end":55.453,"en":"Workers are that Cloudflare primitive that allows you to run code in the cloud.","zh":"Workers 是 Cloudflare 原語，可讓您在雲端中執行程式碼。"},{"i":16,"start":55.501,"end":59.884,"en":"You can think of them as AWS Lambda on Cloudflare, in case you know that.","zh":"如果您知道的話，您可以將它們視為 Cloudflare 上的 AWS Lambda。"},{"i":17,"start":60.173,"end":65.68,"en":"So it's not an entire server, it's just a thing that temporarily spins up when your code","zh":"所以它不是一個完整的伺服器，它只是當你的程式碼運行時臨時旋轉的東西"},{"i":18,"start":65.712,"end":70.191,"en":"needs to execute, for example, because of an incoming request, and then shuts down so","zh":"例如，由於傳入請求而需要執行，然後關閉"},{"i":19,"start":70.191,"end":75.136,"en":"that you only pay for when it's actually executing versus a complete server where you","zh":"您只需在實際執行時付費，而不是在完整的伺服器上付費"},{"i":20,"start":75.168,"end":75.922,"en":"always pay.","zh":"總是付錢。"},{"i":21,"start":76.292,"end":81.702,"en":"Of course, this on-demand per-request execution can be more expensive than a server if","zh":"當然，這種按請求按需執行的成本可能比伺服器更昂貴，如果"},{"i":22,"start":81.75,"end":84.464,"en":"you have a lot of execution, but That's a totally different story.","zh":"你有很多執行力，但那是一個完全不同的故事。"},{"i":23,"start":84.737,"end":90.166,"en":"Workers are really great and without Alchemy, this is how a worker could look like, how","zh":"工人真的很偉大，沒有煉金術，工人就是這個樣子，怎麼辦"},{"i":24,"start":90.182,"end":90.969,"en":"you could define it.","zh":"你可以定義它。"},{"i":25,"start":91.146,"end":97.25,"en":"And then the great thing about Cloudflare is out of the box, it already follows an infrastructure","zh":"Cloudflare 的優點在於開箱即用，它已經遵循基礎設施"},{"i":26,"start":97.346,"end":98.117,"en":"as code approach.","zh":"作為程式碼方法。"},{"i":27,"start":98.23,"end":105.056,"en":"You have this wrangler.jsonc file here and in there you define your worker, the","zh":"您在這裡有這個 wrangler.jsonc 文件，您可以在其中定義您的工作人員，即"},{"i":28,"start":105.056,"end":108.317,"en":"entry point to the worker, any dependencies this worker may have.","zh":"工作人員的入口點，該工作人員可能具有的任何依賴項。"},{"i":29,"start":108.446,"end":114.034,"en":"So any buckets, R2 buckets, which is object storage, the worker may rely on and so on.","zh":"所以任何桶，R2桶，這是物件存儲，worker可能依賴的等等。"},{"i":30,"start":114.146,"end":115.19,"en":"So that's already great.","zh":"所以這已經很棒了。"},{"i":31,"start":116.634,"end":122.365,"en":"Still, it's also something where you have to link these files together, where you have","zh":"儘管如此，您還必須將這些文件連結在一起，您必須"},{"i":32,"start":122.397,"end":124.676,"en":"to make sure that you have the correct entry point here and so on.","zh":"確保您在這裡有正確的入口點等等。"},{"i":33,"start":125.206,"end":127.421,"en":"But it's definitely all good and doable.","zh":"但這絕對是好的且可行。"},{"i":34,"start":127.855,"end":133.649,"en":"But when it comes to that bucket here, for example, you need to create it first.","zh":"但是，例如，當涉及到這裡的儲存桶時，您需要先建立它。"},{"i":35,"start":134.34,"end":138.128,"en":"You can do that in the Cloudflare dashboard, which means you need to log into your Cloudflare","zh":"您可以在 Cloudflare 儀表板中執行此操作，這表示您需要登入 Cloudflare"},{"i":36,"start":138.128,"end":142.269,"en":"account and create the bucket there, or you could run a command like this.","zh":"帳戶並在那裡建立儲存桶，或者您可以執行這樣的命令。"},{"i":37,"start":142.398,"end":144.869,"en":"So not too bad, but it's an extra step.","zh":"所以還不錯，但這是一個額外的步驟。"},{"i":38,"start":145.27,"end":148.271,"en":"And of course, you must make sure that you get the name right here.","zh":"當然，您必須確保您在此處獲得正確的名稱。"},{"i":39,"start":148.961,"end":152.765,"en":"So when you create it, you must have the same name as you then specify here.","zh":"因此，當您建立它時，您必須具有與此處指定的名稱相同的名稱。"},{"i":40,"start":153.118,"end":154.113,"en":"Otherwise, it will fail.","zh":"否則就會失敗。"},{"i":41,"start":154.161,"end":156.023,"en":"So you see where I'm getting at.","zh":"所以你明白我的意思了。"},{"i":42,"start":156.103,"end":158.975,"en":"There are things here that you can mess up.","zh":"這裡有些事情你可能會搞砸。"},{"i":43,"start":159.056,"end":163.742,"en":"And it's also annoying that you have to do this manually, especially now in a world where","zh":"而且你必須手動執行此操作也很煩人，尤其是在現在的世界中"},{"i":44,"start":163.806,"end":165.716,"en":"we use AI agents for a lot of work.","zh":"我們使用人工智慧代理來完成很多工作。"},{"i":45,"start":165.956,"end":167.786,"en":"That's the kind of problem Alchemy solves.","zh":"這就是 Alchemy 解決的問題。"},{"i":46,"start":168.155,"end":170.881,"en":"It's also not the first package to solve this problem.","zh":"它也不是第一個解決這個問題的包。"},{"i":47,"start":170.945,"end":173.783,"en":"There are others like Terraform, Pulumi, and so on.","zh":"還有其他的，如 Terraform、Pulumi 等。"},{"i":48,"start":174.215,"end":175.161,"en":"But Alchemy is amazing.","zh":"但煉金術是驚人的。"},{"i":49,"start":175.257,"end":175.706,"en":"You'll see why.","zh":"你就會明白為什麼。"},{"i":50,"start":176.395,"end":178.527,"en":"Because Alchemy is just a TypeScript program.","zh":"因為 Alchemy 只是一個 TypeScript 程式。"},{"i":51,"start":178.8,"end":181.429,"en":"Or if you use Alchemy, you're just writing TypeScript.","zh":"或者，如果您使用 Alchemy，那麼您只是在編寫 TypeScript。"},{"i":52,"start":181.782,"end":185.02,"en":"Specifically, you're writing TypeScript with Effect.","zh":"具體來說，您正在使用 Effect 編寫 TypeScript。"},{"i":53,"start":185.356,"end":187.328,"en":"Again, I talked about Effect in another video.","zh":"我在另一個視頻中再次談到了效果。"},{"i":54,"start":187.392,"end":191.832,"en":"It's a TypeScript library that gives you a certain way of writing your programs, certain","zh":"它是一個 TypeScript 函式庫，為您提供編寫程式的特定方式，某些"},{"i":55,"start":191.945,"end":196.513,"en":"rules and guidelines to follow, which is really great if you're working with AI agents","zh":"要遵循的規則和指南，如果您與人工智慧代理一起工作，這真的很棒"},{"i":56,"start":196.513,"end":201.869,"en":"because at least right now, if you have some rules and some guidelines for those agents,","zh":"因為至少現在，如果你對這些特工有一些規則和指導方針，"},{"i":57,"start":202.447,"end":206.43,"en":"the code they generate tends to be a bit better in my experience.","zh":"根據我的經驗，他們產生的程式碼往往會更好一些。"},{"i":58,"start":206.623,"end":212.324,"en":"So when you have installed that in your project, you can and you must or should create","zh":"因此，當您在專案中安裝了它後，您可以而且必須或應該創建"},{"i":59,"start":212.324,"end":213.962,"en":"such an alchemy.run.ts file.","zh":"這樣的 alchemy.run.ts 檔案。"},{"i":60,"start":214.412,"end":217.945,"en":"And in there you create your Alchemy stack.","zh":"並在其中創建您的 Alchemy 堆疊。"},{"i":61,"start":218.186,"end":219.744,"en":"And you can also have multiple stacks.","zh":"而且你還可以有多個堆疊。"},{"i":62,"start":219.792,"end":220.691,"en":"Now what is a stack?","zh":"現在什麼是堆疊？"},{"i":63,"start":220.996,"end":225.108,"en":"A stack is just a collection of resources that belong together.","zh":"堆疊只是屬於在一起的資源的集合。"},{"i":64,"start":225.172,"end":226.553,"en":"That's the idea of a stack.","zh":"這就是堆疊的想法。"},{"i":65,"start":226.842,"end":231.5,"en":"So one application that combines a bunch of different things could be one stack.","zh":"因此，一個組合了一堆不同事物的應用程式可能是一個堆疊。"},{"i":66,"start":232.143,"end":234.986,"en":"Now that stack has a name which is mostly for you.","zh":"現在該堆疊有了一個主要適合您的名稱。"},{"i":67,"start":235.693,"end":240.512,"en":"Then you define the provider because Alchemy does not just support Cloudflare, that's","zh":"然後定義提供者，因為 Alchemy 不僅支援 Cloudflare，"},{"i":68,"start":240.512,"end":245.09,"en":"amazing, it supports lots of providers and new ones are added basically every day.","zh":"令人驚訝的是，它支援許多提供者，基本上每天都會添加新的提供者。"},{"i":69,"start":245.491,"end":250.149,"en":"You can use it with Cloudflare, you can use it with AWS, with Hetzner, Fly, you see it","zh":"你可以將它與 Cloudflare 一起使用，你可以將它與 AWS 一起使用，與 Hetzner、Fly 一起使用，你看到了"},{"i":70,"start":250.149,"end":255.482,"en":"here and if you visit the website alchemy.run chances are high that there are many new","zh":"在這裡，如果您訪問網站 alchemy.run，很可能會發現許多新內容"},{"i":71,"start":256.252,"end":257.39,"en":"providers you can use.","zh":"您可以使用的提供者。"},{"i":72,"start":257.455,"end":260.709,"en":"It's also not just about hosting or about running your code.","zh":"它也不僅僅是關於託管或運行程式碼。"},{"i":73,"start":261.061,"end":263.562,"en":"There also are database providers.","zh":"還有資料庫提供者。"},{"i":74,"start":263.626,"end":267.986,"en":"So if you have a database in the cloud and you don't want to use the database offering","zh":"因此，如果您在雲端中擁有資料庫並且不想使用該資料庫產品"},{"i":75,"start":268.034,"end":274.447,"en":"of AWS or so, for example, and it has some utility functionality for even defining CLI","zh":"例如，AWS 等，它具有一些實用功能，甚至可以定義 CLI"},{"i":76,"start":274.447,"end":278.727,"en":"commands, Docker containers, and much, much more.","zh":"命令、Docker 容器等等。"},{"i":77,"start":279.256,"end":285.956,"en":"The idea behind Alchemy is that it is the library you need for defining everything","zh":"Alchemy 背後的想法是，它是定義一切所需的函式庫"},{"i":78,"start":286.213,"end":287.639,"en":"around your main application.","zh":"圍繞您的主要應用程式。"},{"i":79,"start":288.297,"end":292.487,"en":"Which mostly is the infrastructure where it runs, but potentially is more than that.","zh":"其中主要是它運作的基礎設施，但可能不只這些。"},{"i":80,"start":293.032,"end":298.265,"en":"So you have this stack, you define which provider you want, could be AWS, here it's Cloudflare.","zh":"所以你有了這個堆疊，你可以定義你想要的供應商，可以是 AWS，這裡是 Cloudflare。"},{"i":81,"start":298.811,"end":304.493,"en":"You then define a state, which is basically where Alchemy will store information about","zh":"然後，您定義一個狀態，這基本上是 Alchemy 儲存以下資訊的地方"},{"i":82,"start":304.605,"end":306.322,"en":"what was deployed before.","zh":"之前部署了什麼。"},{"i":83,"start":306.515,"end":313.192,"en":"Because the idea is that when you use Alchemy, if you deploy this, you deploy it via","zh":"因為這個想法是，當你使用 Alchemy 時，如果你部署它，你可以透過"},{"i":84,"start":313.192,"end":317.7,"en":"a CLI command and Alchemy will check What was deployed in the past?","zh":"CLI 指令和 Alchemy 將檢查過去部署了什麼？"},{"i":85,"start":318.149,"end":319.495,"en":"What was changed in the code?","zh":"程式碼中發生了什麼變化？"},{"i":86,"start":319.848,"end":321.964,"en":"Which changes do I need to apply?","zh":"我需要應用哪些變更？"},{"i":87,"start":322.413,"end":327.862,"en":"The first time you deploy, that means it will have to deploy everything, but the next","zh":"第一次部署時，這意味著必須部署所有內容，但下一次部署"},{"i":88,"start":327.862,"end":333.6,"en":"times thereafter, it will only make updates to the deployed resources if that suffices.","zh":"此後，它只會在足夠的情況下對已部署的資源進行更新。"},{"i":89,"start":334.434,"end":335.604,"en":"And that's the really nice thing.","zh":"這真是一件好事。"},{"i":90,"start":335.732,"end":338.441,"en":"Example, you don't need to do that manually in the dashboard.","zh":"例如，您不需要在儀表板中手動執行此操作。"},{"i":91,"start":338.745,"end":340.829,"en":"Instead, Alchemy does it for you.","zh":"相反，Alchemy 會為您做到這一點。"},{"i":92,"start":341.07,"end":346.263,"en":"And again, that's the same concept you may know from other infrastructure as code providers.","zh":"同樣，這與您可能從其他基礎設施（如程式碼提供者）中了解到的概念相同。"},{"i":93,"start":346.375,"end":348.892,"en":"So what's the kicker for Alchemy then?","zh":"那麼煉金術的關鍵是什麼呢？"},{"i":94,"start":349.822,"end":355.416,"en":"Well, what's nice is for one that it works with so many providers, but what I like a","zh":"嗯，好的一點是它可以與如此多的提供者合作，但我喜歡的是"},{"i":95,"start":355.416,"end":361.732,"en":"lot is that it embraces Effect, which again forces agents to write this code correctly.","zh":"重要的是它包含了 Effect，這再次迫使智能體正確編寫這段程式碼。"},{"i":96,"start":361.989,"end":368.016,"en":"And it does not just do that, but it also blends infrastructure with your application","zh":"它不僅做到了這一點，而且還將基礎設施與您的應用程式融合在一起"},{"i":97,"start":368.08,"end":368.369,"en":"logic.","zh":"邏輯。"},{"i":98,"start":368.417,"end":369.314,"en":"And you can see it here.","zh":"你可以在這裡看到它。"},{"i":99,"start":370.084,"end":375.278,"en":"I got my worker code here in worker.ts and it's no longer in the shape I had when I did","zh":"我在worker.ts 中取得了我的工作程式碼，但它不再是我之前的狀態了"},{"i":100,"start":375.31,"end":376.239,"en":"not use Alchemy.","zh":"不使用煉金術。"},{"i":101,"start":376.432,"end":378.723,"en":"There it was just such an exported object.","zh":"那裡就是這樣一個導出的物件。"},{"i":102,"start":379.139,"end":385.612,"en":"With Alchemy, my worker is a Cloudflare worker thing which I export coming from","zh":"對於 Alchemy，我的工作人員是 Cloudflare 工作人員，我從以下位置匯出該工作人員"},{"i":103,"start":385.949,"end":386.333,"en":"Alchemy.","zh":"煉金術。"},{"i":104,"start":387.087,"end":392.903,"en":"And that thing here defines a worker and most importantly, it defines the main code as","zh":"這裡的東西定義了一個工人，最重要的是，它將主要代碼定義為"},{"i":105,"start":393.255,"end":399.552,"en":"an effect using the Effect library, the code that should run when that worker is activated.","zh":"使用 Effect 函式庫的效果，即啟動該工作程序時應執行的程式碼。"},{"i":106,"start":400.385,"end":403.958,"en":"So when a request reaches that worker, for example, in this case, it'll send back some","zh":"因此，當請求到達該工作人員時，例如在本例中，它會被發回一些"},{"i":107,"start":404.006,"end":404.807,"en":"HTML code.","zh":"HTML 程式碼。"},{"i":108,"start":405.417,"end":406.732,"en":"Using Effect.","zh":"使用效果。"},{"i":109,"start":407.759,"end":409.011,"en":"That is what it does.","zh":"這就是它的作用。"},{"i":110,"start":409.107,"end":410.664,"en":"Now, that's in the worker.ts file.","zh":"現在，它位於worker.ts 檔案中。"},{"i":111,"start":410.808,"end":413.696,"en":"In alchemy.run, I'm importing that worker.","zh":"在 alchemy.run 中，我正在匯入該工作人員。"},{"i":112,"start":414.001,"end":416.296,"en":"Here it has name website, but that could be anything.","zh":"這裡它有名稱網站，但可以是任何東西。"},{"i":113,"start":416.825,"end":421.896,"en":"And then I yield it here as a dependency and Alchemy will automatically inject it so","zh":"然後我在這裡將它作為依賴項生成，Alchemy 會自動注入它，這樣"},{"i":114,"start":421.896,"end":423.34,"en":"that it's available in this function.","zh":"它可以在這個函數中使用。"},{"i":115,"start":423.645,"end":428.122,"en":"And then I return it like this, pointing at the website URL.","zh":"然後我像這樣返回它，指向網站 URL。"},{"i":116,"start":428.635,"end":429.711,"en":"It's just some internals.","zh":"這只是一些內部情況。"},{"i":117,"start":429.823,"end":434.651,"en":"In the end, this links the worker code to this stack here.","zh":"最後，這將工作程式碼連結到此處的該堆疊。"},{"i":118,"start":435.276,"end":437.424,"en":"And that's the really amazing part.","zh":"這才是真正令人驚奇的部分。"},{"i":119,"start":437.6,"end":443.756,"en":"Your application code and your infrastructure code, they live side by side and both use","zh":"您的應用程式程式碼和基礎設施代碼，它們並存並且都使用"},{"i":120,"start":443.772,"end":444.942,"en":"and leverage Effect.","zh":"和槓桿效應。"},{"i":121,"start":445.135,"end":449.944,"en":"Hence, you get the advantage of the increased type safety Effect gives you, of the extra","zh":"因此，您可以獲得 Effect 為您提供的增強類型的安全性以及額外的優勢"},{"i":122,"start":449.944,"end":452.444,"en":"guardrails it gives you for your agent.","zh":"它為您的代理提供了護欄。"},{"i":123,"start":452.893,"end":459.305,"en":"And as a developer, no matter if you're using AI agents or not, you have the advantage,","zh":"身為開發者，無論你是否使用人工智慧代理，你都有優勢，"},{"i":124,"start":459.385,"end":463.217,"en":"at least for me it's an advantage, that your business logic and the infrastructure is","zh":"至少對我來說這是一個優勢，你的業務邏輯和基礎設施是"},{"i":125,"start":463.649,"end":464.675,"en":"blended into each other.","zh":"相互融合。"},{"i":126,"start":464.996,"end":468.234,"en":"And for example, here you can't mess up names.","zh":"例如，在這裡你不能搞亂名字。"},{"i":127,"start":468.314,"end":474.181,"en":"If I move on to the other example with the bucket, you will see that in alchemy.run now","zh":"如果我繼續使用桶的另一個範例，您現在將在 alchemy.run 中看到它"},{"i":128,"start":474.309,"end":476.073,"en":"it's no longer just the website worker.","zh":"它不再只是網站工作人員。"},{"i":129,"start":476.137,"end":480.128,"en":"Instead, there also is a bucket which I'm importing from that worker file too.","zh":"相反，我也從該工作文件匯入一個儲存桶。"},{"i":130,"start":480.561,"end":485.066,"en":"Because in worker.ts I have my worker, but I also have the documents bucket.","zh":"因為在worker.ts中我有我的worker，但我也有文檔儲存桶。"},{"i":131,"start":485.611,"end":490.869,"en":"And this, once everything is deployed, will create the bucket on Cloudflare in this case.","zh":"在本例中，一旦部署了所有內容，就會在 Cloudflare 上建立儲存桶。"},{"i":132,"start":491.205,"end":496.111,"en":"So no need to manually create it with another CLI command or anything like this.","zh":"因此無需使用其他 CLI 命令或類似命令手動建立它。"},{"i":133,"start":496.656,"end":501.481,"en":"And yet it is deployed automatically and they're linked together because it's just TypeScript","zh":"然而它是自動部署的，並且它們連結在一起，因為它只是 TypeScript"},{"i":134,"start":501.481,"end":507.3,"en":"code where I use the documents bucket in my worker and Alchemy understands this relation,","zh":"我在工作人員中使用文件儲存桶的程式碼，並且 Alchemy 理解這種關係，"},{"i":135,"start":507.396,"end":512.189,"en":"makes sure that we are using the right references behind the scenes.","zh":"確保我們在幕後使用正確的參考。"},{"i":136,"start":512.638,"end":518.152,"en":"So the references you had to manually set up when not using Alchemy, where you made it","zh":"因此，在不使用 Alchemy 時，您必須手動設定引用，也就是您在哪裡建立的"},{"i":137,"start":518.152,"end":523.298,"en":"very clear which bucket with which name should be exposed to the worker, that is no longer","zh":"非常清楚應該向工作人員公開哪個儲存桶的名稱，這不再是"},{"i":138,"start":523.298,"end":524.933,"en":"needed when using Alchemy.","zh":"使用煉金術時需要。"},{"i":139,"start":525.51,"end":530.628,"en":"And then again, you can blend your business logic for a file upload service here with","zh":"然後，您可以將文件上傳服務的業務邏輯與"},{"i":140,"start":530.885,"end":531.962,"en":"the infrastructure code.","zh":"基礎設施代碼。"},{"i":141,"start":532.428,"end":535.657,"en":"And I like that a lot and I build all my projects with that.","zh":"我非常喜歡這一點，我用它來建立我所有的項目。"},{"i":142,"start":536.509,"end":542.02,"en":"And speaking of building projects with that, I have a 2-week program coming up.","zh":"說到以此建構項目，我即將進行為期兩週的計畫。"},{"i":143,"start":542.229,"end":547.322,"en":"Enrollments are not open yet, but you can sign up to be notified when they do open up.","zh":"註冊尚未開放，但您可以註冊以便在開放時收到通知。"},{"i":144,"start":547.692,"end":553.091,"en":"And in that program, I share how I build applications with Effect, with Alchemy, with","zh":"在該計劃中，我分享瞭如何使用 Effect、Alchemy 和"},{"i":145,"start":553.219,"end":555.899,"en":"Cloudflare, but most importantly, with AI agents.","zh":"Cloudflare，但最重要的是，具有 AI 代理程式。"},{"i":146,"start":555.947,"end":562.116,"en":"I share how I approach this right from the start regarding research, planning, um, and","zh":"我分享我如何從一開始就研究、規劃、嗯，以及"},{"i":147,"start":562.132,"end":567.404,"en":"then of course instructing agents, orchestrating agents step by step until we build and","zh":"然後當然是逐步指導代理、編排代理，直到我們建立並"},{"i":148,"start":567.484,"end":570.288,"en":"deploy a real project in that 2-week program.","zh":"在為期兩週的計劃中部署一個真實的專案。"},{"i":149,"start":570.929,"end":574.727,"en":"Uh, more details are on that page here, which you of course also find linked below the","zh":"呃，更多詳細資訊在該頁面上，您當然也可以在下面找到鏈接"},{"i":150,"start":574.727,"end":575.047,"en":"video.","zh":"影片."},{"i":151,"start":575.111,"end":579.694,"en":"And if that sounds interesting and you maybe also want to see in action how I use Alchemy","zh":"如果這聽起來很有趣，並且您可能還想看看我如何使用 Alchemy"},{"i":152,"start":579.742,"end":584.154,"en":"on more than just a dummy project here, that program may be interesting for you.","zh":"這裡不僅僅是一個虛擬項目，該程式可能對您來說很有趣。"},{"i":153,"start":584.957,"end":589.149,"en":"Besides that, what may also be interesting for you is I have open source projects like","zh":"除此之外，您可能還感興趣的是我有像這樣的開源項目"},{"i":154,"start":589.149,"end":594.866,"en":"this emailer GitHub repository, which is in the end an email sending service, a mass","zh":"這個電子郵件程式 GitHub 儲存庫，它最終是一個電子郵件發送服務，一個品質"},{"i":155,"start":594.914,"end":597.275,"en":"email sending service, which you can deploy yourself.","zh":"電子郵件發送服務，您可以自行部署。"},{"i":156,"start":597.34,"end":598.368,"en":"It's free, it's open source.","zh":"它是免費的，它是開源的。"},{"i":157,"start":599.01,"end":603.892,"en":"I'm not even selling it in any way right now, which you can use to send out marketing","zh":"我現在甚至不會以任何方式出售它，你可以用它來發送行銷訊息"},{"i":158,"start":603.925,"end":607.474,"en":"email if you don't wanna pay for services that do that for you.","zh":"如果您不想為為您提供服務的服務付費，請發送電子郵件。"},{"i":159,"start":607.602,"end":608.871,"en":"You need an AWS account.","zh":"您需要一個 AWS 帳戶。"},{"i":160,"start":609.0,"end":613.252,"en":"So here I'm not using Cloudflare because when I'm recording this, they don't have a mass","zh":"所以在這裡我沒有使用 Cloudflare 因為當我錄製這個時，他們沒有質量"},{"i":161,"start":613.316,"end":614.823,"en":"marketing email sending service.","zh":"行銷電子郵件發送服務。"},{"i":162,"start":615.624,"end":619.712,"en":"I'm using that, but you will see that if you dive into the code there, it's the same","zh":"我正在使用它，但是如果你深入研究那裡的程式碼，你會發現它是相同的"},{"i":163,"start":619.728,"end":624.329,"en":"logic just with way more services, AWS services here.","zh":"邏輯只是更多的服務，這裡是AWS服務。"},{"i":164,"start":624.842,"end":630.597,"en":"But in this code, you will see that I'm setting up SNS subscriptions, CloudWatch alarms.","zh":"但在此程式碼中，您將看到我正在設定 SNS 訂閱、CloudWatch 警報。"},{"i":165,"start":631.094,"end":636.657,"en":"You will see that if you dive deeper into this application, into the backend source,","zh":"你會發現，如果你深入研究這個應用程序，研究後端原始碼，"},{"i":166,"start":637.587,"end":644.234,"en":"There you will have the dispatcher here, which is a Lambda function, which is the","zh":"在這裡您將看到調度程序，它是一個 Lambda 函數，它是"},{"i":167,"start":644.267,"end":650.818,"en":"worker equivalent of AWS in the end, which is responsible for dispatching messages, getting","zh":"最後worker相當於AWS，負責調度訊息，獲取"},{"i":168,"start":650.85,"end":652.809,"en":"them from a queue and sending them out.","zh":"將它們從隊列中取出並將它們發送出去。"},{"i":169,"start":652.857,"end":659.665,"en":"And here you can see on a bigger project how Alchemy allows you to blend business","zh":"在這裡，您可以在一個更大的專案中看到 Alchemy 如何幫助您混合業務"},{"i":170,"start":659.745,"end":661.142,"en":"logic with infrastructure.","zh":"邏輯與基礎設施。"},{"i":171,"start":662.956,"end":669.255,"en":"And I think the type safety, the great usability for AI agents and the general idea","zh":"我認為類型安全、人工智慧代理的巨大可用性以及整體思路"},{"i":172,"start":669.848,"end":671.162,"en":"just is amazing.","zh":"真是太棒了。"},{"i":173,"start":671.306,"end":673.021,"en":"Infrastructure as code is not new.","zh":"基礎設施即程式碼並不是什麼新鮮事。"},{"i":174,"start":673.149,"end":673.919,"en":"No, it isn't.","zh":"不，不是。"},{"i":175,"start":674.271,"end":677.412,"en":"But Alchemy executes it perfectly for me at least.","zh":"但 Alchemy 至少對我來說完美地執行了它。"},{"i":176,"start":677.573,"end":683.134,"en":"So if you're building a project and you're looking to not create resources manually in","zh":"因此，如果您正在建立一個專案並且您希望不手動建立資源"},{"i":177,"start":683.166,"end":686.981,"en":"some dashboard and instead have an easy way, take a look at Alchemy.","zh":"一些儀表板，有一個簡單的方法，看看 Alchemy。"},{"i":178,"start":687.237,"end":691.837,"en":"And if you want to learn more and see more about it, maybe that program which I mentioned","zh":"如果您想了解更多信息並了解更多信息，也許我提到的那個程序"},{"i":179,"start":691.837,"end":692.863,"en":"is interesting to you too.","zh":"你也很有興趣。"}]},{"id":"51Eb4EtGqrI","title":"Stop treating Opus 5.5 like the other AI models","date":"20260925","file":"20260925_51Eb4EtGqrI_stop-treating-opus-55-like-the-other-ai-models.srt","cueCount":201,"issues":0,"duration":790,"cues":[{"i":1,"start":0.256,"end":3.69,"en":"Opus 5.5 is really a model from a different world.","zh":"Opus 5.5 確實是來自異世界的機種。"},{"i":2,"start":3.867,"end":4.797,"en":"I'm not joking here.","zh":"我不是開玩笑。"},{"i":3,"start":5.471,"end":8.793,"en":"We get new models every week and they're always hyped up.","zh":"我們每週都會推出新型號，而且它們總是大肆宣傳。"},{"i":4,"start":9.017,"end":12.644,"en":"We get amazing benchmark numbers and it's the same for Opus 5.5, of course.","zh":"我們得到了驚人的基準數據，當然 Opus 5.5 也是如此。"},{"i":5,"start":13.27,"end":17.779,"en":"But I've been using this model for the last 2 days and it really lives up to the hype.","zh":"但過去兩天我一直在使用這個模型，它確實不負眾望。"},{"i":6,"start":18.228,"end":20.378,"en":"It is mind-blowingly good.","zh":"這是令人興奮的好。"},{"i":7,"start":20.892,"end":26.957,"en":"Now, still, there are a couple of things I found and some things also Anthropic published","zh":"現在，我仍然發現了一些東西，而 Anthropic 也發布了一些東西"},{"i":8,"start":27.214,"end":30.006,"en":"you should be aware of when using it to get the most out of it.","zh":"您在使用它時應該注意，以充分利用它。"},{"i":9,"start":30.423,"end":37.244,"en":"And my first recommendation is to not treat Opus 5.5 like it's a dumb model or it","zh":"我的第一個建議是不要把 Opus 5.5 當作一個愚蠢的模型，或者它"},{"i":10,"start":37.404,"end":41.801,"en":"always wants to do less or more than you want it to do, because we all know that from","zh":"總是想做比你想要做的更少或更多的事情，因為我們都知道從"},{"i":11,"start":41.994,"end":42.684,"en":"other models.","zh":"其他型號。"},{"i":12,"start":43.197,"end":50.146,"en":"For example, the GPT-6 Astra model is really intelligent on paper and it can do amazing","zh":"例如，GPT-6 Astra 模型在紙面上確實很智能，它可以做出驚人的事情"},{"i":13,"start":50.259,"end":50.483,"en":"work.","zh":"工作。"},{"i":14,"start":50.981,"end":56.164,"en":"But boy, does it like doing stuff that you don't want it to do or stop too early.","zh":"但是，天哪，這是否喜歡做一些你不希望它做的事情或太早停止。"},{"i":15,"start":56.983,"end":57.657,"en":"We've all been there.","zh":"我們都去過那裡。"},{"i":16,"start":57.962,"end":59.534,"en":"Plenty of models are like this.","zh":"很多模型都是這樣的。"},{"i":17,"start":60.031,"end":62.181,"en":"Opus 5.5 truly is different.","zh":"Opus 5.5 確實與眾不同。"},{"i":18,"start":62.373,"end":68.405,"en":"Now, it's absolutely possible still that it forgets to do something you want it to do","zh":"現在，它仍然有可能忘記做你想讓它做的事情"},{"i":19,"start":68.629,"end":72.656,"en":"or that it does a bit more, but it's so much better than the other models here.","zh":"或者說它做得更多一點，但它比這裡的其他模型好得多。"},{"i":20,"start":73.185,"end":77.228,"en":"If I wanted to draw a graph here on how","zh":"如果我想在這裡畫一個圖表來說明如何"},{"i":21,"start":78.479,"end":84.302,"en":"consistent it is, I would say Opus 5.5 is somewhere here.","zh":"這是一致的，我想說 Opus 5.5 就在這裡。"},{"i":22,"start":84.928,"end":91.704,"en":"It's consistently doing good work, whereas other models often have a way","zh":"它始終表現良好，而其他模型通常有辦法"},{"i":23,"start":91.977,"end":94.369,"en":"higher variance, maybe something like this.","zh":"更高的方差，也許是這樣的。"},{"i":24,"start":95.108,"end":98.768,"en":"Though actually other models aren't that much smarter than Opus.","zh":"儘管實際上其他型號並不比 Opus 聰明多少。"},{"i":25,"start":99.362,"end":105.752,"en":"But yeah, so that would be other models, Opus, but Opus is just amazingly","zh":"但是，是的，那就是其他型號，Opus，但 Opus 真是令人驚訝"},{"i":26,"start":105.785,"end":107.84,"en":"consistent in my experience.","zh":"與我的經驗一致。"},{"i":27,"start":108.37,"end":111.741,"en":"So that's the first thing you absolutely should know when working with it.","zh":"所以這是你在使用它時絕對應該知道的第一件事。"},{"i":28,"start":112.111,"end":116.349,"en":"You don't need to handhold it as much as you do with other models.","zh":"您不需要像其他型號那樣頻繁地握住它。"},{"i":29,"start":116.846,"end":123.245,"en":"The second recommendation is that you really want to try using medium","zh":"第二個建議是你真的想嘗試使用medium"},{"i":30,"start":123.822,"end":124.415,"en":"thinking effort.","zh":"思考努力。"},{"i":31,"start":124.544,"end":131.263,"en":"Now, the great thing about Opus 5.5 is that it goes really far in your subscription usage,","zh":"現在，Opus 5.5 的偉大之處在於它在您的訂閱使用方面發揮了巨大作用，"},{"i":32,"start":131.92,"end":133.989,"en":"even on extra high reasoning.","zh":"即使是在極高的推理上。"},{"i":33,"start":134.646,"end":136.218,"en":"I have the $200 subscription.","zh":"我有 200 美元的訂閱。"},{"i":34,"start":136.266,"end":137.357,"en":"I've been using it a ton.","zh":"我已經用了很多次了。"},{"i":35,"start":137.549,"end":142.793,"en":"I have hit the limit at some point, but I've consistently been using X-High.","zh":"我在某些時候已經達到了極限，但我一直在使用 X-High。"},{"i":36,"start":143.226,"end":144.927,"en":"To push it to the limit there.","zh":"將其推向那裡的極限。"},{"i":37,"start":145.313,"end":146.308,"en":"I actually have 2 subscriptions.","zh":"我實際上有 2 個訂閱。"},{"i":38,"start":146.533,"end":148.796,"en":"On one of them, I've consistently used Extra High.","zh":"在其中之一上，我一直使用 Extra High。"},{"i":39,"start":149.342,"end":155.169,"en":"On the other subscription, I switch a bit more and I often stick to Medium and that goes","zh":"在另一個訂閱上，我切換得更多一些，並且經常堅持使用 Medium，這就是"},{"i":40,"start":155.506,"end":156.454,"en":"even farther then.","zh":"甚至更遠。"},{"i":41,"start":156.582,"end":159.375,"en":"So it's a lot of usage, but even with Extra High, it's okay.","zh":"所以使用次數很多，但即使使用 Extra High，也沒關係。"},{"i":42,"start":159.937,"end":165.186,"en":"But the official recommendation, and I can confirm this, is that you wanna try starting","zh":"但官方的建議，我可以確認這一點，是你想嘗試開始"},{"i":43,"start":165.235,"end":170.179,"en":"with Medium effort to simply go further, to have less usage consumption.","zh":"中等努力，只是走得更遠，減少使用消耗。"},{"i":44,"start":170.773,"end":175.751,"en":"And then maybe ramp it up to high or x-high if you're not happy with the results, or","zh":"如果您對結果不滿意，則可以將其提高到高或x高，或者"},{"i":45,"start":175.831,"end":181.659,"en":"if you know that you're going to tackle a complex task where you need maximum intelligence.","zh":"如果您知道您將要處理一項需要最大程度智力的複雜任務。"},{"i":46,"start":182.237,"end":186.364,"en":"Now, if you look at the official benchmarks which Anthropic published, you can see the","zh":"現在，如果您查看 Anthropic 發布的官方基準測試，您可以看到"},{"i":47,"start":186.412,"end":187.038,"en":"reason for this.","zh":"這樣做的原因。"},{"i":48,"start":187.713,"end":194.055,"en":"Here on Terminal Bench, you see medium is not that far below high, and high and x-high","zh":"在終端工作台上，您會看到中位數並不遠低於高值，而高值和超高值則相差不遠"},{"i":49,"start":194.296,"end":195.645,"en":"are almost on the same level.","zh":"幾乎處於同一水平。"},{"i":50,"start":196.046,"end":202.439,"en":"Interestingly enough, on the Frontier code and CursorBench benchmarks here, there even","zh":"有趣的是，在 Frontier 程式碼和 CursorBench 基準測試中，甚至有"},{"i":51,"start":202.792,"end":208.639,"en":"is a decline from high to x-high, or it stays pretty much on the same level.","zh":"是從高點下降到極高點，或幾乎保持在同一水平。"},{"i":52,"start":209.153,"end":214.63,"en":"So put in other words, x-high instead of high doesn't make a lot of sense.","zh":"換句話說，x-high 代替 high 沒有多大意義。"},{"i":53,"start":215.24,"end":217.232,"en":"I did it for testing purposes, as mentioned.","zh":"如前所述，我這樣做是為了測試目的。"},{"i":54,"start":217.505,"end":221.601,"en":"But as I also mentioned, if you just use medium, and I've done that on the other account,","zh":"但正如我也提到的，如果你只使用媒介，而我已經在另一個帳戶上這樣做了，"},{"i":55,"start":222.002,"end":225.416,"en":"you get pretty great results and there isn't that much of a difference.","zh":"你會得到非常好的結果，而且沒有太大的差別。"},{"i":56,"start":225.913,"end":230.177,"en":"Now, kind of related to that, and we can see that here in the benchmarks too, you really","zh":"現在，與此相關，我們也可以在基準測試中看到，您確實"},{"i":57,"start":230.177,"end":236.893,"en":"should avoid max and low because the extra intelligence you get out of max is really","zh":"應該避免最大值和最小值，因為從最大值中獲得的額外智力實際上是"},{"i":58,"start":236.893,"end":239.506,"en":"not that great, especially compared to high here.","zh":"不是那麼好，尤其是與這裡的高水準相比。"},{"i":59,"start":240.18,"end":243.594,"en":"Also on this benchmark, it's even lower, interestingly enough.","zh":"有趣的是，在這個基準上，它甚至更低。"},{"i":60,"start":244.347,"end":245.806,"en":"And low is far too dumb.","zh":"而且低也太愚蠢了。"},{"i":61,"start":246.127,"end":252.537,"en":"There is a huge gap between medium and low on on all these benchmarks, but the cost increase","zh":"在所有這些基準上，中低之間存在巨大差距，但成本增加"},{"i":62,"start":252.537,"end":255.197,"en":"you have on max just doesn't make it worth it.","zh":"你有最大的只是不值得。"},{"i":63,"start":255.646,"end":259.636,"en":"Even if you would have a better result, I mean, it's slightly better here, even then","zh":"即使你會得到更好的結果，我的意思是，即使如此，這裡也稍​​微好一些"},{"i":64,"start":259.909,"end":260.983,"en":"you're just paying way more.","zh":"你只是付出了更多。"},{"i":65,"start":261.335,"end":264.236,"en":"This is log scale here, so you're paying way more.","zh":"這裡是對數刻度，所以你要付出更多。"},{"i":66,"start":264.7,"end":268.322,"en":"Therefore, you should avoid max and low.","zh":"因此，您應該避免 max 和 low。"},{"i":67,"start":269.027,"end":275.87,"en":"The ideal level really is medium or high or maybe also X-High, but Medium is a good default.","zh":"理想的等級確實是中或高，或者也可能是極高，但中是一個很好的預設值。"},{"i":68,"start":276.334,"end":282.359,"en":"Now, when working on tasks with Opus 5.5, the Anthropic team recommends","zh":"現在，當使用 Opus 5.5 處理任務時，Anthropic 團隊建議"},{"i":69,"start":282.968,"end":289.024,"en":"clearly describing when a task should be considered done to make sure that Opus doesn't","zh":"清楚描述任務何時應被視為完成，以確保 Opus 不會"},{"i":70,"start":289.024,"end":289.553,"en":"stop early.","zh":"早點停下來。"},{"i":71,"start":289.793,"end":294.167,"en":"Now, in my experience, I didn't really need to do that, but that is probably also because","zh":"現在，根據我的經驗，我真的不需要這樣做，但這也可能是因為"},{"i":72,"start":294.199,"end":300.176,"en":"I have agent skills and I have an agents.md and Claude.md files where I already describe","zh":"我有代理技能，並且有一個 Agents.md 和 Claude.md 文件，我已經在其中描述了"},{"i":73,"start":300.208,"end":306.849,"en":"kind of the loop or the self verification, self-validation steps Opus should go through","zh":"Opus 應該經歷的循環或自我驗證的類型、自我驗證步驟"},{"i":74,"start":306.881,"end":309.979,"en":"or any AI agent should go through when working on a task.","zh":"或任何人工智慧代理在執行任務時都應該經歷的過程。"},{"i":75,"start":310.332,"end":314.474,"en":"So for example, one of the skills I'm using, my implement plan skill, clearly says that","zh":"例如，我正在使用的技能之一，我的實施計劃技能，清楚地表明了這一點"},{"i":76,"start":314.474,"end":317.428,"en":"when all tasks are done, it should review the full diff and so on.","zh":"當所有任務完成後，它應該檢查完整的差異等等。"},{"i":77,"start":317.861,"end":322.324,"en":"And earlier before that, I already said that verify every task before moving on, run","zh":"在此之前，我已經說過在繼續之前驗證每項任務，運行"},{"i":78,"start":322.356,"end":328.327,"en":"the checks, the plane names, and check anything in the UI with a real browser, with agent","zh":"檢查、飛機名稱，並使用真實的瀏覽器和代理程式檢查 UI 中的任何內容"},{"i":79,"start":328.359,"end":328.713,"en":"browser.","zh":"瀏覽器。"},{"i":80,"start":328.761,"end":334.217,"en":"So I already have some instructions here and I have other skills too where I tell agents","zh":"所以我已經在這裡得到了一些指示，並且在告訴代理時我也有其他技能"},{"i":81,"start":334.474,"end":338.498,"en":"that they should verify their work and that this is part of the implementation.","zh":"他們應該驗證自己的工作，這是實施的一部分。"},{"i":82,"start":338.562,"end":340.646,"en":"But it is something you should do.","zh":"但這是你該做的事情。"},{"i":83,"start":340.87,"end":345.664,"en":"And if you're working on a specific task where it's maybe not clear what the endpoint","zh":"如果您正在執行一項特定任務，可能不清楚端點是什麼"},{"i":84,"start":345.76,"end":349.335,"en":"would be, put that in your prompt, put that in your plan.","zh":"就是，將其放入您的提示中，將其放入您的計劃中。"},{"i":85,"start":349.623,"end":351.483,"en":"And you don't need to use plan mode for that, by the way.","zh":"順便說一句，您不需要為此使用計劃模式。"},{"i":86,"start":351.547,"end":354.818,"en":"Just bring it up in the discussion with Claude before it gets to work.","zh":"只需在開始工作之前在與 Claude 的討論中提出即可。"},{"i":87,"start":355.379,"end":358.649,"en":"And it should ensure that Opus keeps on working and keeps on going.","zh":"它應該確保 Opus 繼續工作並繼續發展。"},{"i":88,"start":359.146,"end":365.141,"en":"By the way, I also wrote down all these things here in an article on my page for an upcoming","zh":"順便說一下，我還在我的頁面上的一篇文章中寫下了所有這些內容，以便即將發布"},{"i":89,"start":365.253,"end":368.476,"en":"2-week program, which may be interesting for you.","zh":"為期兩週的課程，您可能會感興趣。"},{"i":90,"start":368.62,"end":373.525,"en":"Enrollments are not open up yet, but you can pre-register without any obligations to","zh":"報名尚未開放，但您可以預先註冊，無需承擔任何義務"},{"i":91,"start":373.525,"end":374.807,"en":"be notified when it starts.","zh":"開始時收到通知。"},{"i":92,"start":374.872,"end":381.075,"en":"Because in this 2-week program, I will show you how I build real applications end to","zh":"因為在這個為期兩週的計劃中，我將向您展示我如何建立真正的應用程式"},{"i":93,"start":381.187,"end":387.263,"en":"end from research, planning, discussions with the AI to the full implementation using","zh":"從研究、規劃、與人工智慧的討論到使用的全面實施"},{"i":94,"start":387.375,"end":392.539,"en":"multiple agents, orchestrating agents, making sure sure that agents self-verify their","zh":"多個代理，協調代理，確保代理自我驗證他們的"},{"i":95,"start":392.651,"end":393.662,"en":"work and so on.","zh":"工作等等。"},{"i":96,"start":394.048,"end":395.011,"en":"It's a 2-week program.","zh":"這是一個為期兩週的計劃。"},{"i":97,"start":395.139,"end":397.659,"en":"As mentioned, we build a full app, we deploy it in the end.","zh":"如前所述，我們建立了一個完整的應用程序，最後部署了它。"},{"i":98,"start":398.285,"end":399.473,"en":"This may be interesting for you.","zh":"這對你來說可能很有趣。"},{"i":99,"start":399.826,"end":402.249,"en":"So of course you find a link below if you want to learn more.","zh":"因此，如果您想了解更多信息，當然可以找到下面的連結。"},{"i":100,"start":402.602,"end":405.395,"en":"And below you also find the link to this article I mentioned.","zh":"您還可以在下面找到我提到的這篇文章的連結。"},{"i":101,"start":405.973,"end":410.531,"en":"In that article and related to my previous point, I also basically described that you","zh":"在那篇文章中，與我之前的觀點相關，我也基本上描述了你"},{"i":102,"start":410.563,"end":411.366,"en":"want to build a loop.","zh":"想要建立一個循環。"},{"i":103,"start":411.43,"end":416.823,"en":"And here I'm not talking about the loop engineering or software factory hype, But about","zh":"在這裡我不是說循環工程或軟體工廠炒作，而是關於"},{"i":104,"start":416.823,"end":418.654,"en":"something which of course is kind of related.","zh":"當然有某種相關的東西。"},{"i":105,"start":419.056,"end":425.304,"en":"No matter which agent you're working with, you want to always tell them that they should","zh":"無論您與哪個代理商合作，您都希望始終告訴他們應該"},{"i":106,"start":425.336,"end":428.693,"en":"verify their own work and you should make sure that they can verify it.","zh":"驗證他們自己的工作，你應該確保他們可以驗證它。"},{"i":107,"start":429.014,"end":434.812,"en":"Unit tests are the bare minimum, so to say, but often you can also have them run integration","zh":"可以這麼說，單元測試是最低限度的，但通常您也可以讓它們運行集成"},{"i":108,"start":434.812,"end":439.519,"en":"tests, but also simply drive a browser manually, have them drive a browser manually,","zh":"測試，但也只是手動驅動瀏覽器，讓他們手動驅動瀏覽器，"},{"i":109,"start":439.856,"end":445.375,"en":"instruct your model to verify verify the work it did, your agent, I mean.","zh":"我的意思是，指示你的模型驗證它所做的工作，你的代理。"},{"i":110,"start":445.872,"end":448.677,"en":"And that can look different depending on what you're working.","zh":"根據您的工作內容，情況可能會有所不同。"},{"i":111,"start":448.774,"end":453.198,"en":"If you're working on a website, you want to instruct it, as I did in my skill here, that","zh":"如果你在一個網站上工作，你想指導它，就像我在這裡所做的那樣，"},{"i":112,"start":453.198,"end":458.696,"en":"it should take a look at the UI using Agent Browser in my case here, or any other browser","zh":"在我的例子中，應該使用代理瀏覽器或任何其他瀏覽器來查看 UI"},{"i":113,"start":458.696,"end":459.69,"en":"tool you may have installed.","zh":"您可能已經安裝的工具。"},{"i":114,"start":460.139,"end":466.968,"en":"So give your agent, give Opus clear instructions to validate its work and tell it, that's","zh":"所以給你的代理，給 Opus 明確的指示來驗證它的工作並告訴它，那就是"},{"i":115,"start":466.968,"end":470.27,"en":"the important part, tell it how to validate that work.","zh":"重要的部分是告訴它如何驗證該工作。"},{"i":116,"start":470.671,"end":473.075,"en":"So don't let it guess, don't be vague.","zh":"所以不要讓它猜測，不要含糊其辭。"},{"i":117,"start":473.123,"end":474.566,"en":"I mean, that's in general a good idea.","zh":"我的意思是，這總的來說是個好主意。"},{"i":118,"start":474.887,"end":477.274,"en":"Don't be vague when prompting your agents.","zh":"提示您的代理商時不要含糊其辭。"},{"i":119,"start":477.787,"end":483.171,"en":"Now, when doing any kind of frontend web development work or any other work that involves","zh":"現在，在進行任何類型的前端 Web 開發工作或任何其他涉及的工作時"},{"i":120,"start":483.171,"end":488.059,"en":"styling, that includes the creation of presentations, for example, of course, clearly","zh":"樣式，包括簡報的創建，例如，當然，顯然"},{"i":121,"start":488.059,"end":492.45,"en":"specify which styles you don't want or you want.","zh":"指定您不想要或想要哪些樣式。"},{"i":122,"start":493.011,"end":493.972,"en":"Don't be vague there.","zh":"那裡不要含糊。"},{"i":123,"start":494.196,"end":496.552,"en":"Again, being vague, always a bad idea.","zh":"再說一次，含糊其辭總是個壞主意。"},{"i":124,"start":497.081,"end":499.693,"en":"Don't say, don't use a generic style.","zh":"不要說，不要使用通用樣式。"},{"i":125,"start":500.366,"end":502.918,"en":"Instead, clearly specify what you don't want.","zh":"相反，明確指出你不想要什麼。"},{"i":126,"start":503.175,"end":509.465,"en":"No purple gradients, no eyebrows above the titles and so on, these little extra","zh":"沒有紫色漸變，標題上方沒有眉毛等等，這些額外的東西"},{"i":127,"start":509.465,"end":511.182,"en":"subtitles agents love to add.","zh":"字幕代理喜歡添加。"},{"i":128,"start":511.599,"end":515.723,"en":"Be specific about what you don't want and/or what you want.","zh":"具體說明您不想要什麼和/或您想要什麼。"},{"i":129,"start":516.189,"end":522.608,"en":"Again, it's basically the same for all those agents, but Opus 5.5, this model, is really","zh":"再說一遍，所有這些代理基本上都是一樣的，但 Opus 5.5 這個模型確實是"},{"i":130,"start":522.672,"end":526.892,"en":"good at following these instructions and some other models are a bit more...","zh":"善於遵循這些說明，而其他一些型號則更多......"},{"i":131,"start":527.566,"end":529.36,"en":"Flexible regarding that, to put it like this.","zh":"靈活一點，可以這麼說。"},{"i":132,"start":529.585,"end":534.68,"en":"So take advantage of the fact that Opus 5.5 is good at following instructions.","zh":"因此，請利用 Opus 5.5 擅長遵循指示的事實。"},{"i":133,"start":535.113,"end":536.651,"en":"This next point is an interesting one.","zh":"下一點很有趣。"},{"i":134,"start":537.18,"end":542.837,"en":"Not just for Opus 5.5, but again, because it does so well at following instructions and","zh":"不僅適用於 Opus 5.5，而且還因為它在遵循說明和操作方面做得非常好"},{"i":135,"start":542.885,"end":547.308,"en":"because it does so well at orchestrating other agents, encourage it to do so.","zh":"因為它在協調其他代理方面做得很好，所以鼓勵它這樣做。"},{"i":136,"start":547.708,"end":553.285,"en":"Now, chances are high that if you're using Opus through Claude Code, it will use subagents","zh":"現在，如果您透過 Claude Code 使用 Opus，它很可能會使用子代理"},{"i":137,"start":553.365,"end":553.717,"en":"on its own.","zh":"靠它自己。"},{"i":138,"start":553.942,"end":555.722,"en":"But it doesn't hurt to tell it.","zh":"但說出來也沒什麼不好。"},{"i":139,"start":555.77,"end":561.16,"en":"Again, in my implement plan skill, which is basically getting activated whenever we settled","zh":"再說一次，在我的實施計劃技能中，每當我們安定下來時，它基本上就會被激活"},{"i":140,"start":561.16,"end":565.202,"en":"on a plan that should now be implemented, and it's one of many skills, in that skill,","zh":"制定一個現在應該實施的計劃，這是眾多技能之一，在該技能中，"},{"i":141,"start":565.411,"end":572.052,"en":"I tell it to outsource a task to subagents when working on more complex tasks or parallel","zh":"我告訴它在處理更複雜的任務或並行任務時將任務外包給子代理"},{"i":142,"start":572.068,"end":572.356,"en":"tasks.","zh":"任務。"},{"i":143,"start":573.03,"end":574.105,"en":"And that's missing an S here.","zh":"這裡缺一個S。"},{"i":144,"start":574.57,"end":581.179,"en":"So I'm telling it to do that, not because it needs to and it wouldn't do it otherwise,","zh":"所以我告訴它要這樣做，不是因為它需要這樣做，否則它不會這樣做，"},{"i":145,"start":581.612,"end":584.787,"en":"But because it increases the chance of it doing it.","zh":"但因為它增加了這樣做的機會。"},{"i":146,"start":584.883,"end":587.913,"en":"And of course, also because that skill is getting used for other models too.","zh":"當然，也是因為該技能也被用於其他模型。"},{"i":147,"start":588.33,"end":592.483,"en":"But Opus 5.5 is really good at orchestrating.","zh":"但 Opus 5.5 確實擅長編排。"},{"i":148,"start":592.9,"end":595.016,"en":"And it's not just the built-in subagents feature.","zh":"這不僅僅是內建的子代理功能。"},{"i":149,"start":595.145,"end":601.911,"en":"What I also like to do is have a main orchestration agent, one Claude Code","zh":"我還喜歡做的是有一個主要的編排代理，一個 Claude Code"},{"i":150,"start":601.911,"end":607.603,"en":"session, which I have on my machine or some remote machine, which can access other agents.","zh":"會話，我在我的機器或某些遠端機器上有它，它可以存取其他代理。"},{"i":151,"start":607.667,"end":609.607,"en":"And Herder is really amazing here.","zh":"赫爾德在這裡真的很棒。"},{"i":152,"start":610.217,"end":611.694,"en":"Here's what I'm talking about.","zh":"這就是我要說的。"},{"i":153,"start":611.758,"end":614.872,"en":"I have one agent's session here in Herder.","zh":"我在赫爾德有一位特工的會議。"},{"i":154,"start":614.952,"end":619.334,"en":"I mean, I have all my agent sessions here, but I have one agent's session, which is a","zh":"我的意思是，我的所有代理會話都在這裡，但我有一個代理會話，這是一個"},{"i":155,"start":619.382,"end":623.684,"en":"Claude Code session, which is in a project where I keep track of an index of all the","zh":"克勞德代碼會話，這是在一個項目中，我在其中跟踪所有"},{"i":156,"start":623.7,"end":625.69,"en":"agents working across multiple machines.","zh":"跨多台機器工作的代理。"},{"i":157,"start":626.204,"end":633.09,"en":"And then I can ask this agent here to instruct other agents to","zh":"然後我可以請這位特工指示其他特工"},{"i":158,"start":633.09,"end":635.433,"en":"do other stuff or to check in on other agents.","zh":"做其他事情或檢查其他代理。"},{"i":159,"start":635.658,"end":637.295,"en":"This is not the only way of me working.","zh":"這不是我工作的唯一方式。"},{"i":160,"start":637.359,"end":642.591,"en":"I do dive into those other sessions too, but this is a nice way of orchestrating multiple","zh":"我也深入研究了其他會議，但這是編排多個會議的好方法"},{"i":161,"start":642.639,"end":646.953,"en":"agents that maybe need to work in parallel, or if I lost track of what some agent was","zh":"可能需要並行工作的代理，或者如果我不知道某個代理是什麼"},{"i":162,"start":647.065,"end":647.338,"en":"doing.","zh":"正在做。"},{"i":163,"start":647.787,"end":652.085,"en":"And that works really well for me because Opus is so good at orchestrating.","zh":"這對我來說非常有效，因為 Opus 非常擅長編排。"},{"i":164,"start":652.133,"end":653.881,"en":"So that is something for you to consider.","zh":"所以這是你需要考慮的事情。"},{"i":165,"start":654.266,"end":659.173,"en":"Actively encourage it to do that, to create those subagents and to orchestrate.","zh":"積極鼓勵它這樣做，創建這些子代理並進行協調。"},{"i":166,"start":659.879,"end":665.492,"en":"And my last tip or recommendation is give it complex work.","zh":"我的最後一個建議或建議是給它複雜的工作。"},{"i":167,"start":665.828,"end":666.438,"en":"It can do it.","zh":"它可以做到。"},{"i":168,"start":667.16,"end":674.138,"en":"Big mistake I see from many developers is that you try to micromanage those","zh":"我從許多開發人員那裡看到的一個大錯誤是，你試圖對這些進行微觀管理"},{"i":169,"start":674.171,"end":674.507,"en":"agents.","zh":"代理。"},{"i":170,"start":674.812,"end":679.529,"en":"And that was necessary a year ago, or for some models, even a few months ago.","zh":"一年前，或對於某些模型，甚至幾個月前，這是必要的。"},{"i":171,"start":680.107,"end":684.374,"en":"For some models like GPT-6 Astra, it still is kind of necessary.","zh":"對於像 GPT-6 Astra 這樣的一些型號，它仍然是必要的。"},{"i":172,"start":684.438,"end":689.059,"en":"You can give it big tasks, but you really need to give it some guardrails and instructions","zh":"你可以給它很大的任務，但你確實需要給它一些護欄和指示"},{"i":173,"start":689.075,"end":691.594,"en":"to make sure it sticks to that task and so on.","zh":"確保它堅持該任務等等。"},{"i":174,"start":691.642,"end":692.829,"en":"And it's a bit difficult to wield.","zh":"而且操作起來有點困難。"},{"i":175,"start":693.102,"end":699.418,"en":"But with Opus 5.5, my experience is that it just is really amazing at big tasks.","zh":"但對於 Opus 5.5，我的經驗是它在完成大型任務時確實令人驚嘆。"},{"i":176,"start":699.738,"end":705.333,"en":"I had it migrate an entire project, an entire website from one tech stack to another.","zh":"我讓它將整個專案、整個網站從一個技術堆疊遷移到另一個技術堆疊。"},{"i":177,"start":705.429,"end":708.875,"en":"And I'm not talking about a static site with 3 pages here.","zh":"我這裡討論的不是 3 個頁面的靜態網站。"},{"i":178,"start":709.276,"end":710.863,"en":"It just kept on working.","zh":"它只是繼續工作。"},{"i":179,"start":711.12,"end":716.105,"en":"I migrated an entire library to use Effect, which is an amazing TypeScript library I","zh":"我遷移了整個庫來使用 Effect，這是一個令人驚嘆的 TypeScript 庫"},{"i":180,"start":716.105,"end":717.852,"en":"talked about in another video on this channel.","zh":"在該頻道的另一個視頻中談到過。"},{"i":181,"start":718.269,"end":720.994,"en":"And it kept on working for hours and worked its way through it.","zh":"它持續工作了幾個小時並完成了它。"},{"i":182,"start":721.074,"end":723.126,"en":"And I have a beautiful, great result.","zh":"我得到了一個美麗而偉大的結果。"},{"i":183,"start":723.703,"end":725.532,"en":"Obviously with Concreto, Great prompts.","zh":"顯然，使用 Concreto，提示很棒。"},{"i":184,"start":725.58,"end":728.728,"en":"So planning, discussions, that's all important.","zh":"所以計劃、討論，這都很重要。"},{"i":185,"start":728.777,"end":730.977,"en":"I'm not talking about vague prompts here.","zh":"我不是在這裡談論模糊的提示。"},{"i":186,"start":731.507,"end":737.017,"en":"But once you did that work, once you made sure that you're on the same page, once you","zh":"但是一旦你完成了這項工作，一旦你確保你們在同一頁上，一旦你"},{"i":187,"start":737.033,"end":742.43,"en":"have a clear plan, and not just you, but the model has it too, give it complex tasks.","zh":"有一個清晰的計劃，不只是你，模型也有，給它複雜的任務。"},{"i":188,"start":742.735,"end":746.782,"en":"Make it clear, as I explained, when that task is complete.","zh":"正如我所解釋的，要明確指出任務何時完成。"},{"i":189,"start":747.152,"end":750.316,"en":"Make it clear which checks it should perform.","zh":"明確應執行哪些檢查。"},{"i":190,"start":750.686,"end":753.127,"en":"Also maybe specify which pitfalls exist.","zh":"也可以指定存在哪些陷阱。"},{"i":191,"start":753.496,"end":755.23,"en":"Or what it should watch out for.","zh":"或者說應該注意什麼。"},{"i":192,"start":755.92,"end":758.311,"en":"But then give it complex tasks.","zh":"但然後給它複雜的任務。"},{"i":193,"start":758.648,"end":764.154,"en":"Don't prompt on small tasks or don't just work on small tasks.","zh":"不要提示小任務，或不要只處理小任務。"},{"i":194,"start":764.571,"end":765.438,"en":"Be ambitious.","zh":"要有雄心壯志。"},{"i":195,"start":765.566,"end":766.224,"en":"It can do it.","zh":"它可以做到。"},{"i":196,"start":766.272,"end":771.232,"en":"This is really a model that can reliably work through complex big tasks.","zh":"這確實是一個可以可靠地完成複雜大任務的模型。"},{"i":197,"start":771.665,"end":773.575,"en":"Take advantage of that.","zh":"利用這一點。"},{"i":198,"start":773.735,"end":777.652,"en":"Give it complex tasks and have it do complex work.","zh":"給它複雜的任務並讓它做複雜的工作。"},{"i":199,"start":778.053,"end":779.834,"en":"These are my experiences with that model.","zh":"這些是我對該模型的體驗。"},{"i":200,"start":780.075,"end":784.281,"en":"Obviously, it's just been 2 days, but I've been I've totally been blown away, and I would","zh":"顯然，才過了兩天，但我已經完全被震撼了，我會"},{"i":201,"start":784.281,"end":788.647,"en":"recommend using this model in general and using it like this specifically.","zh":"建議一般情況下使用此模型，並具體使用此模型。"}]},{"id":"tT_JLVgJiyw","title":"You MUST learn and use Effect now!","date":"20260924","file":"20260924_tT_JLVgJiyw_you-must-learn-and-use-effect-now.srt","cueCount":169,"issues":0,"duration":744,"cues":[{"i":1,"start":0.176,"end":5.447,"en":"If you're doing any work related to TypeScript, you should be using the Effect library","zh":"如果您正在做任何與 TypeScript 相關的工作，您應該使用 Effect 程式庫"},{"i":2,"start":5.623,"end":6.537,"en":"and here's why.","zh":"原因如下。"},{"i":3,"start":7.161,"end":10.238,"en":"Now, maybe you already heard or read about it.","zh":"現在，也許您已經聽說過或讀到過它。"},{"i":4,"start":10.286,"end":15.381,"en":"There is a little mini hype around it, I feel like, but it's a really good library.","zh":"我覺得它周圍有一些小炒作，但它是一個非常好的庫。"},{"i":5,"start":15.877,"end":20.812,"en":"Now, if you go to the official website, effect.website, you'll learn that Effect is all","zh":"現在，如果你造訪官方網站effect.website，你會發現Effect就是全部"},{"i":6,"start":20.86,"end":25.475,"en":"about reliable TypeScript for the AI era, but what does that mean, right?","zh":"關於人工智慧時代可靠的 TypeScript，但這意味著什麼，對嗎？"},{"i":7,"start":26.132,"end":28.487,"en":"I prepared some examples here.","zh":"我在這裡準備了一些例子。"},{"i":8,"start":29.497,"end":31.678,"en":"And you find it below, it's on GitHub.","zh":"您可以在下面找到它，它位於 GitHub 上。"},{"i":9,"start":32.624,"end":36.216,"en":"And let's take a look at some TypeScript code without Effect because that helps understand","zh":"讓我們來看看一些沒有 Effect 的 TypeScript 程式碼，因為這有助於理解"},{"i":10,"start":36.312,"end":38.092,"en":"why you may wanna use Effect.","zh":"為什麼你可能想使用效果。"},{"i":11,"start":39.198,"end":40.641,"en":"Here's a function getUser.","zh":"這是一個函數 getUser。"},{"i":12,"start":41.122,"end":45.965,"en":"It uses a dummy database implementation which I have here to find a user by ID and that","zh":"它使用一個虛擬資料庫實現，我在這裡透過 ID 尋找用戶，並且"},{"i":13,"start":46.013,"end":52.171,"en":"yields a promise, a promise which will resolve to a user or null.","zh":"產生一個承諾，一個將解析為使用者或 null 的承諾。"},{"i":14,"start":53.229,"end":55.827,"en":"If we don't have a user, we therefore throw an error.","zh":"如果我們沒有用戶，我們就會拋出錯誤。"},{"i":15,"start":56.1,"end":60.003,"en":"We also throw an error if we got an invalid ID, otherwise we return the user.","zh":"如果我們得到一個無效的 ID，我們也會拋出一個錯誤，否則我們會回傳該使用者。"},{"i":16,"start":60.132,"end":61.192,"en":"What's the return type?","zh":"回傳類型是什麼？"},{"i":17,"start":61.819,"end":64.984,"en":"It is a promise that resolves to a user in the end.","zh":"這是最終對使用者所做的承諾。"},{"i":18,"start":65.45,"end":66.735,"en":"And that's the interesting part.","zh":"這就是有趣的部分。"},{"i":19,"start":67.86,"end":73.852,"en":"The information that we could get an error is not something TypeScript knows about and","zh":"我們可能得到錯誤的資訊不是 TypeScript 知道的，並且"},{"i":20,"start":73.884,"end":75.892,"en":"that is just how TypeScript works.","zh":"這就是 TypeScript 的工作原理。"},{"i":21,"start":76.68,"end":79.748,"en":"Errors are not part of the type system so to say.","zh":"可以這麼說，錯誤不是類型系統的一部分。"},{"i":22,"start":79.812,"end":85.606,"en":"I mean, yes, you can create an error and use any class or any value type you want for","zh":"我的意思是，是的，您可以創建一個錯誤並使用您想要的任何類別或任何值類型"},{"i":23,"start":85.606,"end":85.783,"en":"that.","zh":"那。"},{"i":24,"start":85.847,"end":90.592,"en":"So the error itself will have a type, but the fact that a function can yield an error,","zh":"所以錯誤本身會有一個類型，但事實上函數可以產生錯誤，"},{"i":25,"start":91.137,"end":94.472,"en":"that is not something TypeScript knows about.","zh":"TypeScript 不知道這一點。"},{"i":26,"start":94.648,"end":95.994,"en":"Now, why is that a problem?","zh":"現在，為什麼這是一個問題？"},{"i":27,"start":96.668,"end":102.503,"en":"It already, if we're being honest, could be a problem before AI, but with AI, it could","zh":"老實說，在人工智慧出現之前，這可能已經是一個問題了，但有了人工智慧，它可能會"},{"i":28,"start":102.519,"end":106.334,"en":"of course happen depending on which model you're using and how complex your project is,","zh":"當然，具體情況取決於您使用的模型以及專案的複雜程度，"},{"i":29,"start":107.152,"end":113.067,"en":"that AI simply doesn't anticipate and handle all the errors some function in your code","zh":"人工智慧根本無法預測和處理程式碼中某些功能的所有錯誤"},{"i":30,"start":113.244,"end":114.029,"en":"may be generating.","zh":"可能正在生成。"},{"i":31,"start":114.302,"end":117.524,"en":"And again, it's possible that this is also true for you.","zh":"再說一次，這可能對你來說也是如此。"},{"i":32,"start":118.293,"end":122.621,"en":"The code you wrote, you also may not have handled all the errors that could happen, but","zh":"您編寫的程式碼，您也可能沒有處理所有可能發生的錯誤，但是"},{"i":33,"start":122.637,"end":124.801,"en":"that's not an excuse for not doing better though.","zh":"但這並不是不做得更好的藉口。"},{"i":34,"start":125.122,"end":130.107,"en":"And that's exactly one major benefit, it's not the only one, the Effect Library brings","zh":"這正是效果庫帶來的一大好處，但它不是唯一的好處"},{"i":35,"start":130.171,"end":130.797,"en":"to the table.","zh":"到桌子上。"},{"i":36,"start":131.839,"end":137.866,"en":"There you can define your error types here using that tagged error data type.","zh":"您可以使用標記的錯誤資料類型在此定義錯誤類型。"},{"i":37,"start":138.09,"end":144.054,"en":"And then if you build your function using the Effect Library, using effect fn to define","zh":"然後，如果您使用效果庫建立函數，請使用effect fn 來定義"},{"i":38,"start":144.054,"end":150.05,"en":"a function in the Effect Library world, where you then use a generator, but nothing to","zh":"效果庫世界中的一個函數，然後您可以在其中使用生成器，但無需執行任何操作"},{"i":39,"start":150.05,"end":150.745,"en":"be afraid of.","zh":"害怕。"},{"i":40,"start":150.859,"end":152.815,"en":"You can think of it as a normal function here for now.","zh":"現在你可以將其視為一個普通函數。"},{"i":41,"start":154.106,"end":158.691,"en":"If you do that and you use Effect features in there for trying to","zh":"如果您這樣做並使用其中的效果功能來嘗試"},{"i":42,"start":160.499,"end":166.966,"en":"call a promise to find a user, you can catch the error, you can yield your error like","zh":"呼叫 Promise 來尋找用戶，您可以捕獲錯誤，您可以產生錯誤，例如"},{"i":43,"start":167.031,"end":173.84,"en":"this, and suddenly the return type of that thing here is an Effect which will give you","zh":"這個，突然間，這裡那個東西的返回類型是一個 Effect ，它會給你"},{"i":44,"start":173.84,"end":179.321,"en":"a user if things go well things go well, but which may also instead yield an error.","zh":"用戶如果一切順利，一切都會順利，但也可能產生錯誤。"},{"i":45,"start":179.434,"end":184.192,"en":"So you get a richer return type, you got more type information out of the code.","zh":"因此，您可以獲得更豐富的返回類型，從程式碼中獲得更多類型資訊。"},{"i":46,"start":184.528,"end":188.405,"en":"Now I'll be honest, code like this can look frightening, right?","zh":"現在我說實話，這樣的程式碼看起來很可怕，對吧？"},{"i":47,"start":189.335,"end":195.791,"en":"And if we wouldn't have AI, I'm not sure if Effect would become","zh":"如果我們沒有人工智慧，我不確定 Effect 是否會變成"},{"i":48,"start":196.144,"end":202.456,"en":"popular because the code you write with it can look intimidating and it definitely has","zh":"流行是因為你用它寫的程式碼看起來很嚇人，而且它確實有"},{"i":49,"start":202.488,"end":204.939,"en":"some boilerplate to it.","zh":"一些樣板文件。"},{"i":50,"start":205.212,"end":207.648,"en":"But with AI, that doesn't matter too much anymore.","zh":"但有了人工智慧，這一切就不再那麼重要了。"},{"i":51,"start":207.76,"end":211.608,"en":"It's the AI writing that code for us now, or at least for many of us.","zh":"現在是人工智慧為我們編寫程式碼，或至少為我們許多人編寫程式碼。"},{"i":52,"start":211.704,"end":213.675,"en":"It definitely writes my code nowadays.","zh":"現在它肯定會寫我的程式碼。"},{"i":53,"start":214.894,"end":221.771,"en":"And therefore, I don't care about how complex the code looks like or how much","zh":"因此，我不關心程式碼看起來有多複雜或有多少"},{"i":54,"start":221.947,"end":223.438,"en":"boilerplate there may be in there.","zh":"那裡可能有樣板。"},{"i":55,"start":223.887,"end":230.154,"en":"I do care about the benefits though, which is that we can't miss errors that easily.","zh":"不過，我確實關心好處，那就是我們不能輕易錯過錯誤。"},{"i":56,"start":230.219,"end":234.996,"en":"Now, of course, you could still miss an error here if something in here could go wrong,","zh":"當然，如果這裡出現問題，您仍然可能會錯過這裡的錯誤，"},{"i":57,"start":235.044,"end":241.007,"en":"if there could be a database error connection loss here and therefore this throws, well,","zh":"如果這裡可能存在資料庫錯誤連線遺失，因此會拋出，那麼，"},{"i":58,"start":241.183,"end":245.944,"en":"we would be catching this actually, but you could of course not have that code here where","zh":"我們實際上會捕捉到這一點，但你當然不能在這裡有該程式碼"},{"i":59,"start":246.072,"end":250.801,"en":"you catch potential database errors and then still you could have so-called defects which","zh":"您發現了潛在的資料庫錯誤，但仍然可能存在所謂的缺陷"},{"i":60,"start":250.881,"end":256.572,"en":"are unexpected errors or errors you missed, but at least for all the
