d to one VPS, one EC2 instance.","zh":"另外值得注意的是，您並不局限於一個 VPS、一個 EC2 執行個體。"},{"i":241,"start":940.626,"end":946.112,"en":"Instead, Svelte makes it very easy to manage a fleet of instances where your cells are","zh":"相反，Svelte 可以非常輕鬆地管理您的單元所在的一組實例"},{"i":242,"start":946.24,"end":948.888,"en":"distributed and it automatically handles all of that.","zh":"分佈式，它會自動處理所有這些。"},{"i":243,"start":949.049,"end":950.268,"en":"That's the really amazing part.","zh":"這才是真正令人驚奇的部分。"},{"i":244,"start":950.814,"end":954.698,"en":"Now what you need for that is an S3 bucket.","zh":"現在您需要一個 S3 儲存桶。"},{"i":245,"start":954.746,"end":958.806,"en":"And by the way, there are deployment MD files in this repo with more details.","zh":"順便說一句，此儲存庫中有包含更多詳細資訊的部署 MD 檔案。"},{"i":246,"start":959.303,"end":965.835,"en":"But what you need for CELD to work is you need an S3 bucket, you need to create that","zh":"但要讓 CELD 運作，您需要一個 S3 儲存桶，您需要建立它"},{"i":247,"start":966.123,"end":971.259,"en":"and you need to create one or more VPS instances, EC2 instances, for example.","zh":"您需要建立一個或多個VPS實例，例如EC2實例。"},{"i":248,"start":971.901,"end":978.137,"en":"And then you register that bucket when you use the celled tool on your system for deploying","zh":"然後，當您在系統上使用 celled 工具進行部署時，您可以註冊該儲存桶"},{"i":249,"start":979.051,"end":984.756,"en":"and you then deploy, in my case here, the examples/celled folder with that Wrangler JSONC","zh":"然後，在我的例子中，您可以使用 Wrangler JSONC 部署範例/celled 資料夾"},{"i":250,"start":984.805,"end":985.157,"en":"file.","zh":"文件。"},{"i":251,"start":985.542,"end":991.28,"en":"And behind the scenes, celled will register the node and do all the heavy lifting with","zh":"在幕後，celled 將註冊節點並完成所有繁重的工作"},{"i":252,"start":991.536,"end":996.649,"en":"S3, which basically acts as the orchestrator of your fleet of cells.","zh":"S3，它基本上充當單元群的協調器。"},{"i":253,"start":997.001,"end":1002.899,"en":"And on the EC2 instance or your VPS, that should be registered as one node that can","zh":"在 EC2 執行個體或您的 VPS 上，應將其註冊為節點，該節點可以"},{"i":254,"start":1003.637,"end":1005.628,"en":"launch and run cells.","zh":"啟動並運行單元。"},{"i":255,"start":1006.046,"end":1012.275,"en":"On that instance, you set up some environment variables in a special place where you","zh":"在這種情況下，您可以在一個特殊的位置設定一些環境變量"},{"i":256,"start":1012.467,"end":1015.662,"en":"point at the S3 bucket that is responsible for orchestrating.","zh":"指向負責編排的 S3 儲存桶。"},{"i":257,"start":1015.759,"end":1017.38,"en":"That's how the connection is established.","zh":"這就是建立連線的方式。"},{"i":258,"start":1017.685,"end":1022.774,"en":"You deploy to that bucket, and that bucket, by the way, will also hold the storage, the","zh":"您部署到該存儲桶，順便說一下，該存儲桶還將保存存儲、"},{"i":259,"start":1022.774,"end":1024.476,"en":"SQLite databases in the end.","zh":"最後是 SQLite 資料庫。"},{"i":260,"start":1024.589,"end":1026.836,"en":"They will be copied to the bucket, so to say.","zh":"可以這麼說，它們將被複製到儲存桶中。"},{"i":261,"start":1027.238,"end":1033.293,"en":"But then you register each instance that should be available for running cells with that","zh":"但是然後你註冊每個可用於運行單元的實例"},{"i":262,"start":1033.293,"end":1034.112,"en":"environment variable.","zh":"環境變數。"},{"i":263,"start":1034.385,"end":1038.465,"en":"And then you just run that celled command on that instance.","zh":"然後您只需在該實例上執行該 celled 命令即可。"},{"i":264,"start":1038.899,"end":1039.413,"en":"And that is all.","zh":"僅此而已。"},{"i":265,"start":1039.783,"end":1043.445,"en":"The entire registration orchestration happens automatically behind the scenes.","zh":"整個註冊編排在幕後自動發生。"},{"i":266,"start":1043.702,"end":1047.012,"en":"And again, if you want to try this on your own, there is this deployment.md file in this","zh":"再說一次，如果你想自己嘗試一下，這裡有這個deployment.md文件"},{"i":267,"start":1047.012,"end":1047.413,"en":"folder.","zh":"資料夾。"},{"i":268,"start":1047.654,"end":1050.144,"en":"You can point your agent at it and play around with it.","zh":"您可以將您的代理指向它並進行操作。"},{"i":269,"start":1050.449,"end":1054.674,"en":"You just need to create those AWS resources if you want to deploy there.","zh":"如果您想部署到那裡，您只需要建立這些 AWS 資源。"},{"i":270,"start":1054.964,"end":1056.859,"en":"It's of course not limited to AWS though.","zh":"當然，它不僅限於 AWS。"},{"i":271,"start":1057.132,"end":1060.2,"en":"And therefore the question is, why would you care?","zh":"因此問題是，為什麼要關心？"},{"i":272,"start":1060.425,"end":1063.043,"en":"Why not just use Cloudflare Durable Objects?","zh":"為什麼不直接使用 Cloudflare Durable Objects？"},{"i":273,"start":1063.091,"end":1063.927,"en":"And the answer is","zh":"答案是"},{"i":274,"start":1065.228,"end":1072.199,"en":"control, predictability over pricing and cost, and potentially also cost savings.","zh":"控制、定價和成本的可預測性，以及潛在的成本節約。"},{"i":275,"start":1072.536,"end":1076.937,"en":"Control is clear, it's your server, you have full control over that.","zh":"控制很明確，這是您的伺服器，您可以完全控制它。"},{"i":276,"start":1077.852,"end":1083.377,"en":"Predictability can be interesting because Durable Objects are really, really cheap.","zh":"可預測性可能很有趣，因為耐用物品真的非常非常便宜。"},{"i":277,"start":1084.019,"end":1090.632,"en":"There is a very generous free limit, and if you got the workers paid plan, you got lots","zh":"有一個非常慷慨的免費限制，如果你有工人付費計劃，你就會得到很多"},{"i":278,"start":1090.632,"end":1091.434,"en":"of invocations.","zh":"的調用。"},{"i":279,"start":1091.482,"end":1092.542,"en":"It's really cheap.","zh":"真的很便宜。"},{"i":280,"start":1093.007,"end":1099.042,"en":"But depending on what you're running there, at some point the cheap part will not","zh":"但取決於你在那裡運行的是什麼，在某些時候，便宜的部分不會"},{"i":281,"start":1099.86,"end":1100.807,"en":"suffice anymore.","zh":"夠了。"},{"i":282,"start":1101.273,"end":1107.981,"en":"And if you set something up in the wrong way, you could actually incur cost you did not","zh":"如果你以錯誤的方式設定某些東西，你實際上可能會產生你沒有設定的成本"},{"i":283,"start":1108.029,"end":1108.639,"en":"anticipate.","zh":"預料。"},{"i":284,"start":1108.768,"end":1111.868,"en":"It's not super likely necessary, but it has happened to people.","zh":"這不太可能是必要的，但它已經發生在人們身上。"},{"i":285,"start":1112.045,"end":1114.391,"en":"You can be paying way more than you thought you'd be paying.","zh":"您支付的費用可能比您想像的要多得多。"},{"i":286,"start":1114.937,"end":1119.163,"en":"And even if that does not happen, there will be a certain threshold where you'll be paying","zh":"即使這種情況沒有發生，你也會有一定的支付門檻"},{"i":287,"start":1119.275,"end":1123.292,"en":"more than for a VPS, depending on how expensive your VPS is, of course.","zh":"比 VPS 還要多，當然取決於您的 VPS 有多貴。"},{"i":288,"start":1123.758,"end":1129.397,"en":"On the Seltz webpage, they have this chart here where they in the end show the monthly","zh":"在 Seltz 網頁上，他們有這個圖表，最後顯示了每個月的情況"},{"i":289,"start":1129.477,"end":1132.739,"en":"cost depending on how many durable objects you got running.","zh":"成本取決於您運行的耐用物件的數量。"},{"i":290,"start":1133.494,"end":1137.778,"en":"And there is this point where Self-hosting is more affordable.","zh":"在這一點上，自架網站更便宜。"},{"i":291,"start":1138.291,"end":1143.245,"en":"You have that baseline cost because the VPS costs you money even if it's not doing anything,","zh":"你有這個基準成本，因為即使 VPS 不做任何事情，它也會花費你的錢，"},{"i":292,"start":1144.063,"end":1150.075,"en":"whereas on Cloudflare, you only pay for the Cloudflare Workers paid plan and then extra","zh":"而在 Cloudflare 上，您只需支付 Cloudflare Workers 付費方案的費用，然後再支付額外費用"},{"i":293,"start":1150.075,"end":1154.436,"en":"per invocation if you exceed the thresholds included in those plans.","zh":"如果您超過這些計劃中包含的閾值，則每次調用。"},{"i":294,"start":1155.142,"end":1160.528,"en":"But on your VPS, you always pay, but then that of course stays stable until you maybe","zh":"但在你的 VPS 上，你總是付費，但當然會保持穩定，直到你可能"},{"i":295,"start":1160.528,"end":1161.25,"en":"need to scale up.","zh":"需要擴大規模。"},{"i":296,"start":1161.394,"end":1164.841,"en":"But even then, you can scale up in a more predictable, incrementable way.","zh":"但即便如此，您也可以以更可預測、可增量的方式進行擴充。"},{"i":297,"start":1166.206,"end":1167.217,"en":"That can be advantageous.","zh":"這可能是有利的。"},{"i":298,"start":1167.41,"end":1168.855,"en":"Again, it's still in alpha.","zh":"再說一遍，它仍處於 alpha 階段。"},{"i":299,"start":1169.095,"end":1172.563,"en":"I just found it interesting and I figured why not share it?","zh":"我只是發現它很有趣，我想為什麼不分享它呢？"},{"i":300,"start":1172.868,"end":1175.533,"en":"Maybe even durable objects are not clear to everybody.","zh":"也許連耐用的東西也不是每個人都清楚的。"},{"i":301,"start":1175.597,"end":1177.363,"en":"So hopefully now it's all a bit clearer.","zh":"所以希望現在一切都更清楚了。"}]},{"id":"o8-EgQhqdU0","title":"Here's why I like Pi","date":"20260806","file":"20260806_o8-EgQhqdU0_heres-why-i-like-pi.srt","cueCount":155,"issues":0,"duration":565,"cues":[{"i":1,"start":0.176,"end":4.825,"en":"Pi is a great AI agent, coding agent, but you can do all kinds of stuff with it.","zh":"Pi 是一個很棒的人工智慧代理、編碼代理，但你可以用它做各種各樣的事情。"},{"i":2,"start":4.905,"end":8.544,"en":"And combined with Claude Code, it's been my daily driver for the last few months.","zh":"與 Claude Code 結合，它成為我過去幾個月的日常驅動程式。"},{"i":3,"start":9.249,"end":10.756,"en":"I actually prefer Pi though.","zh":"但實際上我更喜歡 Pi。"},{"i":4,"start":11.076,"end":16.19,"en":"I use Claude Code for the Anthropic subscription, but Pi is amazing because it's extremely","zh":"我使用 Claude Code 訂閱 Anthropic，但 Pi 很棒，因為它非常有用"},{"i":5,"start":16.222,"end":17.793,"en":"minimal and you can make it yours.","zh":"最小，你可以把它變成你的。"},{"i":6,"start":18.21,"end":21.336,"en":"And these 2 things together are just chef's kiss.","zh":"這兩件事加在一起就是廚師之吻。"},{"i":7,"start":21.993,"end":25.984,"en":"Now, the minimalism is something the Claude Code team also recently discovered that it's","zh":"現在，克勞德程式碼團隊最近也發現極簡主義"},{"i":8,"start":25.984,"end":26.449,"en":"quite good.","zh":"相當不錯。"},{"i":9,"start":26.882,"end":32.429,"en":"They removed over 80% of Claude Code's system prompt and Pi, for example, is even way","zh":"他們刪除了 Claude Code 超過 80% 的系統提示符，例如 Pi，甚至是這樣"},{"i":10,"start":32.429,"end":33.07,"en":"more minimal.","zh":"更最小。"},{"i":11,"start":33.391,"end":38.651,"en":"It only has 4 tools out of the box for reading, writing, editing files, and the bash","zh":"它只有 4 個開箱即用的工具，用於讀取、寫入、編輯檔案和 bash"},{"i":12,"start":38.667,"end":42.805,"en":"tool for running all kinds of commands or executing all kinds of programs, which is of","zh":"運行各種命令或執行各種程序的工具，其"},{"i":13,"start":42.837,"end":43.847,"en":"course the killer tool.","zh":"當然是殺手級工具。"},{"i":14,"start":44.264,"end":47.359,"en":"Most agents have that, or most general agents, I should say.","zh":"我應該說，大多數特工，或者說大多數特工，都有這個。"},{"i":15,"start":48.193,"end":54.287,"en":"And its system prompt and tool definitions combined come out in below","zh":"其係統提示和工具定義組合如下"},{"i":16,"start":54.383,"end":55.795,"en":"1,000 tokens.","zh":"1,000 個代幣。"},{"i":17,"start":56.148,"end":61.521,"en":"So that's a very low amount of tokens you're paying for because of course that is loaded","zh":"所以你所支付的代幣數量非常少，因為當然已經加載了"},{"i":18,"start":61.521,"end":64.745,"en":"into every context window of every agent session you start.","zh":"進入您啟動的每個代理會話的每個上下文視窗。"},{"i":19,"start":64.793,"end":66.767,"en":"So fewer is better,","zh":"所以越少越好"},{"i":20,"start":68.082,"end":74.434,"en":"less is more, both from a pricing standpoint, but also it's been shown over and over","zh":"從定價的角度來看，少即是多，而且這一點也被反覆證明"},{"i":21,"start":74.434,"end":79.006,"en":"again that if you put a lot of potentially irrelevant information into your agent context","zh":"再次強調，如果您將大量可能不相關的資訊放入代理上下文中"},{"i":22,"start":79.006,"end":81.076,"en":"window, they tend to perform worse.","zh":"窗口期，他們的表現往往會更差。"},{"i":23,"start":81.236,"end":87.718,"en":"So this is great on its own, but it becomes amazing if you combine that with the extensibility","zh":"因此，這本身就很棒，但如果將其與可擴展性結合起來，就會變得令人驚奇"},{"i":24,"start":87.734,"end":88.504,"en":"features of Pi.","zh":"圓周率的特性。"},{"i":25,"start":88.873,"end":93.527,"en":"Now, as you can tell, I'm a big fan of Pi, not just because of the extensibility, also","zh":"現在，如你所知，我是 Pi 的忠實粉絲，不僅因為它的可擴展性，還因為它的可擴展性。"},{"i":26,"start":93.527,"end":96.753,"en":"because of its tree command, for example, and many other things.","zh":"例如，因為它的樹命令以及許多其他東西。"},{"i":27,"start":96.817,"end":100.701,"en":"And that's why I created a complete course, link below, where I teach you all about Pi,","zh":"這就是為什麼我創建了一個完整的課程，連結如下，我在那裡教你所有關於 Pi 的知識，"},{"i":28,"start":100.894,"end":105.307,"en":"its main configuration options, how to run it in a container if you want to, because","zh":"它的主要配置選項，如果你願意的話如何在容器中運行它，因為"},{"i":29,"start":105.307,"end":106.623,"en":"out of the box it does not.","zh":"開箱即用，但事實並非如此。"},{"i":30,"start":106.687,"end":112.753,"en":"We'll dive into its various built-in commands and we'll dive into its extensibility and","zh":"我們將深入研究它的各種內建命令，我們將深入研究它的可擴展性和"},{"i":31,"start":112.866,"end":113.54,"en":"what you can do there.","zh":"你可以在那裡做什麼。"},{"i":32,"start":113.732,"end":114.519,"en":"It's really great.","zh":"真的很棒。"},{"i":33,"start":114.952,"end":118.02,"en":"The course and Pi, so link below if you're interested.","zh":"課程和 Pi，如果您有興趣，請點擊下面的連結。"},{"i":34,"start":118.647,"end":125.602,"en":"And Pi, as mentioned, is amazing because of its extensibility most of all, combined with","zh":"如同前面所提到的，Pi 之所以令人驚奇，最重要的是它的可擴展性，再加上"},{"i":35,"start":125.698,"end":126.34,"en":"that minimalism.","zh":"那種極簡主義。"},{"i":36,"start":126.501,"end":130.581,"en":"Now regarding extensibility, you of course have agents, MD, and skills like in all those","zh":"現在關於可擴展性，你當然有代理、MD 和所有這些方面的技能"},{"i":37,"start":130.613,"end":135.962,"en":"modern general agents, and you can have global and local agents, MD, and skills depending","zh":"現代總代理，您可以根據需要擁有全球和本地代理、MD和技能"},{"i":38,"start":136.058,"end":140.636,"en":"on if you have global or project-specific instructions or capabilities, but it's the","zh":"如果您有全域或特定於項目的指令或能力，但這是"},{"i":39,"start":140.636,"end":143.751,"en":"extensions feature that makes Pi Amazing.","zh":"擴充功能讓 Pi 變得神奇。"},{"i":40,"start":144.65,"end":151.58,"en":"Because Pi has a rich extensions API and the Pi agent is aware of its","zh":"因為Pi有豐富的擴充API並且Pi代理知道它"},{"i":41,"start":151.644,"end":155.43,"en":"documentation, it's not loaded out of the box, but it knows where to find it.","zh":"文檔，它不是開箱即用的，但它知道在哪裡可以找到它。"},{"i":42,"start":155.655,"end":159.12,"en":"And so you can ask Pi to improve itself and we'll do that in just a second.","zh":"因此，您可以要求 Pi 自我改進，我們很快就會做到這一點。"},{"i":43,"start":159.65,"end":162.505,"en":"And then it can tap into this rich extensions API.","zh":"然後它可以利用這個豐富的擴充 API。"},{"i":44,"start":162.633,"end":167.077,"en":"And of course you could also build extensions on your own, the old school way, writing","zh":"當然，您也可以按照傳統的方式自己建立擴展，編寫"},{"i":45,"start":167.125,"end":172.333,"en":"code, but Pi can really self- improve because it is aware of the docs.","zh":"程式碼，但 Pi 確實可以自我改進，因為它了解文件。"},{"i":46,"start":172.397,"end":176.306,"en":"It can build its own extensions, extensions for itself, which is amazing.","zh":"它可以建立自己的擴展，為自己擴展，這是令人驚奇的。"},{"i":47,"start":176.644,"end":177.963,"en":"And those extensions can do a lot.","zh":"這些擴充可以做很多事情。"},{"i":48,"start":178.189,"end":179.222,"en":"They can tweak the UI,","zh":"他們可以調整使用者介面，"},{"i":49,"start":180.96,"end":183.066,"en":"they can register new tools.","zh":"他們可以註冊新工具。"},{"i":50,"start":183.261,"end":188.301,"en":"So if you want more than the 4 tools for a specific project or in general, maybe you","zh":"因此，如果您想要針對特定項目或一般情況使用 4 種以上的工具，也許您"},{"i":51,"start":188.431,"end":193.265,"en":"can build an extension or ask Py to build an extension that registers new tools.","zh":"可以建立一個擴充或要求 Py 建構一個註冊新工具的擴充。"},{"i":52,"start":193.927,"end":199.206,"en":"You can register commands, slash commands that do new things, invoke tools or do something","zh":"您可以註冊命令、執行新操作的斜線命令、呼叫工具或執行某些操作"},{"i":53,"start":199.206,"end":199.287,"en":"else.","zh":"別的。"},{"i":54,"start":200.863,"end":201.376,"en":"Way, way more.","zh":"方式，更多。"},{"i":55,"start":201.649,"end":204.363,"en":"You can do so much with those extensions.","zh":"您可以使用這些擴充功能做很多事情。"},{"i":56,"start":204.877,"end":208.234,"en":"Now, there also is a marketplace, so to say.","zh":"現在，可以說也有一個市場。"},{"i":57,"start":208.49,"end":213.597,"en":"It's free, where you find a lot of community-maintained packages, which are mostly extensions,","zh":"它是免費的，您可以在其中找到許多社區維護的軟體包，其中大部分是擴展，"},{"i":58,"start":213.71,"end":214.962,"en":"could also be skills or both.","zh":"也可以是技能或兩者兼具。"},{"i":59,"start":215.556,"end":219.956,"en":"And if you, for example, want subagents, which are not built into Pi, you can search","zh":"例如，如果您想要未內建在 Pi 中的子代理，您可以搜尋"},{"i":60,"start":219.956,"end":224.662,"en":"there and you'll find a trillion subagent extensions to browse, which you could install.","zh":"在那裡，您將找到一萬億個可供瀏覽的子代理擴展，您可以安裝它們。"},{"i":61,"start":224.935,"end":228.339,"en":"Or again, you could just ask Pi to build its own.","zh":"或者，您也可以要求 Pi 建造自己的。"},{"i":62,"start":228.387,"end":229.686,"en":"That is all possible.","zh":"這都是可能的。"},{"i":63,"start":230.151,"end":232.06,"en":"But this marketplace is amazing too.","zh":"但這個市場也很棒。"},{"i":64,"start":232.173,"end":238.204,"en":"It's really easy to extend Pi with nice, uh, extensions very easily by just taking a","zh":"用很好的，呃，擴展來擴展 Pi 真的很容易，只需採取"},{"i":65,"start":238.204,"end":239.761,"en":"look at what's there and using those.","zh":"看看那裡有什麼並使用它們。"},{"i":66,"start":240.835,"end":245.696,"en":"Now, as mentioned, you can also have Pi build its own extensions, and here it's currently","zh":"現在，如前所述，您還可以讓 Pi 建立自己的擴展，目前它在此處"},{"i":67,"start":245.728,"end":246.418,"en":"working on one.","zh":"正在研究一個。"},{"i":68,"start":246.691,"end":251.648,"en":"I started this in advance because it can take a bit longer, and the extension I asked","zh":"我提前開始了，因為它可能需要更長的時間，我要求延期"},{"i":69,"start":251.728,"end":257.614,"en":"it to build is an extension that allows me to, or that gives me a new cross-send command","zh":"it to build 是一個擴展，允許我這樣做，或給我一個新的交叉發送命令"},{"i":70,"start":257.614,"end":262.553,"en":"I can use in my Pi sessions, which opens a picker that then allows me to choose if I","zh":"我可以在我的 Pi 會話中使用，它會打開一個選擇器，然後允許我選擇是否"},{"i":71,"start":262.633,"end":268.871,"en":"either want to send the last agent message or a summary of the chat to another session.","zh":"想要將最後一條代理訊息或聊天摘要傳送到另一個會話。"},{"i":72,"start":269.705,"end":274.275,"en":"Then it should open a picker that allows me to choose which other Pi session to send","zh":"然後它應該會打開一個選擇器，讓我可以選擇要發送的其他 Pi 會話"},{"i":73,"start":274.275,"end":278.764,"en":"the message to, just like the built-in resume command opens such a picker.","zh":"訊息到，就像內建的恢復命令打開這樣的選擇器一樣。"},{"i":74,"start":279.085,"end":282.869,"en":"And if I choose a summary, I also want to have another picker that allows me to either","zh":"如果我選擇摘要，我還想要另一個選擇器，它允許我"},{"i":75,"start":283.174,"end":286.863,"en":"use the default compaction prompt or provide my custom prompt.","zh":"使用預設的壓縮提示或提供我的自訂提示。"},{"i":76,"start":287.569,"end":289.109,"en":"And yeah, then it should send this.","zh":"是的，那麼它應該發送這個。"},{"i":77,"start":289.269,"end":293.971,"en":"And then it went ahead, used some of the skills I already had on my system and some of","zh":"然後它繼續前進，使用了我係統上已有的一些技能以及一些"},{"i":78,"start":294.003,"end":296.956,"en":"the extensions, my subagent extension which I built myself.","zh":"擴展，我自己構建的子代理擴展。"},{"i":79,"start":297.678,"end":304.273,"en":"And then, uh, well, at some point it presented its findings here, and, uh, I read through","zh":"然後，呃，好吧，在某個時候它在這裡展示了它的發現，而且，呃，我通讀了"},{"i":80,"start":304.273,"end":310.113,"en":"them, made some decisions, and it now is building that extension on this system so that","zh":"他們做出了一些決定，現在正在該系統上建立該擴展，以便"},{"i":81,"start":310.113,"end":315.473,"en":"I can then install it and use it and hopefully send messages between different PySessions.","zh":"然後我可以安裝它並使用它，並希望在不同的 PySession 之間發送訊息。"},{"i":82,"start":316.291,"end":321.684,"en":"And this self-improving part combined with that minimalism, as mentioned, really makes","zh":"如同前面所提到的，這種自我完善的部分與極簡主義結合，確實使"},{"i":83,"start":321.684,"end":323.578,"en":"Py super powerful.","zh":"py超級強大。"},{"i":84,"start":324.011,"end":328.376,"en":"Because if you are tackling a specific problem where you need certain tools or where","zh":"因為如果您正在解決需要某些工具或需要某些工具的特定問題"},{"i":85,"start":328.569,"end":333.448,"en":"your life would be easier if you could just have extra tools, you can just tell Py to","zh":"如果你有額外的工具，你的生活會更容易，你可以告訴 Py"},{"i":86,"start":333.464,"end":333.752,"en":"build them.","zh":"建造它們。"},{"i":87,"start":334.041,"end":336.834,"en":"Could be project-specific, don't have to be global.","zh":"可以是特定於專案的，不必是全球性的。"},{"i":88,"start":337.171,"end":342.531,"en":"If you're missing some capability which you really like about Claude Code or Codex, you","zh":"如果您缺少某些您真正喜歡的 Claude Code 或 Codex 功能，您可以"},{"i":89,"start":342.531,"end":343.767,"en":"can ask Py to build it.","zh":"可以要求 Py 來建造它。"},{"i":90,"start":344.056,"end":348.857,"en":"And if you, for example, have Herder installed too, which I have here, it's my daily","zh":"例如，如果你也安裝了 Herder，我這裡就有，這就是我的日常"},{"i":91,"start":348.889,"end":353.835,"en":"driver, my terminal multiplexer that is agent-aware, that works really well together","zh":"驅動程序，我的終端多路復用器，具有代理意識，可以很好地協同工作"},{"i":92,"start":353.851,"end":355.473,"en":"with Claude Code and also Pi.","zh":"與 Claude Code 和 Pi 一起。"},{"i":93,"start":355.81,"end":359.84,"en":"If you have Herder installed, for example, you could even build Pi extensions that are","zh":"例如，如果您安裝了 Herder，您甚至可以建立 Pi 擴展"},{"i":94,"start":360.033,"end":366.809,"en":"aware of Herder and allow you to tap both into the Pi API and the Herder API to, for","zh":"了解 Herder 並允許您同時利用 Pi API 和 Herder API"},{"i":95,"start":366.809,"end":373.264,"en":"example, open new panes, to build an extension that branches a session off in a new Herder","zh":"例如，開啟新窗格，建立一個擴展，在新的 Herder 中分支會話"},{"i":96,"start":373.28,"end":374.549,"en":"pane, which I actually did.","zh":"窗格，我實際上就是這樣做的。"},{"i":97,"start":374.742,"end":380.856,"en":"I built PyHerder Sidetrack, which gives me a sidetrack command where I could enter a","zh":"我建立了 PyHerder Sidetrack，它為我提供了一個 sidetrack 命令，我可以在其中輸入"},{"i":98,"start":380.856,"end":381.5,"en":"prompt","zh":"迅速的"},{"i":99,"start":383.975,"end":385.999,"en":"like this and send this off.","zh":"像這樣並將其發送出去。"},{"i":100,"start":386.224,"end":389.374,"en":"The agent would have to be done here though, not whilst it's currently working.","zh":"不過，代理必須在這裡完成，而不是在當前工作時完成。"},{"i":101,"start":389.454,"end":393.474,"en":"I could change this extension, but right now I have to wait for it to be done.","zh":"我可以更改此擴展名，但現在我必須等待它完成。"},{"i":102,"start":393.896,"end":399.277,"en":"And it would open a new Herder pane and allow me to continue the conversation there.","zh":"它將打開一個新的 Herder 窗格，並允許我在那裡繼續對話。"},{"i":103,"start":399.569,"end":404.387,"en":"So if I show this manually, if I open a new Herder pane here, and I","zh":"因此，如果我手動顯示此內容，如果我在此處開啟一個新的 Herder 窗格，並且我"},{"i":104,"start":405.887,"end":411.614,"en":"continue my current conversation, but here it's not actively working because that's the","zh":"繼續我當前的對話，但這裡它沒有積極工作，因為那是"},{"i":105,"start":411.614,"end":412.778,"en":"upper pane.","zh":"上窗格。"},{"i":106,"start":413.489,"end":416.773,"en":"Here I can use, what are we working on?","zh":"在這裡我可以使用，我們在做什麼？"},{"i":107,"start":417.938,"end":420.612,"en":"And now you see a new pane opened there.","zh":"現在您會看到那裡打開了一個新窗格。"},{"i":108,"start":420.744,"end":421.941,"en":"I can close the other one.","zh":"我可以關閉另一個。"},{"i":109,"start":423.36,"end":428.013,"en":"And there it now picked up that existing conversation but injected a new message.","zh":"現在它拾取了現有的對話，但注入了一條新訊息。"},{"i":110,"start":428.966,"end":429.88,"en":"And answers that.","zh":"並回答了這個問題。"},{"i":111,"start":430.104,"end":431.627,"en":"But this is now in a new session.","zh":"但這現在是在新的會議中。"},{"i":112,"start":432.044,"end":437.494,"en":"So I basically cloned the session and started it by immediately sending my own message","zh":"所以我基本上克隆了會話並通過立即發送我自己的消息來啟動它"},{"i":113,"start":437.558,"end":437.815,"en":"in there.","zh":"在那裡。"},{"i":114,"start":438.52,"end":441.646,"en":"And really, the sky is the limit, so to say.","zh":"事實上，可以說，天空才是極限。"},{"i":115,"start":441.726,"end":446.327,"en":"You can build most of the things you may be imagining or you may be wanting, and therefore","zh":"您可以建立大部分您可能想像或想要的東西，因此"},{"i":116,"start":446.375,"end":447.513,"en":"really make Pi yours.","zh":"真正讓 Pi 成為你的。"},{"i":117,"start":447.577,"end":450.014,"en":"And I know this sounds like a Pi commercial.","zh":"我知道這聽起來像 Pi 廣告。"},{"i":118,"start":450.446,"end":452.017,"en":"I'm not getting paid or anything.","zh":"我沒有得到報酬或任何東西。"},{"i":119,"start":452.065,"end":452.931,"en":"I just have that course.","zh":"我只有那個課程。"},{"i":120,"start":453.172,"end":454.278,"en":"That is how I can get paid.","zh":"這就是我可以獲得報酬的方式。"},{"i":121,"start":454.534,"end":459.279,"en":"But I truly like Pi and how you can make it yours, how you can build your agent that's","zh":"但我真的很喜歡 Pi 以及如何讓它成為你的，如何建立你的代理"},{"i":122,"start":459.279,"end":460.545,"en":"perfect for your day-to-day work.","zh":"非常適合您的日常工作。"},{"i":123,"start":461.991,"end":463.099,"en":"And it's done.","zh":"一切都完成了。"},{"i":124,"start":464.11,"end":470.052,"en":"So now I'll ask it to install this extension globally on this system.","zh":"所以現在我將要求它在該系統上全域安裝此擴充功能。"},{"i":125,"start":470.117,"end":471.498,"en":"I won't yet publish it.","zh":"我還不會發布它。"},{"i":126,"start":471.723,"end":473.505,"en":"I just wanna test it on this system.","zh":"我只是想在這個系統上測試一下。"},{"i":127,"start":473.553,"end":476.348,"en":"So have it install it because it was working in a folder here.","zh":"所以讓它安裝它，因為它在此處的​​資料夾中工作。"},{"i":128,"start":476.476,"end":480.652,"en":"So I want to install it so that I can try it out.","zh":"所以我想安裝它以便我可以嘗試一下。"},{"i":129,"start":480.812,"end":482.049,"en":"And I can already","zh":"我已經可以"},{"i":130,"start":483.301,"end":487.477,"en":"start a new session in that same folder so that I can then really test it.","zh":"在同一資料夾中啟動一個新會話，以便我可以真正測試它。"},{"i":131,"start":488.023,"end":491.442,"en":"And then ask what this folder is about and have it analyze it and so on.","zh":"然後詢問這個資料夾的內容並讓它對其進行分析等等。"},{"i":132,"start":492.116,"end":493.577,"en":"And so here I got an answer.","zh":"所以我在這裡得到了答案。"},{"i":133,"start":493.641,"end":496.322,"en":"Now I'll just need to wait for the installation to finish.","zh":"現在我只需要等待安裝完成。"},{"i":134,"start":496.916,"end":497.703,"en":"And it's done.","zh":"一切都完成了。"},{"i":135,"start":498.393,"end":503.0,"en":"So now we can reload here, also reload here to make sure the extension is loaded.","zh":"所以現在我們可以在這裡重新加載，也可以在這裡重新加載以確保擴充功能已加載。"},{"i":136,"start":503.434,"end":505.504,"en":"And now I have a cross-send command available.","zh":"現在我有一個可用的交叉發送命令。"},{"i":137,"start":505.842,"end":509.357,"en":"And if I run this, I get the picker of what I want to send— last agent message, or let's","zh":"如果我運行這個，我會得到我想要發送的內容的選擇器——最後一條代理訊息，或者讓我們"},{"i":138,"start":509.357,"end":511.589,"en":"say a summary of the chat with the default summary.","zh":"使用預設摘要說出聊天摘要。"},{"i":139,"start":512.183,"end":515.985,"en":"So I'll let it summarize it, creating a summary of what happened here.","zh":"因此，我將讓它對其進行總結，並對這裡發生的事情進行總結。"},{"i":140,"start":516.738,"end":519.03,"en":"And then it asks me where I want to send this.","zh":"然後它問我想把這個發送到哪裡。"},{"i":141,"start":519.078,"end":523.629,"en":"Now I got some sidetracks from, um, playing around with this earlier, but I want this","zh":"現在我從之前的嘗試中得到了一些岔路口，但我想要這個"},{"i":142,"start":523.629,"end":523.693,"en":"one.","zh":"一。"},{"i":143,"start":523.869,"end":524.895,"en":"What is this folder about?","zh":"這個資料夾是關於什麼的？"},{"i":144,"start":525.632,"end":526.962,"en":"Cross-send message, yes.","zh":"交叉發送訊息，是的。"},{"i":145,"start":527.491,"end":532.33,"en":"And now the way this extension is built, we switch to this session.","zh":"現在這個擴充的建構方式，我們切換到這個會話。"},{"i":146,"start":532.378,"end":534.397,"en":"So this session was now opened here too.","zh":"所以這次會議現在也在這裡開幕。"},{"i":147,"start":535.263,"end":538.243,"en":"We can see that is this reply here, right?","zh":"我們可以看到這裡就是這個回覆吧？"},{"i":148,"start":538.324,"end":540.551,"en":"So this folder, blah blah blah.","zh":"所以這個資料夾，等等等等。"},{"i":149,"start":541.181,"end":541.784,"en":"We now switched.","zh":"我們現在換了。"},{"i":150,"start":541.85,"end":545.407,"en":"That is how this extension was built and my summary was appended here.","zh":"這就是這個擴充的建構方式，我的總結附在此。"},{"i":151,"start":547.2,"end":550.96,"en":"So now we have one merged session and I could close this one.","zh":"現在我們有一個合併會議，我可以關閉這一會議。"},{"i":152,"start":551.33,"end":554.833,"en":"And if you want an extension like this, it's a different question, depends on how you","zh":"如果您想要這樣的擴展，這是一個不同的問題，取決於您如何"},{"i":153,"start":554.945,"end":555.202,"en":"work.","zh":"工作。"},{"i":154,"start":555.508,"end":561.082,"en":"The key thing is you can have Pi build its own extensions and that is one of its most","zh":"關鍵是你可以讓 Pi 建立自己的擴展，這是它最重要的擴展之一"},{"i":155,"start":561.13,"end":564.369,"en":"amazing features as this small demo hopefully showed you.","zh":"這個小演示希望向您展示令人驚嘆的功能。"}]},{"id":"F0pH9aQeDrY","title":"You're probably not using agent skills right","date":"20260723","file":"20260723_F0pH9aQeDrY_youre-probably-not-using-agent-skills-right.srt","cueCount":274,"issues":0,"duration":1116,"cues":[{"i":1,"start":0.192,"end":2.649,"en":"Let's talk agent skills.","zh":"說說代理技巧吧。"},{"i":2,"start":2.842,"end":5.619,"en":"And I know you know what an agent skill is.","zh":"我知道你知道什麼是特工技能。"},{"i":3,"start":5.876,"end":10.613,"en":"The problem just is that many people are not really using agent skills correctly, or","zh":"問題只是很多人並沒有真正正確地使用特工技能，或者"},{"i":4,"start":10.613,"end":13.005,"en":"at least not to their full potential.","zh":"至少沒有充分發揮他們的潛力。"},{"i":5,"start":13.599,"end":16.136,"en":"Now, as mentioned, I know you know what an agent skill is.","zh":"現在，如前所述，我知道您知道什麼是特工技能。"},{"i":6,"start":16.393,"end":20.504,"en":"It's a skill.md file with a description that helps an agent activate that skill in the","zh":"這是一個 Skill.md 文件，其中包含幫助代理啟動該技能的說明"},{"i":7,"start":20.568,"end":21.162,"en":"right moment.","zh":"正確的時機。"},{"i":8,"start":21.531,"end":24.245,"en":"And then it's your actual skill instructions.","zh":"然後是你的實際技能說明。"},{"i":9,"start":25.53,"end":31.669,"en":"Content you'll inject into your coding agent or into whatever agent you're using to make","zh":"您將注入到編碼代理或您用來製作的任何代理中的內容"},{"i":10,"start":31.669,"end":34.603,"en":"it do certain things the way you want it to.","zh":"它按照您想要的方式做某些事情。"},{"i":11,"start":35.003,"end":40.309,"en":"Because a skill is, of course, in the end, just a prompt, just some extra context you're","zh":"因為技能當然最終只是一個提示，只是一些你需要的額外背景"},{"i":12,"start":40.309,"end":44.942,"en":"sending to your agent to execute a certain task.","zh":"發送給您的代理程式以執行特定任務。"},{"i":13,"start":45.198,"end":50.376,"en":"And it's worth noting, and that's already the first thing some people don't really realize,","zh":"值得注意的是，這已經是一些人沒有真正意識到的第一件事，"},{"i":14,"start":50.953,"end":54.592,"en":"that a skill is not necessarily just a skill.md file.","zh":"技能不一定只是一個 Skill.md 檔案。"},{"i":15,"start":54.64,"end":56.596,"en":"For some skills, that may be all you need.","zh":"對於某些技能，這可能是您所需要的。"},{"i":16,"start":56.901,"end":62.639,"en":"For many skills, you also may have extra references, extra deep dive resources that can","zh":"對於許多技能，您還可能有額外的參考資料、額外的深入研究資源，可以"},{"i":17,"start":62.671,"end":67.512,"en":"be activated by the agent when needed, because those skills, as you probably know, are","zh":"在需要時由代理人激活，因為正如您可能知道的那樣，這些技能是"},{"i":18,"start":67.641,"end":70.815,"en":"of course all about incremental discovery.","zh":"當然都是關於增量發現。"},{"i":19,"start":71.183,"end":77.179,"en":"So the idea is that this entire skill.md file is not even loaded, but instead just the","zh":"所以我們的想法是，整個 Skill.md 檔案甚至沒有加載，而只是加載"},{"i":20,"start":77.179,"end":80.561,"en":"metadata stuff here that is loaded into every agent session.","zh":"這裡的元資料內容被載入到每個代理會話中。"},{"i":21,"start":81.026,"end":85.082,"en":"Then because of this description, an agent may decide to activate a skill.","zh":"然後，由於此描述，代理可能決定啟動技能。"},{"i":22,"start":85.514,"end":90.018,"en":"Then the rest of the skill.md file is read, and then in that skill.md file, you can point","zh":"然後讀取 Skill.md 檔案的其餘部分，然後在該 Skill.md 檔案中，您可以指向"},{"i":23,"start":90.018,"end":93.223,"en":"at other references so that those are activated when needed.","zh":"在其他參考文獻中，以便在需要時啟動它們。"},{"i":24,"start":93.832,"end":95.194,"en":"Many people know that.","zh":"很多人都知道這一點。"},{"i":25,"start":95.771,"end":98.927,"en":"Fewer people know that skills can have more than references.","zh":"很少人知道技能比參考資料更重要。"},{"i":26,"start":98.975,"end":101.282,"en":"They can have assets, which could be blueprints.","zh":"他們可以擁有資產，這些資產可以是藍圖。"},{"i":27,"start":101.378,"end":107.547,"en":"Like here, my create plan skill, for example, has a plan blueprint I'd like my agents","zh":"例如，像這裡一樣，我的創建計劃技能有一個計劃藍圖，我希望我的代理人"},{"i":28,"start":107.547,"end":109.598,"en":"to use when they craft plans.","zh":"當他們制定計劃時使用。"},{"i":29,"start":110.255,"end":115.334,"en":"And by the way, all these skills are publicly available, all the skills I have here,","zh":"順便說一句，所有這些技能都是公開的，我在這裡擁有的所有技能，"},{"i":30,"start":115.943,"end":117.545,"en":"and I'll link them below.","zh":"我將在下面鏈接它們。"},{"i":31,"start":118.058,"end":118.892,"en":"So that's a thing.","zh":"所以這是一件事。"},{"i":32,"start":119.47,"end":121.668,"en":"And you can also have scripts.","zh":"而且您還可以有腳本。"},{"i":33,"start":121.796,"end":125.791,"en":"For example, I have a generate image skill, which does what the name implies.","zh":"例如，我有一個生成圖像技能，顧名思義。"},{"i":34,"start":125.887,"end":128.566,"en":"It helps me generate images with help of AI.","zh":"它幫助我在人工智慧的幫助下產生圖像。"},{"i":35,"start":129.432,"end":136.122,"en":"And I have a script in there, a TypeScript script, which uses Fall, the Fall service.","zh":"我在那裡有一個腳本，一個 TypeScript 腳本，它使用 Fall，Fall 服務。"},{"i":36,"start":136.748,"end":143.71,"en":"Fall.ai is a service which offers various AI models through an API so that you can send","zh":"Fall.ai 是一項透過 API 提供各種 AI 模型的服務，以便您可以發送"},{"i":37,"start":143.71,"end":144.207,"en":"your requests.","zh":"您的要求。"},{"i":38,"start":144.352,"end":148.473,"en":"There to generate images, text, audio, videos, whatever.","zh":"在那裡生成圖像、文字、音訊、視訊等等。"},{"i":39,"start":148.681,"end":152.016,"en":"This is my image generation skill, so it's only about those models.","zh":"這是我的圖像生成技能，所以只涉及那些模型。"},{"i":40,"start":152.513,"end":158.046,"en":"And indeed, I have GPT-Image 2 hardcoded here in my case here for the only image model","zh":"事實上，在我的例子中，我在這裡硬編碼了 GPT-Image 2 作為唯一的圖像模型"},{"i":41,"start":158.046,"end":158.687,"en":"I want to use.","zh":"我想用。"},{"i":42,"start":158.847,"end":159.874,"en":"Of course, I could change this.","zh":"當然，我可以改變這一點。"},{"i":43,"start":160.146,"end":163.882,"en":"And therefore, here I have a skill with a script that generates images.","zh":"因此，在這裡我掌握了生成圖像的腳本的技能。"},{"i":44,"start":163.995,"end":166.817,"en":"Now, you could ask, why not just a script?","zh":"現在，您可能會問，為什麼不只是一個腳本呢？"},{"i":45,"start":166.881,"end":172.22,"en":"Why burn those tokens and add that random nature to it when it could be just script?","zh":"當它可能只是腳本時，為什麼要燒掉這些代幣並為其添加隨機性？"},{"i":46,"start":172.717,"end":179.271,"en":"And that is a good question because I think some things that people give you as skills","zh":"這是一個很好的問題，因為我認為人們給你一些技能"},{"i":47,"start":179.768,"end":183.806,"en":"could just be scripts, but some things should really be both.","zh":"可能只是腳本，但有些東西確實應該兩者兼而有之。"},{"i":48,"start":183.87,"end":190.248,"en":"For example, here I have a script for the deterministic part of this skill, for sending","zh":"例如，這裡我有一個用於該技能的確定性部分的腳本，用於發送"},{"i":49,"start":190.28,"end":193.773,"en":"the request, handling the response, extracting the image, saving the image.","zh":"請求，處理回應，提取圖像，保存圖像。"},{"i":50,"start":194.286,"end":195.824,"en":"That's handled by the script.","zh":"這是由腳本處理的。"},{"i":51,"start":196.449,"end":202.788,"en":"But I have a skill So that it, for example, translates my vague instruction of I need","zh":"但我有一項技能，例如，它可以翻譯我的模糊指示：我需要"},{"i":52,"start":202.788,"end":209.306,"en":"an image of a bicycle in the rain to a proper prompt based on the instructions in that","zh":"雨中自行車的圖像，根據其中的說明進行適當提示"},{"i":53,"start":209.306,"end":212.998,"en":"skill here, and that it then invokes that script for me.","zh":"技能在這裡，然後它會為我呼叫該腳本。"},{"i":54,"start":213.078,"end":214.459,"en":"So a little bit of utility there.","zh":"所以有一點實用性。"},{"i":55,"start":214.571,"end":217.862,"en":"I could write that prompt myself, but that's the nice thing.","zh":"我可以自己寫這個提示，但這很好。"},{"i":56,"start":217.958,"end":220.254,"en":"I can get the best of both worlds.","zh":"我可以兩全其美。"},{"i":57,"start":221.008,"end":225.454,"en":"And that's a good example for a skill that is, of course, not related to programming,","zh":"這是一個很好的例子，說明了一項與程式設計無關的技能，"},{"i":58,"start":225.502,"end":227.987,"en":"but just a general utility skill.","zh":"但只是一般實用技能。"},{"i":59,"start":228.227,"end":233.532,"en":"Now, in general, agent skills are there for 2 main reasons.","zh":"現在，總的來說，代理技能的存在有兩個主要原因。"},{"i":60,"start":233.597,"end":236.882,"en":"And the first reason is that they can close a knowledge gap.","zh":"第一個原因是它們可以縮小知識差距。"},{"i":61,"start":237.764,"end":243.133,"en":"These models have some knowledge from their training data and their fine-tuning, the","zh":"這些模型從訓練資料和微調中獲得了一些知識，"},{"i":62,"start":243.278,"end":244.736,"en":"reinforcement learning, of course.","zh":"當然是強化學習。"},{"i":63,"start":245.377,"end":248.791,"en":"That is the knowledge that's baked into the model.","zh":"這就是模型中所包含的知識。"},{"i":64,"start":249.208,"end":253.199,"en":"Then they can, of course, get extra knowledge from the context you give to them.","zh":"然後他們當然可以從您提供給他們的背景中獲得額外的知識。"},{"i":65,"start":253.52,"end":257.687,"en":"From your codebase, from your prompt, from any web research they may be doing.","zh":"來自您的程式碼庫，來自您的提示，來自他們可能正在進行的任何網路研究。"},{"i":66,"start":258.601,"end":265.222,"en":"But then you can also have your own skills that add more knowledge, knowledge about certain","zh":"但你也可以擁有自己的技能，增加更多的知識，關於某些方面的知識"},{"i":67,"start":265.238,"end":268.267,"en":"tasks, knowledge about certain domains you may be working on.","zh":"任務、有關您可能正在從事的某些領域的知識。"},{"i":68,"start":268.444,"end":275.064,"en":"For example, if I'm working in a project where I use the Effect library, which is a","zh":"例如，如果我正在一個使用 Effect 庫的專案中工作，這是一個"},{"i":69,"start":275.272,"end":282.229,"en":"library that's not as baked into those models, maybe where it hasn't seen as much code","zh":"庫沒有融入這些模型中，也許它沒有看到那麼多程式碼"},{"i":70,"start":282.229,"end":287.44,"en":"as it has for other libraries, I'd like to build a skill for that.","zh":"與其他圖書館一樣，我想為此培養一項技能。"},{"i":71,"start":288.017,"end":289.252,"en":"And I do that with help of AI.","zh":"我在人工智慧的幫助下做到了這一點。"},{"i":72,"start":289.524,"end":296.082,"en":"I ask AI to do some web research, to dive into the docs, and to gather","zh":"我要求人工智慧做一些網路研究，深入研究文檔，並收集"},{"i":73,"start":296.13,"end":298.262,"en":"knowledge about the fact library.","zh":"有關事實庫的知識。"},{"i":74,"start":298.503,"end":304.9,"en":"I also may give it some specific resources, some specific URLs I wanted to definitely","zh":"我也可能會給它一些特定的資源，一些我想要的特定的 URL"},{"i":75,"start":304.916,"end":308.476,"en":"visit because I know they contain important knowledge I want to have in the skill.","zh":"訪問是因為我知道它們包含我想要的技能方面的重要知識。"},{"i":76,"start":308.941,"end":313.847,"en":"But then I let AI gather that knowledge and convert it to a skill.","zh":"但後來我讓人工智慧收集這些知識並將其轉化為技能。"},{"i":77,"start":314.457,"end":319.192,"en":"And to help with that skill conversion or in general with creating skills, because I","zh":"並幫助實現技能轉換或一般來說創造技能，因為我"},{"i":78,"start":319.208,"end":324.762,"en":"like AI to create skills, I then fine-tune them myself, but I like AI to use, or I like","zh":"喜歡AI創造技能，然後我自己微調它們，但我喜歡AI使用，或者我喜歡"},{"i":79,"start":324.826,"end":326.72,"en":"to use AI for creating those skills.","zh":"使用人工智慧來創造這些技能。"},{"i":80,"start":327.074,"end":333.221,"en":"I have a Create Skill skill, which basically encodes the best practices and patterns","zh":"我有一項創建技能技能，它基本上編碼了最佳實踐和模式"},{"i":81,"start":333.478,"end":336.351,"en":"I want AI to use when crafting skills.","zh":"我希望在創造技能時使用人工智慧。"},{"i":82,"start":336.945,"end":341.889,"en":"But then I'm happy to use AI to, for example, create such a knowledge skill that adds","zh":"但我很高興使用人工智慧來創建這樣一種知識技能，可以增加"},{"i":83,"start":342.162,"end":347.464,"en":"knowledge and makes it easy for AI to, for example, activate that skill whenever it's","zh":"例如，人工智慧可以輕鬆地在需要時啟動該技能"},{"i":84,"start":347.464,"end":352.717,"en":"working on Effect code or in an Effect codebase to make sure that it's properly using","zh":"處理 Effect 程式碼或 Effect 程式碼庫以確保其正確使用"},{"i":85,"start":352.83,"end":355.255,"en":"all those features according to the official docs.","zh":"根據官方文檔，所有這些功能。"},{"i":86,"start":355.416,"end":359.239,"en":"And it doesn't have to constantly reach out to those docs over and over again.","zh":"而且它不必不斷地一遍又一遍地聯繫這些文件。"},{"i":87,"start":359.432,"end":360.284,"en":"That's the idea.","zh":"就是這個想法。"},{"i":88,"start":361.537,"end":366.308,"en":"So bridging that knowledge gap is of course one important area where you may want to","zh":"因此，彌合知識差距當然是您可能想要的重要領域"},{"i":89,"start":366.34,"end":366.935,"en":"use a skill.","zh":"使用一項技能。"},{"i":90,"start":367.545,"end":368.911,"en":"Another important area.","zh":"另一個重要領域。"},{"i":91,"start":369.296,"end":371.158,"en":"Is the execution gap.","zh":"就是執行力差距。"},{"i":92,"start":371.72,"end":377.05,"en":"Knowledge is one thing, but of course, these models also have certain behaviors, certain","zh":"知識是一回事，但當然，這些模型也有某些行為，某些"},{"i":93,"start":377.258,"end":381.561,"en":"ways of tackling certain tasks, and that may often be what you want.","zh":"處理某些任務的方法，而這通常可能是您想要的。"},{"i":94,"start":381.834,"end":386.698,"en":"And sometimes, or maybe also often, depending on the domain, they may know better than","zh":"有時，或者也經常，根據領域的不同，他們可能比"},{"i":95,"start":386.794,"end":392.396,"en":"you, but sometimes you know how certain work needs to be done or how something needs","zh":"你，但有時你知道某些工作需要如何完成，或某些事情需要如何完成"},{"i":96,"start":392.429,"end":393.279,"en":"to be executed.","zh":"被處決。"},{"i":97,"start":393.328,"end":396.153,"en":"And that is where you can also use a skill.","zh":"這就是你也可以使用技能的地方。"},{"i":98,"start":397.324,"end":400.805,"en":"For example, again, that Create Plan skill I already showed you before.","zh":"例如，我之前已經向您展示過「創建計劃」技能。"},{"i":99,"start":401.8,"end":407.43,"en":"I like my coding agents to create plans for the tasks they tackle.","zh":"我喜歡我的編碼代理為他們處理的任務制定計劃。"},{"i":100,"start":407.976,"end":412.9,"en":"Now, creating a plan could of course be done with plan mode and you could leverage that","zh":"現在，建立計劃當然可以使用計劃模式來完成，您可以利用它"},{"i":101,"start":412.9,"end":414.103,"en":"depending on your coding agent.","zh":"取決於您的編碼代理。"},{"i":102,"start":414.152,"end":418.21,"en":"But for example, I'm using the Pi coding agent, which doesn't have a plan mode.","zh":"但例如，我正在使用 Pi 編碼代理，它沒有計劃模式。"},{"i":103,"start":418.258,"end":423.6,"en":"And even if I'm using something like Claude Code, I nowadays tend to not use any plan","zh":"即使我使用像 Claude Code 這樣的東西，我現在也傾向於不使用任何計劃"},{"i":104,"start":423.632,"end":424.322,"en":"mode built in.","zh":"內建模式。"},{"i":105,"start":424.675,"end":426.632,"en":"Instead, I use such a skill.","zh":"相反，我使用這樣的技能。"},{"i":106,"start":427.883,"end":434.392,"en":"Implicitly because this skill, due to its description, should get used when","zh":"隱含地是因為根據其描述，該技能應該在以下情況下使用："},{"i":107,"start":435.001,"end":438.641,"en":"I ask the user, the agent, to create a plan.","zh":"我要求用戶（代理）制定一個計劃。"},{"i":108,"start":438.849,"end":443.162,"en":"That's in the description and that works very reliably in my experience.","zh":"這在描述中並且根據我的經驗非常可靠。"},{"i":109,"start":443.771,"end":448.597,"en":"So what happens then is I ask the agent to create a plan and it will activate that skill.","zh":"那麼接下來發生的事情是我要求代理制定一個計劃，它將激活該技能。"},{"i":110,"start":448.709,"end":454.144,"en":"Now in that skill, I have details on what creating a plan means.","zh":"現在，在該技能中，我詳細了解了創建計劃的含義。"},{"i":111,"start":454.722,"end":461.086,"en":"It includes stuff like research, that it should perform research, that it should delegate","zh":"它包括研究之類的東西，它應該進行研究，它應該委託"},{"i":112,"start":461.455,"end":462.561,"en":"to subagents.","zh":"給子代理。"},{"i":113,"start":462.673,"end":469.422,"en":"And I have dedicated skills for that as well on how to use subagents, how to split work","zh":"我在這方面也有專門的技能，包括如何使用子代理、如何分配工作"},{"i":114,"start":469.63,"end":473.798,"en":"in general, and then also in the Pi coding agent, because again, that's the coding agent","zh":"一般來說，然後也在 Pi 編碼代理中，因為同樣，這就是編碼代理"},{"i":115,"start":473.814,"end":475.064,"en":"I'm mostly using.","zh":"我主要用的是"},{"i":116,"start":475.561,"end":479.713,"en":"Then I also have instructions on how to plan.","zh":"然後我還有關於如何計劃的說明。"},{"i":117,"start":480.146,"end":485.163,"en":"So I have a template in there, as I showed you before, how a plan should look like, because","zh":"所以我在那裡有一個模板，正如我之前向您展示的那樣，計劃應該是什麼樣子，因為"},{"i":118,"start":485.275,"end":486.365,"en":"I review those plans.","zh":"我回顧了這些計劃。"},{"i":119,"start":486.478,"end":489.988,"en":"I want to have a clear structure and it should all always be the same structure.","zh":"我想要一個清晰的結構，並且應該始終是相同的結構。"},{"i":120,"start":490.726,"end":492.745,"en":"I have all of that encoded in here.","zh":"我把所有這些都編碼在這裡。"},{"i":121,"start":493.05,"end":500.039,"en":"I also have a review step encoded in here so that the plan I see has already been reviewed.","zh":"我還在這裡編碼了一個審核步驟，以便我看到的計劃已經過審核。"},{"i":122,"start":500.504,"end":506.74,"en":"Now, when it comes to that reviewing, I have a dedicated skill because reviews of plans","zh":"現在，說到審查，我有一項專門的技能，因為計劃審查"},{"i":123,"start":506.756,"end":510.331,"en":"of code also should follow certain rules and patterns.","zh":"程式碼的編寫也應該遵循一定的規則和模式。"},{"i":124,"start":510.443,"end":515.797,"en":"And in that code review skill, I, for example, also make it clear that tasks should be","zh":"例如，在程式碼審查技能中，我還明確指出任務應該是"},{"i":125,"start":515.877,"end":520.51,"en":"delegated, should be split, and subagents should be used also to keep the main context","zh":"委託，應該拆分，並且還應該使用子代理來保留主要上下文"},{"i":126,"start":520.429,"end":521.31,"en":"context window clean.","zh":"上下文視窗乾淨。"},{"i":127,"start":521.982,"end":528.919,"en":"And I also have rules regarding the scoring of findings and that I don't want to","zh":"我也有關於調查結果評分的規則，但我不想這樣做"},{"i":128,"start":529.031,"end":534.35,"en":"have all findings be reflected in my plan or in the review that's being generated.","zh":"所有調查結果都反映在我的計劃或正在產生的審查中。"},{"i":129,"start":534.398,"end":540.823,"en":"Instead, it should judge and it should, for example, avoid adding more and more complexity.","zh":"相反，它應該進行判斷，並且應該避免增加越來越多的複雜性。"},{"i":130,"start":541.207,"end":547.823,"en":"For that, I also have a decomplex skill here, which is all about defining what too much","zh":"為此，我在這裡還擁有一項分解技能，定義什麼是太多"},{"i":131,"start":547.936,"end":551.076,"en":"complexity means and how to check for complexity.","zh":"複雜性意味著以及如何檢查複雜性。"},{"i":132,"start":551.862,"end":556.498,"en":"In all those skills, I make it clear that the user, so I, should be asked if it's not","zh":"在所有這些技能中，我明確表示應該詢問使用者（即我）是否不"},{"i":133,"start":556.498,"end":559.29,"en":"clear if something's too complex or a real issue.","zh":"明確某件事是否太複雜或是否是一個真正的問題。"},{"i":134,"start":559.338,"end":565.226,"en":"So I have multiple layers here so that I build a system that works well for me and that,","zh":"所以我這裡有多個層次，這樣我就可以建立一個適合我的系統，"},{"i":135,"start":565.403,"end":570.97,"en":"for example, for planning, where that reviewing triggers all these other skills, I get","zh":"例如，對於計劃，審查會觸發所有其他技能，我得到"},{"i":136,"start":571.018,"end":576.729,"en":"a plan that is executable for the most part, that has been reviewed and that is in a","zh":"計劃的大部分內容是可執行的，已經過審查並且正在製定中"},{"i":137,"start":576.729,"end":577.499,"en":"good shape.","zh":"身材好。"},{"i":138,"start":578.557,"end":580.802,"en":"That's what I mean with the execution gap.","zh":"這就是我所說的執行差距。"},{"i":139,"start":580.882,"end":586.492,"en":"Of course, the model can create a plan without my instructions, but in my experience,","zh":"當然，模型可以在沒有我的指示的情況下創建計劃，但根據我的經驗，"},{"i":140,"start":586.508,"end":592.359,"en":"I get better results with those extra skills that make it very clear how I want it to","zh":"透過這些額外的技能，我獲得了更好的結果，這些技能讓我很清楚我想要它如何"},{"i":141,"start":592.359,"end":593.209,"en":"work on a plan.","zh":"制定計劃。"},{"i":142,"start":593.465,"end":596.03,"en":"Now, could I just put that into a prompt instead?","zh":"現在，我可以將其放入提示中嗎？"},{"i":143,"start":596.11,"end":598.242,"en":"Sure, but I would be doing that over and over again.","zh":"當然可以，但我會一遍又一遍地這樣做。"},{"i":144,"start":598.771,"end":600.342,"en":"And that's in general good advice.","zh":"總的來說，這是一個很好的建議。"},{"i":145,"start":600.454,"end":606.87,"en":"If you find yourself asking for the same stuff over and over again or complaining about","zh":"如果您發現自己一遍又一遍地要求相同的東西或抱怨"},{"i":146,"start":606.87,"end":610.596,"en":"the same errors over and over again, put it in a skill.","zh":"一遍又一遍地犯同樣的錯誤，把它變成一種技能。"},{"i":147,"start":610.869,"end":614.465,"en":"And also important, write your own skills.","zh":"同樣重要的是，寫下你自己的技能。"},{"i":148,"start":614.578,"end":621.081,"en":"You can absolutely use my skills or the skills by Matt Pocock or any other skills you","zh":"你絕對可以使用我的技能或 Matt Pocock 的技能或任何其他你想要的技能"},{"i":149,"start":621.081,"end":621.691,"en":"find out there.","zh":"在那裡找到。"},{"i":150,"start":621.739,"end":622.783,"en":"Nothing wrong with them.","zh":"他們沒有什麼問題。"},{"i":151,"start":622.847,"end":627.954,"en":"There are great skills out there and they're especially great starting points.","zh":"那裡有很多很棒的技能，而且它們是特別好的起點。"},{"i":152,"start":628.467,"end":633.558,"en":"But you should refine them, make them yours, and also build your own skills for your","zh":"但你應該完善它們，使它們成為你的，並為你的工作培養你自己的技能。"},{"i":153,"start":633.67,"end":638.551,"en":"own workflows and the problems you're facing with agents because everybody works a bit","zh":"自己的工作流程以及您與代理商所面臨的問題，因為每個人都工作一點"},{"i":154,"start":638.583,"end":642.805,"en":"different and something that works well for me doesn't have to work well for you.","zh":"不同的東西，對我有效的東西不一定對你也有效。"},{"i":155,"start":643.479,"end":645.502,"en":"That's why it's so important to write your own skills.","zh":"這就是為什麼編寫自己的技能如此重要。"},{"i":156,"start":645.566,"end":646.657,"en":"And it is simple.","zh":"而且很簡單。"},{"i":157,"start":646.866,"end":652.613,"en":"A good skill really is just about having a good description so that it's getting activated","zh":"一個好的技能其實就是有一個好的描述，以便它被激活"},{"i":158,"start":652.613,"end":657.204,"en":"in the right moments and a lean actionable body.","zh":"在正確的時刻和精益可行動的身體。"},{"i":159,"start":657.83,"end":659.741,"en":"Keep your skills lean.","zh":"保持你的技能精益。"},{"i":160,"start":659.917,"end":661.892,"en":"I prefer these bullet points here.","zh":"我更喜歡這裡的這些要點。"},{"i":161,"start":662.662,"end":667.622,"en":"That is not necessary, of course, but avoid having a lot of prose in there.","zh":"當然，這不是必需的，但要避免其中有太多散文。"},{"i":162,"start":667.702,"end":673.913,"en":"If you're using AI to write skills, which again, I do too, make sure you really","zh":"如果你使用人工智慧來編寫技能（我也這樣做），請確保你真的"},{"i":163,"start":674.379,"end":681.071,"en":"nudge it towards that style or towards some style that's not overly complex and long","zh":"將其推向那種風格或某種不太複雜和冗長的風格"},{"i":164,"start":681.28,"end":685.629,"en":"because some AI models tend to give you very thorough and bloated skills.","zh":"因為有些人工智慧模型往往會給你非常徹底且臃腫的技能。"},{"i":165,"start":686.014,"end":688.438,"en":"And for one, that is all tokens you're paying for.","zh":"其一，這就是您所支付的所有代幣。"},{"i":166,"start":688.582,"end":691.166,"en":"That is all something that pollutes the context.","zh":"這都是污染環境的事。"},{"i":167,"start":691.856,"end":697.306,"en":"And therefore, because of that pollution especially, it leads or it can lead to worse","zh":"因此，特別是由於污染，它會導致或可能導致更糟糕的情況"},{"i":168,"start":697.306,"end":697.723,"en":"results.","zh":"結果。"},{"i":169,"start":697.819,"end":700.336,"en":"Keep your skills focused and lean.","zh":"保持你的技能專注且精益。"},{"i":170,"start":700.753,"end":707.069,"en":"Use AI to build them, but then dive into, spend that time to improve that skill because","zh":"使用人工智慧來建立它們，然後深入研究，花時間來提高技能，因為"},{"i":171,"start":707.165,"end":709.778,"en":"that skill is going to get used over and over again.","zh":"這項技能將被一次又一次地使用。"},{"i":172,"start":709.906,"end":711.669,"en":"So don't be lazy there.","zh":"所以不要在那裡偷懶。"},{"i":173,"start":712.054,"end":718.13,"en":"Really make it a good skill and tweak it, adjust it to your liking, to your requirements.","zh":"真正讓它成為一項好技能，並根據你的喜好和要求進行調整。"},{"i":174,"start":718.386,"end":721.576,"en":"Also, don't treat skills as a static thing.","zh":"另外，不要將技能視為靜態的東西。"},{"i":175,"start":721.768,"end":722.49,"en":"It's not.","zh":"它不是。"},{"i":176,"start":723.115,"end":726.385,"en":"It should evolve over time because everything else evolves.","zh":"它應該隨著時間的推移而發展，因為其他一切都在發展。"},{"i":177,"start":726.898,"end":732.925,"en":"The models change and some models suddenly are way more aggressive or verbose than other","zh":"模型發生了變化，一些模型突然比其他模型更加激進或冗長"},{"i":178,"start":732.925,"end":733.406,"en":"models.","zh":"模型。"},{"i":179,"start":733.47,"end":738.215,"en":"So the skills that worked for other models don't necessarily work for a newer model.","zh":"因此，適用於其他模型的技能不一定適用於較新的模型。"},{"i":180,"start":738.44,"end":739.177,"en":"That's one thing.","zh":"這是一回事。"},{"i":181,"start":739.882,"end":742.752,"en":"The coding agent harnesses change too.","zh":"編碼代理也利用變化。"},{"i":182,"start":742.992,"end":744.708,"en":"The tools they may have change.","zh":"他們可能擁有的工具發生了變化。"},{"i":183,"start":744.932,"end":748.346,"en":"The system prompt that may implicitly be added, that changes.","zh":"可能隱式添加的系統提示會變更。"},{"i":184,"start":748.939,"end":749.549,"en":"And you change.","zh":"而你改變了。"},{"i":185,"start":749.661,"end":751.232,"en":"The way you work changes.","zh":"您的工作方式發生了變化。"},{"i":186,"start":751.969,"end":755.624,"en":"A year ago, we were all writing way more code than we do do now.","zh":"一年前，我們寫的程式碼比現在多得多。"},{"i":187,"start":756.377,"end":759.807,"en":"We're also changing how and how much code we read.","zh":"我們也改變了閱讀代碼的方式和數量。"},{"i":188,"start":760.096,"end":763.414,"en":"So of course, our skills also need to evolve.","zh":"當然，我們的技能也需要發展。"},{"i":189,"start":764.071,"end":770.61,"en":"You could also consider adding an improve skill skill to your skills so that your","zh":"您也可以考慮在您的技能中添加一項提高技能的技能，以便您的"},{"i":190,"start":770.722,"end":776.3,"en":"agents can automatically improve skills based on certain rules you define whenever they","zh":"代理可以根據您定義的某些規則自動提高技能"},{"i":191,"start":776.412,"end":782.247,"en":"frequently get something wrong or you frequently correct them on something that was actually","zh":"經常犯錯或你經常糾正一些實際上是錯誤的事情"},{"i":192,"start":782.279,"end":783.337,"en":"encoded in a skill.","zh":"編碼在技能中。"},{"i":193,"start":783.401,"end":787.12,"en":"So These are all things you should consider doing.","zh":"所以這些都是你應該考慮要做的事情。"},{"i":194,"start":787.713,"end":792.762,"en":"A skill you installed half a year ago is not necessarily useful anymore.","zh":"半年前安裝的技能不一定有用。"},{"i":195,"start":793.259,"end":798.485,"en":"Evolve it, throw it away maybe if it doesn't get the job done anymore, and build your","zh":"發展它，如果它不再能完成工作，就丟掉它，然後建立你的"},{"i":196,"start":798.533,"end":799.126,"en":"own skills.","zh":"自己的技能。"},{"i":197,"start":799.671,"end":802.124,"en":"Don't just collect skills created by others.","zh":"不要只是收集別人創造的技能。"},{"i":198,"start":802.46,"end":808.215,"en":"Also be aware of the fact that I would say there are 4 main types of skills, though of","zh":"另請注意，我想說有 4 種主要類型的技能，儘管"},{"i":199,"start":808.247,"end":810.379,"en":"course, obviously they also kind of overlap.","zh":"當然，顯然它們也有一些重疊。"},{"i":200,"start":810.974,"end":814.829,"en":"We have the domain knowledge skill I already talked about, which is, for example, that","zh":"我們擁有我已經討論過的領域知識技能，例如"},{"i":201,"start":814.829,"end":820.05,"en":"effect skill I like to add to a project to have certain domain-specific knowledge that","zh":"效果技能 我喜歡添加到專案中以獲得某些特定領域的知識"},{"i":202,"start":820.05,"end":824.95,"en":"matters to a project in a skill so that the agent doesn't have to make requests over","zh":"對專案的一項技能很重要，這樣代理就不必再提出請求"},{"i":203,"start":824.95,"end":825.545,"en":"and over again.","zh":"一遍又一遍。"},{"i":204,"start":825.673,"end":826.605,"en":"That can be useful.","zh":"這很有用。"},{"i":205,"start":827.424,"end":832.951,"en":"I have my workflow skills like that create plan skill I showed you for workflows I repeat","zh":"我有我的工作流程技能，就像我向您展示的工作流程創建計劃技能一樣，我重複一遍"},{"i":206,"start":833.127,"end":836.517,"en":"over and over again where I also don't want to repeat myself and where I want to have","zh":"一次又一次我也不想重複自己和我想要的地方"},{"i":207,"start":836.517,"end":837.497,"en":"a clear structure.","zh":"結構清晰。"},{"i":208,"start":838.187,"end":844.989,"en":"Then I have companion skills, with which I mean skills that explain the usage of certain","zh":"然後我有同儕技能，我的意思是解釋某些特定內容的用法的技能"},{"i":209,"start":845.037,"end":846.785,"en":"tools to an agent.","zh":"給代理商的工具。"},{"i":210,"start":846.93,"end":853.475,"en":"For example, I have a Use Pi Subagents skill, which is a skill, as the name suggests,","zh":"例如我有一個Use Pi Subagents技能，顧名思義，這是一個技能，"},{"i":211,"start":853.683,"end":857.533,"en":"fine-tuned for working with Pi, the Pi coding agent.","zh":"為與 Pi（Pi 編碼代理）配合使用而進行了微調。"},{"i":212,"start":858.159,"end":864.511,"en":"And that skill has a script, which is there to spin up and control subagents.","zh":"該技能有一個腳本，用於啟動和控制子代理程式。"},{"i":213,"start":864.816,"end":865.265,"en":"Through Pi.","zh":"透過Pi."},{"i":214,"start":865.473,"end":866.707,"en":"I could be using an extension.","zh":"我可以使用擴充功能。"},{"i":215,"start":866.755,"end":867.974,"en":"I'm using a skill instead.","zh":"我正在使用一項技能。"},{"i":216,"start":868.278,"end":870.811,"en":"And then that skill explains how to use that script.","zh":"然後該技能解釋如何使用該腳本。"},{"i":217,"start":870.859,"end":877.432,"en":"So of course, it's kind of like that generate image script, but it still is a skill that","zh":"當然，這有點像生成圖像腳本，但它仍然是一項技能"},{"i":218,"start":877.64,"end":884.421,"en":"explains how to use that Pi coding agent in which a model may be running and how","zh":"解釋瞭如何使用模型可能在其中運行的 Pi 編碼代理以及如何使用"},{"i":219,"start":884.549,"end":888.236,"en":"to use it to, for example, work with subagents.","zh":"例如，使用它來與子代理一起工作。"},{"i":220,"start":888.621,"end":894.68,"en":"Another example could be for any other CLI you install on your system, which you want","zh":"另一個例子可能是您在系統上安裝的任何其他您想要的 CLI"},{"i":221,"start":894.68,"end":896.459,"en":"to explain to an agent.","zh":"向代理人解釋。"},{"i":222,"start":896.796,"end":901.908,"en":"And the last type of skill, at least for me, are executables, as I like to call them,","zh":"最後一種技能，至少對我來說，是可執行的，我喜歡這樣稱呼它們，"},{"i":223,"start":902.245,"end":905.258,"en":"which would, for example, be that Generate Image skill.","zh":"例如，這就是“生成圖像”技能。"},{"i":224,"start":905.69,"end":911.588,"en":"Or maybe even more than that, for me, it's that VPS Setup Hardening skill I have here.","zh":"或者甚至更重要的是，對我來說，這是我在這裡擁有的 VPS 設定強化技能。"},{"i":225,"start":912.277,"end":918.191,"en":"This skill has a bunch of scripts and a bunch of configuration templates, for example.","zh":"例如，這項技能有一堆腳本和一堆配置模板。"},{"i":226,"start":918.591,"end":923.287,"en":"And I use this skill to, for example, configure a new VPS.","zh":"例如，我使用此技能來配置新的 VPS。"},{"i":227,"start":923.56,"end":930.359,"en":"I could do that all with just scripts, but it does actually require some decisions here","zh":"我可以只用腳本來完成這一切，但它實際上需要在這裡做出一些決定"},{"i":228,"start":930.391,"end":934.675,"en":"and there, some checks that should be performed, and it's nice to have an agent do that.","zh":"在那裡，應該執行一些檢查，很高興有代理商來做這件事。"},{"i":229,"start":935.606,"end":940.789,"en":"Obviously, everybody has to decide for themselves if they want to let an agent roam freely","zh":"顯然，是否要讓代理商自由漫遊，每個人都必須自己決定"},{"i":230,"start":940.821,"end":943.934,"en":"on a VPS, but I have had good experience with that.","zh":"在 VPS 上，但我對此有很好的經驗。"},{"i":231,"start":944.094,"end":950.561,"en":"I'm using that skill, for example, to execute that workflow of setting up a new VPS","zh":"例如，我正在使用該技能來執行設定新 VPS 的工作流程"},{"i":232,"start":950.706,"end":954.268,"en":"together with an agent, and I describe how that works.","zh":"與代理人一起，我描述了它是如何運作的。"},{"i":233,"start":954.38,"end":957.782,"en":"I have clearly described workflow here.","zh":"我在這裡已經清楚地描述了工作流程。"},{"i":234,"start":957.894,"end":961.007,"en":"And then I have all these hardcoded scripts and configs.","zh":"然後我就有了所有這些硬編碼的腳本和配置。"},{"i":235,"start":961.36,"end":967.425,"en":"And for all these things, Agent Skills can be really useful and can be considered.","zh":"對於所有這些事情，特工技能確實很有用，可以考慮。"},{"i":236,"start":967.762,"end":971.757,"en":"And that therefore leaves only 2 remaining questions.","zh":"因此只剩下兩個問題了。"},{"i":237,"start":972.094,"end":976.635,"en":"One question is where to put those skills, because you can install them globally on your","zh":"一個問題是將這些技能放在哪裡，因為您可以將它們全域安裝在您的電腦上"},{"i":238,"start":976.683,"end":978.4,"en":"system or locally per project.","zh":"系統或每個項目本地。"},{"i":239,"start":978.833,"end":983.198,"en":"That, of course, should be relatively easy to answer if you have something like my Create","zh":"當然，如果你有像我的 Create 這樣的東西，這個問題應該相對容易回答"},{"i":240,"start":983.246,"end":987.814,"en":"plan skill, which applies to many projects, to all the projects I'm working on, it should","zh":"計劃技巧，適用於許多項目，適用於我正在從事的所有項目，它應該"},{"i":241,"start":987.814,"end":988.68,"en":"be a global skill.","zh":"成為一項全球技能。"},{"i":242,"start":988.872,"end":993.265,"en":"The generate image skill is a global skill because I may want to generate an image from","zh":"生成圖像技能是一項全局技能，因為我可能想從"},{"i":243,"start":993.425,"end":994.451,"en":"anywhere on the system.","zh":"系統上的任何位置。"},{"i":244,"start":994.964,"end":999.997,"en":"On the other hand, that effect skill with the effect library knowledge, that would be","zh":"另一方面，效果技能加上效果庫知識，那就是"},{"i":245,"start":999.997,"end":1003.748,"en":"per project because it doesn't add any value if it's sitting there globally.","zh":"每個項目，因為如果它位於全球範圍內，它不會增加任何價值。"},{"i":246,"start":1004.005,"end":1008.076,"en":"Because all the global skills, of course, at least their metadata, their description,","zh":"因為所有的全域技能，當然，至少是它們的元數據，它們的描述，"},{"i":247,"start":1008.653,"end":1011.282,"en":"they are always loaded into all your sessions.","zh":"它們總是加載到您的所有會話中。"},{"i":248,"start":1011.94,"end":1014.969,"en":"And it's not just about the tokens that are burned by them.","zh":"這不僅僅是他們燒毀的代幣。"},{"i":249,"start":1015.05,"end":1016.382,"en":"That's not too bad.","zh":"那還不錯。"},{"i":250,"start":1017.232,"end":1023.186,"en":"All these tools, which skills in the end are, simply can lead to worse model performance","zh":"所有這些工具（到底是哪些技能）只會導致模型效能變差"},{"i":251,"start":1023.186,"end":1024.342,"en":"the more you have of them.","zh":"你擁有的越多。"},{"i":252,"start":1024.872,"end":1028.611,"en":"And therefore, I try to keep my global skills as lean as possible.","zh":"因此，我盡力保持我的全球技能盡可能精益。"},{"i":253,"start":1028.804,"end":1032.286,"en":"In general, I try to have as few skills as possible.","zh":"一般來說，我會盡量少掌握技能。"},{"i":254,"start":1032.88,"end":1037.278,"en":"And I definitely put everything into a project that can be in a project.","zh":"我絕對把所有可以在專案中的東西都投入到一個專案中。"},{"i":255,"start":1037.534,"end":1043.569,"en":"Well, and the other question is, what would you put into AgentsMD or ClaudeMD?","zh":"那麼，另一個問題是，您會在 AgentsMD 或 ClaudeMD 中放入什麼？"},{"i":256,"start":1043.874,"end":1048.267,"en":"And For me, these files should be super lean.","zh":"對我來說，這些文件應該非常精簡。"},{"i":257,"start":1048.683,"end":1054.678,"en":"I really only put general instructions in there that steer the behavior of the model.","zh":"我實際上只是在其中放置了指導模型行為的一般指令。"},{"i":258,"start":1054.726,"end":1057.74,"en":"Something like, keep your responses short.","zh":"例如，讓你的回答簡短一點。"},{"i":259,"start":1058.06,"end":1064.296,"en":"Or don't add any legacy or fallback code because models, or at least some models, love","zh":"或不要添加任何遺留或後備程式碼，因為模型或至少某些模型喜歡"},{"i":260,"start":1064.328,"end":1064.761,"en":"to do that.","zh":"這樣做。"},{"i":261,"start":1065.194,"end":1070.676,"en":"They don't delete code, they just add layer on layer on layer and having such instructions","zh":"他們不會刪除程式碼，他們只是一層一層地添加並有這樣的指令"},{"i":262,"start":1070.676,"end":1073.932,"en":"in AgentsMD can help a bit at least.","zh":"AgentsMD 中至少可以提供一點幫助。"},{"i":263,"start":1074.092,"end":1075.665,"en":"Now, why not make it a skill?","zh":"現在，為什麼不把它變成一項技能呢？"},{"i":264,"start":1075.954,"end":1077.847,"en":"Because a skill must be activated.","zh":"因為必須發動技能。"},{"i":265,"start":1078.2,"end":1080.447,"en":"And I don't want to hope for that to be activated.","zh":"我不希望它被激活。"},{"i":266,"start":1080.688,"end":1085.55,"en":"If I have hard rules that matter to all the models and all the agents, I put them into","zh":"如果我有對所有模型和所有代理都很重要的硬性規則，我會將它們放入"},{"i":267,"start":1085.582,"end":1090.187,"en":"a global agents.md file because you can have global agents and Claude.md files too, not","zh":"全域代理.md 文件，因為您也可以擁有全域代理程式和 Claude.md 文件，而不是"},{"i":268,"start":1090.236,"end":1091.616,"en":"just project-specific ones.","zh":"只是特定於項目的。"},{"i":269,"start":1092.241,"end":1095.162,"en":"And then they will be loaded for every session and I'm good to go.","zh":"然後每次會話都會加載它們，我就可以開始了。"},{"i":270,"start":1095.692,"end":1097.746,"en":"And that's the simple differentiation here for me.","zh":"這對我來說就是簡單的差別。"},{"i":271,"start":1097.794,"end":1103.855,"en":"Skills are like tools, like extra patterns or pieces of knowledge that matter often,","zh":"技能就像工具，就像經常重要的額外模式或知識片段，"},{"i":272,"start":1104.129,"end":1105.062,"en":"but not always.","zh":"但並非總是如此。"},{"i":273,"start":1105.56,"end":1109.92,"en":"If something does matter always, it goes into AgentsMD or ClaudeMD.","zh":"如果某件事確實很重要，那麼它就會進入 AgentsMD 或 ClaudeMD。"},{"i":274,"start":1110.788,"end":1115.582,"en":"Yeah, and that is really how you should be using skills in my opinion.","zh":"是的，在我看來，這確實是你應該如何使用技能的方式。"}]},{"id":"2CR9tDNAzB0","title":"herdr is a must use","date":"20260716","file":"20260716_2CR9tDNAzB0_herdr-is-a-must-use.srt","cueCount":156,"issues":0,"duration":559,"cues":[{"i":1,"start":0.016,"end":4.096,"en":"Herder is one of those tools which I would've loved to discover a bit earlier because","zh":"Herder 是我希望早點發現的工具之一，因為"},{"i":2,"start":4.144,"end":8.675,"en":"it is amazing, especially for agentic engineering and working with multiple AI agents.","zh":"這是令人驚奇的，特別是對於代理工程和與多個人工智慧代理一起工作。"},{"i":3,"start":9.414,"end":12.048,"en":"Now, this is not a sponsored video or anything like that.","zh":"現在，這不是贊助影片或類似的東西。"},{"i":4,"start":12.097,"end":15.502,"en":"It's just an amazing tool and I wanna show you why and how you can use it.","zh":"這是一個了不起的工具，我想向您展示為什麼以及如何使用它。"},{"i":5,"start":15.759,"end":16.82,"en":"Now, what is Herder?","zh":"現在，赫爾德是什麼？"},{"i":6,"start":17.205,"end":23.278,"en":"It is a terminal multiplexer, which is a fancy way of saying you can run it and then","zh":"它是一個終端多工器，這是一種奇特的方式，表示您可以運行它，然後"},{"i":7,"start":23.567,"end":26.892,"en":"you can manage multiple terminal windows in one.","zh":"您可以在一個終端機視窗中管理多個終端機視窗。"},{"i":8,"start":27.326,"end":29.044,"en":"Obviously, you wouldn't need Herder for that.","zh":"顯然，你不需要 Herder。"},{"i":9,"start":29.092,"end":34.455,"en":"Of course, you can just spin up multiple terminal windows on your system, right?","zh":"當然，您可以在系統上啟動多個終端窗口，對吧？"},{"i":10,"start":34.568,"end":35.9,"en":"Well, it's a bit more than that.","zh":"嗯，還不止於此。"},{"i":11,"start":35.949,"end":41.36,"en":"It is technically a client-server architecture, which means if you start something in","zh":"從技術上講，它是一種客戶端-伺服器架構，這意味著如果您在"},{"i":12,"start":41.456,"end":46.787,"en":"your Herder session, let's say here I'm starting a PyCodingAgent session and I'm asking","zh":"您的 Herder 會話，假設我正在啟動 PyCodingAgent 會話，並且我要問"},{"i":13,"start":46.835,"end":48.954,"en":"it, what can you do for me?","zh":"它，你能為我做什麼？"},{"i":14,"start":49.484,"end":52.278,"en":"I can technically quit this session.","zh":"從技術上講我可以退出本次會議。"},{"i":15,"start":52.712,"end":57.408,"en":"Session here, and when I restart it, I'm back to where I was.","zh":"會話在這裡，當我重新啟動它時，我又回到了原來的位置。"},{"i":16,"start":57.505,"end":59.22,"en":"And as you see, it finished its work.","zh":"正如你所看到的，它完成了它的工作。"},{"i":17,"start":59.268,"end":63.099,"en":"So processes you start here keep on working.","zh":"因此，您從此處開始的流程將繼續發揮作用。"},{"i":18,"start":63.195,"end":66.946,"en":"They keep on doing what they are doing, not just coding agents, of course, any process","zh":"他們繼續做他們正在做的事情，不僅僅是編碼代理，當然，任何流程"},{"i":19,"start":66.978,"end":70.633,"en":"you start in such a Herder pane, as it's called, in one of those windows.","zh":"您可以從其中一個視窗中的 Herder 窗格開始。"},{"i":20,"start":71.387,"end":75.058,"en":"And that, of course, can be super helpful also, for example, when running this on a remote","zh":"當然，這也非常有幫助，例如，在遠端運行時"},{"i":21,"start":75.058,"end":77.847,"en":"host, on a VPS you're connecting to with SSH.","zh":"主機，位於您透過 SSH 連線的 VPS 上。"},{"i":22,"start":78.199,"end":81.566,"en":"It works like this because Herder is using a client-server infrastructure.","zh":"它的工作原理是這樣的，因為 Herder 使用的是客戶端-伺服器基礎設施。"},{"i":23,"start":82.031,"end":86.215,"en":"And when you run Herder, you're connecting with a client to a server that's also automatically","zh":"當您執行 Herder 時，您正在將用戶端連接到伺服器，該伺服器也會自動"},{"i":24,"start":86.215,"end":90.655,"en":"started if it's not already running, and your sessions then technically run on that server,","zh":"如果尚未運行，則啟動，然後從技術上講，您的會話將在該伺服器上運行，"},{"i":25,"start":90.863,"end":95.64,"en":"and that server keeps on running even if you close that Herder pane, if you detach from","zh":"即使您關閉 Herder 窗格，如果您從"},{"i":26,"start":95.672,"end":96.201,"en":"that session.","zh":"那次會議。"},{"i":27,"start":96.314,"end":97.227,"en":"That's how that works.","zh":"這就是它的工作原理。"},{"i":28,"start":97.275,"end":100.497,"en":"But still, that is nice, that can be useful.","zh":"但這仍然很好，很有用。"},{"i":29,"start":100.882,"end":105.771,"en":"But the killer feature of Herder is its deep integration with coding agents.","zh":"但 Herder 的殺手級功能是它與編碼代理的深度整合。"},{"i":30,"start":106.156,"end":111.67,"en":"You see that there is this sidebar here on the left, and there is this agents part in","zh":"你看到左邊有這個側邊欄，裡面有這個代理部分"},{"i":31,"start":111.783,"end":117.612,"en":"that sidebar, and that is automatically populated with agent sessions you may have started.","zh":"此側邊欄會自動填入您可能已啟動的代理會話。"},{"i":32,"start":117.709,"end":124.081,"en":"Herder automatically detects a broad variety of AI agents like Pi, Codex, Claude Code,","zh":"Herder 會自動偵測各種 AI 代理，例如 Pi、Codex、Claude Code、"},{"i":33,"start":124.113,"end":125.116,"en":"Groq, and many more.","zh":"格羅克等等。"},{"i":34,"start":125.714,"end":131.634,"en":"And if you start such a coding agent process in Herder, it will add it to this agent","zh":"如果你在 Herder 中啟動這樣一個編碼代理程式進程，它會將其加入到這個代理程式中"},{"i":35,"start":131.634,"end":132.604,"en":"sidebar here.","zh":"側邊欄在這裡。"},{"i":36,"start":133.348,"end":137.184,"en":"So if I start a Claude Code session here in my other window","zh":"因此，如果我在另一個視窗中啟動克勞德程式碼會話"},{"i":37,"start":138.952,"end":141.137,"en":"and I ask it, what's this folder about?","zh":"我問它，這個資料夾是做什麼用的？"},{"i":38,"start":141.603,"end":143.74,"en":"You see that's also here in the sidebar.","zh":"您會看到它也位於側邊欄中。"},{"i":39,"start":143.933,"end":146.377,"en":"And you see I got this indicator that it's working.","zh":"你看，我得到了這個指標，表明它正在發揮作用。"},{"i":40,"start":146.788,"end":150.19,"en":"So it also hooks into those agents and shows you which agent is working, which one is","zh":"因此，它還會連接到這些代理並向您顯示哪個代理正在工作，哪個代理正在工作"},{"i":41,"start":150.287,"end":150.511,"en":"not.","zh":"不是。"},{"i":42,"start":151.009,"end":155.808,"en":"And that can be really useful if you, like me, are working sometimes at least on multiple","zh":"如果你像我一樣，有時至少在多個專案上工作，那麼這會非常有用。"},{"i":43,"start":155.824,"end":160.077,"en":"projects simultaneously, or you have multiple agent sessions going, one for research,","zh":"同時進行項目，或者您有多個代理會話正在進行，其中一個用於研究，"},{"i":44,"start":160.093,"end":162.565,"en":"one for something else, and you can easily switch.","zh":"一個用於另一個，您可以輕鬆切換。"},{"i":45,"start":162.805,"end":164.523,"en":"As you also see, you got mouse support.","zh":"正如您所看到的，您獲得了滑鼠支援。"},{"i":46,"start":164.828,"end":169.931,"en":"It's a terminal-based tool, but you don't need to be a terminal wizard to use it, which","zh":"它是一個基於終端的工具，但您不需要成為終端精靈即可使用它，這"},{"i":47,"start":170.525,"end":174.875,"en":"I like a lot because I never fully got into NeoVim.","zh":"我很喜歡，因為我從來沒有完全融入 NeoVim。"},{"i":48,"start":174.939,"end":181.521,"en":"It's just beyond me to memorize all these shortcuts and ways of using it, or I never","zh":"我無法記住所有這些快捷方式和使用方法，或者我從來沒有記住過"},{"i":49,"start":181.521,"end":184.266,"en":"was willing to take the time to fully learn it.","zh":"願意花時間充分學習它。"},{"i":50,"start":184.394,"end":186.208,"en":"Here in Herder, you got shortcuts.","zh":"在赫爾德，你有捷徑。"},{"i":51,"start":186.256,"end":191.201,"en":"You can easily open new workspaces, you can split your panes in various ways, you can","zh":"您可以輕鬆地開啟新的工作區，可以以各種方式分割窗格，您可以"},{"i":52,"start":191.378,"end":193.256,"en":"open new tabs and stuff like that.","zh":"打開新標籤之類的東西。"},{"i":53,"start":193.32,"end":195.102,"en":"And I'll get back to how things are organized.","zh":"我會回到事情是如何組織的。"},{"i":54,"start":195.471,"end":197.863,"en":"You got those shortcuts, but you can also use the mouse.","zh":"您有這些快捷鍵，但您也可以使用滑鼠。"},{"i":55,"start":198.2,"end":201.267,"en":"You can use the mouse to open a new tab here if you want to.","zh":"如果需要，您可以使用滑鼠在此處開啟新分頁。"},{"i":56,"start":201.491,"end":205.756,"en":"You can open the mouse and right-click to rename a workspace.","zh":"您可以打開滑鼠並右鍵單擊來重新命名工作區。"},{"i":57,"start":206.061,"end":208.929,"en":"You can click on menu here to find settings.","zh":"您可以點擊此處的選單來尋找設定。"},{"i":58,"start":208.977,"end":211.861,"en":"So you can use your mouse here, which is very appealing.","zh":"所以你可以在這裡使用滑鼠，這是非常吸引人的。"},{"i":59,"start":211.99,"end":216.412,"en":"Obviously, you may ask though, well, why don't I just use a tool like Codex or Cloud","zh":"顯然，您可能會問，好吧，為什麼我不使用 Codex 或 Cloud 這樣的工具"},{"i":60,"start":216.412,"end":218.031,"en":"Code, the desktop app, I mean?","zh":"我的意思是程式碼，桌面應用程式？"},{"i":61,"start":218.479,"end":220.386,"en":"There I can also have multiple sessions.","zh":"在那裡我還可以進行多次會議。"},{"i":62,"start":220.579,"end":222.197,"en":"T3 Code would be another example.","zh":"T3 代碼是另一個例子。"},{"i":63,"start":222.245,"end":223.078,"en":"And you would be right.","zh":"你是對的。"},{"i":64,"start":223.383,"end":224.505,"en":"You can, of course, use that.","zh":"當然，您可以使用它。"},{"i":65,"start":224.809,"end":230.241,"en":"I personally like this terminal-based approach because Of 2 main reasons.","zh":"我個人喜歡這種基於終端的方法，因為有兩個主要原因。"},{"i":66,"start":230.738,"end":236.058,"en":"For one, I really like working with those tuis of those coding agents.","zh":"其一，我真的很喜歡與這些編碼代理一起工作。"},{"i":67,"start":236.122,"end":241.426,"en":"For example, Pi has this /tree command where I haven't found a desktop app that would","zh":"例如，Pi 有這個 /tree 命令，但我沒有找到一個桌面應用程式可以"},{"i":68,"start":241.426,"end":241.907,"en":"support it.","zh":"支持它。"},{"i":69,"start":242.051,"end":243.59,"en":"It's a feature I really like.","zh":"這是我非常喜歡的功能。"},{"i":70,"start":243.878,"end":248.093,"en":"And by the way, also a feature I'll explain along with other core Pi features in my upcoming","zh":"順便說一句，我將在即將發布的文章中與其他核心 Pi 功能一起解釋這個功能"},{"i":71,"start":248.141,"end":248.669,"en":"Pi course.","zh":"圓周率當然。"},{"i":72,"start":248.846,"end":253.749,"en":"The best way to learn about the release of that is to go to academind.com/community and","zh":"了解該版本發布的最佳方式是訪問 academind.com/community 並"},{"i":73,"start":253.749,"end":255.191,"en":"sign up for our newsletter there.","zh":"在那裡註冊我們的電子報。"},{"i":74,"start":255.576,"end":261.251,"en":"Anyways, so I like working with those TUIs, with those native CLI coding agents.","zh":"無論如何，我喜歡使用這些 TUI，使用那些本機 CLI 編碼代理。"},{"i":75,"start":261.908,"end":266.814,"en":"Also because that allows me to use tools like Py, again, a coding agent I like a lot,","zh":"也因為這讓我可以使用 Py 等工具，Py 也是我非常喜歡的程式設計代理，"},{"i":76,"start":267.118,"end":270.821,"en":"which is highly extensible and get the best of both worlds, so to say.","zh":"可以說，它是高度可擴展的，並且可以兩全其美。"},{"i":77,"start":271.126,"end":277.603,"en":"I can enhance Py and then use it in an environment, Herder, which allows me to easily","zh":"我可以增強 Py，然後在 Herder 環境中使用它，這使我可以輕鬆地"},{"i":78,"start":277.699,"end":280.136,"en":"run multiple sessions side by side and switch between them.","zh":"並行運行多個會話並在它們之間切換。"},{"i":79,"start":280.184,"end":283.246,"en":"So it is simply my replacement for a capable desktop app.","zh":"所以它只是我對功能強大的桌面應用程式的替代品。"},{"i":80,"start":283.31,"end":286.275,"en":"And with the mouse support, I can barely tell the difference, to be honest.","zh":"老實說，有了滑鼠支持，我幾乎無法分辨出差異。"},{"i":81,"start":286.596,"end":287.494,"en":"That's one reason.","zh":"這是原因之一。"},{"i":82,"start":287.574,"end":293.152,"en":"The other big reason why I'm a big fan of Herder is because it also supports plugins.","zh":"我喜歡 Herder 的另一個重要原因是它還支援插件。"},{"i":83,"start":293.265,"end":297.288,"en":"It also can be extended and you can of course use coding agents to extend it.","zh":"它也可以擴展，你當然可以使用編碼代理來擴展它。"},{"i":84,"start":297.336,"end":299.933,"en":"So you have that self-improving software.","zh":"所以你有了自我改進的軟體。"},{"i":85,"start":299.997,"end":306.409,"en":"You can run a coding agent inside of Herder to tell it to build a Herder plugin to add","zh":"您可以在 Herder 內部運行一個編碼代理，告訴它建立一個 Herder 插件來添加"},{"i":86,"start":306.409,"end":307.66,"en":"a feature you want to have.","zh":"您想要擁有的功能。"},{"i":87,"start":308.012,"end":310.753,"en":"For example, here I'm in a project I've been working on.","zh":"例如，我正在參與一個我一直在做的專案。"},{"i":88,"start":311.122,"end":315.386,"en":"And let's say I want to look at the code because I want to review the work the agent","zh":"假設我想查看程式碼，因為我想檢查代理程式的工作"},{"i":89,"start":315.386,"end":317.214,"en":"did to give my agent follow-up tasks.","zh":"確實給了我的代理人後續任務。"},{"i":90,"start":317.454,"end":320.839,"en":"Obviously I could open the this project in VS Code or NeoVim or anything like that.","zh":"顯然我可以在 VS Code 或 NeoVim 或類似的東西中開啟這個專案。"},{"i":91,"start":321.144,"end":324.257,"en":"I instead installed the Herder File Viewer plugin.","zh":"我安裝了 Herder 檔案檢視器外掛程式。"},{"i":92,"start":324.61,"end":329.103,"en":"This is a plugin I installed that was created by someone else, though I contributed to","zh":"這是我安裝的一個插件，是由其他人創建的，儘管我做出了貢獻"},{"i":93,"start":329.103,"end":329.199,"en":"it.","zh":"它。"},{"i":94,"start":329.504,"end":333.371,"en":"But of course you could also ask Herder to build your own plugin if you want to have","zh":"當然，如果你想要的話，你也可以要求 Herder 建立自己的插件"},{"i":95,"start":333.371,"end":336.934,"en":"a functionality that's not available in open source plugins.","zh":"開源插件中不提供的功能。"},{"i":96,"start":337.206,"end":341.443,"en":"With this plugin, for example, I have a new shortcut which opens this file viewer and","zh":"例如，使用此插件，我有一個新的快捷方式可以打開此文件檢視器並"},{"i":97,"start":341.459,"end":343.24,"en":"now I can see the work my agent did.","zh":"現在我可以看到我的代理人所做的工作。"},{"i":98,"start":343.465,"end":347.829,"en":"And I also get highlights about changes, so uncommitted changes, and I can dive into","zh":"我還得到了有關更改的重點，因此未提交的更改，我可以深入研究"},{"i":99,"start":347.942,"end":353.627,"en":"those and take a look and see what changed and then give my agent feedback and so on.","zh":"看看這些，看看發生了什麼變化，然後給我的代理商回饋等等。"},{"i":100,"start":354.141,"end":361.049,"en":"And I like that extensibility that I can make Herder exactly the tool I want it to be,","zh":"我喜歡這種可擴展性，我可以讓 Herder 成為我想要的工具，"},{"i":101,"start":361.595,"end":366.286,"en":"just as I can make Pi, for example, as a coding agent, exactly the coding agent I want","zh":"就像我可以製作Pi，例如，作為編碼代理，正是我想要的編碼代理"},{"i":102,"start":366.286,"end":366.768,"en":"it to
