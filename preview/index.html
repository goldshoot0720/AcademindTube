 errors you can anticipate,","zh":"是意外錯誤或您錯過的錯誤，但至少對於您可以預見的所有錯誤，"},{"i":61,"start":256.893,"end":263.625,"en":"you then got better type handling, so to say, more information in your type system and","zh":"然後你就得到了更好的類型處理，也就是說，你的類型系統中有更多信息"},{"i":62,"start":263.625,"end":269.445,"en":"that's nice, that helps AI write better code and that's one of the main benefits, Effect","zh":"這很好，可以幫助人工智慧編寫更好的程式碼，這是主要好處之一，效果"},{"i":63,"start":269.558,"end":275.677,"en":"brings to the table— better error-related typing or type safety.","zh":"帶來了更好的錯誤相關類型或類型安全性。"},{"i":64,"start":275.773,"end":277.042,"en":"It's not the only thing though.","zh":"但這不是唯一的事。"},{"i":65,"start":278.327,"end":284.638,"en":"So the handling error stuff here is interesting, but we also got help regarding services","zh":"所以這裡處理錯誤的東西很有趣，但我們也得到了有關服務的幫助"},{"i":66,"start":284.671,"end":285.714,"en":"and dependency injection.","zh":"和依賴注入。"},{"i":67,"start":285.811,"end":291.191,"en":"Now dependency injection, in case you don't know, is a general pattern not invented by","zh":"現在，如果您不知道的話，依賴注入是一種通用模式，並非由"},{"i":68,"start":291.817,"end":292.733,"en":"Effect in any way.","zh":"任何方式的效果。"},{"i":69,"start":293.423,"end":298.049,"en":"The idea is that you have some code And in that code you need some dependencies.","zh":"這個想法是你有一些程式碼並且在該程式碼中你需要一些依賴項。"},{"i":70,"start":298.225,"end":303.461,"en":"You need, for example, a mailer service which allows you to send out emails, maybe a","zh":"例如，您需要一個允許您發送電子郵件的郵件服務，也許是一個"},{"i":71,"start":303.846,"end":308.407,"en":"repository service which allows you to get some data, maybe any other kind of service,","zh":"存儲庫服務，允許您獲取一些數據，也許是任何其他類型的服務，"},{"i":72,"start":308.584,"end":310.816,"en":"a logging service, whatever it is, right?","zh":"日誌服務，不管它是什麼，對吧？"},{"i":73,"start":311.233,"end":313.434,"en":"You have that dependency in your code.","zh":"您的程式碼中有這種依賴性。"},{"i":74,"start":313.498,"end":319.841,"en":"And of course you could just import it at the top of your file, manually pass the dependency,","zh":"當然，您可以將其導入文件頂部，手動傳遞依賴項，"},{"i":75,"start":319.922,"end":322.057,"en":"the object or whatever into the function.","zh":"將物件或任何內容放入函數中。"},{"i":76,"start":323.533,"end":328.711,"en":"But alternatively, you can also use a dependency injection system, which has the advantage","zh":"但是，您也可以使用依賴注入系統，它的優點是"},{"i":77,"start":328.743,"end":335.059,"en":"that you may not need to duplicate as much code, that it's easier to swap out one dependency","zh":"您可能不需要複製那麼多程式碼，換出一個依賴項會更容易"},{"i":78,"start":335.059,"end":339.275,"en":"implementation for another one, for example, one mailer service for another one.","zh":"實現另一項服務，例如，一項郵件服務用於另一項服務。"},{"i":79,"start":339.964,"end":345.687,"en":"There are some advantages to dependency injection in general, and Effect gives you the","zh":"一般來說，依賴注入有一些優點，Effect 為您提供了"},{"i":80,"start":345.735,"end":351.394,"en":"building blocks to define such services and to then provide the service implementations,","zh":"建構塊來定義此類服務，然後提供服務實現，"},{"i":81,"start":351.426,"end":353.654,"en":"which again could then easily be swapped out.","zh":"然後又可以輕易地更換掉。"},{"i":82,"start":354.52,"end":360.117,"en":"The advantage with AI again is that you got more type information here because","zh":"人工智慧的優勢在於你可以在這裡獲得更多類型信息，因為"},{"i":83,"start":360.983,"end":367.029,"en":"Effect does not give you, not just give you type information about the expected return","zh":"Effect 不給你，不僅僅是給你關於預期回報的類型信息"},{"i":84,"start":367.061,"end":373.605,"en":"type of a function and potential errors, but it also has dependency type information.","zh":"函數的類型和潛在錯誤，但它也有依賴類型資訊。"},{"i":85,"start":374.182,"end":380.549,"en":"This Effect generic type here has 3 type parameters and the first one is the return type,","zh":"這裡的 Effect 泛型類型有 3 個型別參數，第一個是回傳型別，"},{"i":86,"start":380.613,"end":387.267,"en":"the second one is the errors you're anticipating 3rd one is the dependencies this effect","zh":"第二個是您預期的錯誤第三個是影響此效果的依賴項"},{"i":87,"start":387.267,"end":387.523,"en":"needs.","zh":"需要。"},{"i":88,"start":387.748,"end":394.175,"en":"And that again ensures that AI has a lower chance or no chance if you are","zh":"這再次確保了人工智慧的機會較低或沒有機會，如果你是"},{"i":89,"start":394.559,"end":399.929,"en":"throwing linting and type checking errors of missing important dependencies that a piece","zh":"拋出 linting 和類型檢查錯誤，因為缺少重要的依賴項"},{"i":90,"start":399.945,"end":400.586,"en":"of code needs.","zh":"的程式碼需求。"},{"i":91,"start":400.65,"end":405.618,"en":"It simply helps AI put together a program that will just work.","zh":"它只是幫助人工智慧組合出一個可以正常運作的程式。"},{"i":92,"start":405.763,"end":407.301,"en":"That is the idea.","zh":"這就是我們的想法。"},{"i":93,"start":407.622,"end":410.539,"en":"Now, of course, you don't have to use the dependency injection pattern.","zh":"當然，現在您不必使用依賴項注入模式。"},{"i":94,"start":410.651,"end":412.959,"en":"Effect does not require it.","zh":"效果不需要它。"},{"i":95,"start":413.232,"end":418.646,"en":"But it is something you will likely use automatically if you switch to Effect as your","zh":"但如果您切換到效果作為您的應用程序，您可能會自動使用它。"},{"i":96,"start":418.951,"end":420.928,"en":"main program framework.","zh":"主程式框架。"},{"i":97,"start":421.04,"end":423.113,"en":"And that's how I think of Effect.","zh":"這就是我對 Effect 的看法。"},{"i":98,"start":423.418,"end":428.865,"en":"Instead, it's really a framework for building applications in a certain way, following","zh":"相反，它實際上是一個以某種方式構建應用程式的框架，如下"},{"i":99,"start":428.913,"end":429.7,"en":"certain rules.","zh":"一定的規則。"},{"i":100,"start":429.764,"end":436.737,"en":"And talking about following the rules, there is an extra library distributed","zh":"說到遵守規則，有一個額外的分散式庫"},{"i":101,"start":436.77,"end":439.469,"en":"by the Effect people, the tsgo library.","zh":"由 Effect 人員、tsgo 圖書館提供。"},{"i":102,"start":439.742,"end":446.282,"en":"This is a library which replaces your TypeScript compiler in this project with an adjusted","zh":"這是一個函式庫，它用經過調整的版本替換了該專案中的 TypeScript 編譯器"},{"i":103,"start":446.314,"end":452.935,"en":"version that's capable of understanding the Effect rules and","zh":"能夠理解效果規則的版本"},{"i":104,"start":453.031,"end":457.904,"en":"throwing type errors if the code violates them because there are certain rules which","zh":"如果程式碼違反了類型錯誤，則會拋出類型錯誤，因為存在某些規則"},{"i":105,"start":458.016,"end":464.316,"en":"the normal TypeScript compiler just can't catch, which is why we replace it with that","zh":"普通的 TypeScript 編譯器無法捕獲，這就是為什麼我們用它來取代它"},{"i":106,"start":464.412,"end":465.919,"en":"Effect-adjusted version.","zh":"效果調整版本。"},{"i":107,"start":466.095,"end":470.055,"en":"You don't have to do that, but you can do it to get more type safety.","zh":"您不必這樣做，但可以這樣做以獲得更多的類型安全性。"},{"i":108,"start":470.744,"end":475.425,"en":"And in the tsconfig, you can then control which rules to handle how.","zh":"然後在 tsconfig 中，您可以控制處理哪些規則。"},{"i":109,"start":475.665,"end":481.805,"en":"For example, there is an anti-pattern when working with Effect where inside of an Effect","zh":"例如，使用 Effect 時，在 Effect 內部存在一個反模式"},{"i":110,"start":481.805,"end":487.976,"en":"you shouldn't start another Effect and you could promote this to throw an actual error","zh":"你不應該啟動另一個 Effect 並且你可以提升它來拋出一個實際的錯誤"},{"i":111,"start":487.976,"end":490.958,"en":"if you have that in your code, things like that.","zh":"如果你的程式碼中有這樣的東西，類似的事情。"},{"i":112,"start":491.182,"end":493.074,"en":"Now, why am I mentioning this?","zh":"現在，我為什麼要提到這一點？"},{"i":113,"start":493.202,"end":498.14,"en":"Because it's likely that you're not the person or the thing writing the code, but that","zh":"因為很可能您不是編寫程式碼的人或物，但是"},{"i":114,"start":498.316,"end":499.021,"en":"AI does.","zh":"人工智慧確實如此。"},{"i":115,"start":499.454,"end":503.397,"en":"But then it's a good idea, at least right now with the current models, it's my experience,","zh":"但這是一個好主意，至少現在對於目前的模型來說，這是我的經驗，"},{"i":116,"start":503.542,"end":509.601,"en":"that it's a good idea to give them rules and guardrails to kind of force them to write","zh":"給他們規則和護欄來強迫他們寫作是個好主意"},{"i":117,"start":509.697,"end":510.387,"en":"correct code.","zh":"正確的代碼。"},{"i":118,"start":510.435,"end":512.727,"en":"And that is exactly what Effect gives us.","zh":"這正是 Effect 帶給我們的。"},{"i":119,"start":512.999,"end":515.34,"en":"It gives us this extra type information.","zh":"它為我們提供了額外的類型資訊。"},{"i":120,"start":515.644,"end":518.738,"en":"It gives us some nice features for building programs.","zh":"它為我們提供了一些構建程序的好功能。"},{"i":121,"start":519.075,"end":525.936,"en":"And it gives us tools like this tsgo package for enforcing these rules, for","zh":"它為我們提供了像 tsgo 套件這樣的工具來執行這些規則，"},{"i":122,"start":526.288,"end":532.925,"en":"throwing errors so that you can have AI write code and it'll just face errors if it wrote","zh":"拋出錯誤，這樣你就可以讓 AI 寫程式碼，如果它寫，它只會面臨錯誤"},{"i":123,"start":533.021,"end":539.851,"en":"incorrect code or code that violates And that's exactly why I'm a big","zh":"不正確的程式碼或違反的程式碼這正是我成為大人物的原因"},{"i":124,"start":539.916,"end":544.181,"en":"fan of Effect for all the applications I'm building with help of AI.","zh":"我在 AI 的幫助下建立的所有應用程式的 Effect 粉絲。"},{"i":125,"start":544.662,"end":548.174,"en":"And then there's a third advantage I don't wanna miss.","zh":"我不想錯過第三個優勢。"},{"i":126,"start":548.895,"end":552.952,"en":"But before I get to the third advantage, I wanna mention that I put together a program,","zh":"但在我談到第三個優勢之前，我想提一下我寫了一個程序，"},{"i":127,"start":553.097,"end":558.661,"en":"or I am putting together a program right now, a 2-week program where I share all my knowledge","zh":"或者我現在正在整理一個計劃，一個為期兩週的計劃，我將在其中分享我所有的知識"},{"i":128,"start":558.709,"end":561.836,"en":"about how to build applications, web applications with AI.","zh":"關於如何使用人工智慧建立應用程式、Web 應用程式。"},{"i":129,"start":562.702,"end":568.079,"en":"Where we will dive into the research part, the planning part, where we'll set up Effect","zh":"我們將深入研究部分、規劃部分，我們將在其中設定效果"},{"i":130,"start":568.079,"end":570.102,"en":"and we'll also be using Alchemy and Cloudflare.","zh":"我們也將使用 Alchemy 和 Cloudflare。"},{"i":131,"start":570.246,"end":572.526,"en":"And I'll explain all these things in the program.","zh":"我將在程序中解釋所有這些事情。"},{"i":132,"start":573.055,"end":579.556,"en":"And where we set up a project in which AI can work very well and where it can get work","zh":"我們在哪裡建立了一個人工智慧可以很好地工作以及它可以發揮作用的項目"},{"i":133,"start":579.556,"end":582.124,"en":"done, where you can get work done with AI.","zh":"完成，您可以在其中使用人工智慧完成工作。"},{"i":134,"start":582.205,"end":587.068,"en":"And I'll walk you through an entire real project from the planning and research and discussion","zh":"我將引導您完成整個真實專案的規劃、研究和討論"},{"i":135,"start":587.084,"end":592.622,"en":"part all the way through the implementation and the deployment with AI so that you can","zh":"全程使用人工智慧進行實施和部署，以便您可以"},{"i":136,"start":592.638,"end":598.387,"en":"really learn how to use AI as a developer, also using Effect.","zh":"身為開發人員，真正學習如何使用 AI，同時也使用 Effect。"},{"i":137,"start":598.805,"end":603.286,"en":"But with that, back to the 3rd advantage, which I see, and that is that Effect comes","zh":"但說到這裡，回到我所看到的第三個優勢，那就是效果來了"},{"i":138,"start":603.398,"end":606.498,"en":"with lots of useful stuff built in.","zh":"內建了很多有用的東西。"},{"i":139,"start":607.478,"end":612.441,"en":"In its core, it's about the enhanced type safety, but then it feels like the Effect team","zh":"其核心是增強類型安全性，但感覺就像 Effect 團隊"},{"i":140,"start":612.473,"end":617.949,"en":"figured, oh, why don't we just add anything application developers typically need?","zh":"我想，哦，為什麼我們不添加應用程式開發人員通常需要的任何內容？"},{"i":141,"start":618.174,"end":625.123,"en":"So you got utility functionality around Retries, because many","zh":"所以你得到了圍繞重試的實用功能，因為很多"},{"i":142,"start":625.155,"end":629.16,"en":"applications do stuff that could fail where you maybe want to retry.","zh":"應用程式執行的操作可能會在您想要重試時失敗。"},{"i":143,"start":629.32,"end":633.213,"en":"You can write the logic on your own, you can have AI write it on your own, it will probably","zh":"你可以自己寫邏輯，你可以讓AI自己寫，它可能會"},{"i":144,"start":633.309,"end":633.581,"en":"work.","zh":"工作。"},{"i":145,"start":634.43,"end":636.705,"en":"You can also use what somebody else built for you.","zh":"您也可以使用其他人為您建立的內容。"},{"i":146,"start":636.85,"end":642.537,"en":"Oh, as a side note, by the way, Effect itself is dependency-free.","zh":"哦，順便說一句，Effect 本身是無依賴性的。"},{"i":147,"start":642.857,"end":648.096,"en":"So you install Effect and you got no other dependencies unless you install them.","zh":"所以你安裝了 Effect 並且你沒有其他依賴項，除非你安裝它們。"},{"i":148,"start":648.561,"end":652.726,"en":"So that's of course good in a world where we got more and more supply chain attacks.","zh":"因此，在供應鏈受到越來越多攻擊的世界裡，這當然是件好事。"},{"i":149,"start":652.79,"end":653.927,"en":"That's another advantage too.","zh":"這也是另一個優點。"},{"i":150,"start":654.392,"end":657.709,"en":"But yeah, we got retry and timeout related utility functions.","zh":"但是，是的，我們有重試和超時相關的實用函數。"},{"i":151,"start":657.757,"end":660.577,"en":"We got concurrency related utility functions.","zh":"我們得到了與並發相關的實用函數。"},{"i":152,"start":660.961,"end":666.121,"en":"We got queue related utility functions and APIs so that you can easily create a queue","zh":"我們提供了與佇列相關的實用函數和 API，以便您可以輕鬆建立佇列"},{"i":153,"start":666.553,"end":670.271,"en":"in your project if you need to queue jobs and work through them step by step.","zh":"在您的專案中，如果您需要對作業進行排隊並逐步完成它們。"},{"i":154,"start":670.799,"end":677.225,"en":"Rate limiting, schema, if you wanna replace SOD, Effect comes with its own type schema","zh":"速率限制，模式，如果你想替換SOD，Effect有自己的型別模式"},{"i":155,"start":677.85,"end":681.887,"en":"API where you can define your schemas and validate against them and so on.","zh":"您可以在 API 中定義模式並對其進行驗證等等。"},{"i":156,"start":682.898,"end":687.888,"en":"Config, where if you need to load config and want to enforce type safety for environment","zh":"配置，如果您需要載入配置並希望強制環境的類型安全"},{"i":157,"start":687.888,"end":690.408,"en":"variables and so on, it's all there.","zh":"變數等等，都在那裡。"},{"i":158,"start":690.68,"end":696.345,"en":"And there is so much more if you dive into the docs, into the reference, you'll see there","zh":"如果您深入研究文件、參考資料，您會發現更多內容"},{"i":159,"start":696.457,"end":702.683,"en":"is SQL-related utility stuff, AI-related utility things, much, much more.","zh":"是與 SQL 相關的實用程式、與 AI 相關的實用程式等等。"},{"i":160,"start":702.972,"end":705.571,"en":"There really is a lot in there.","zh":"裡面確實有很多東西。"},{"i":161,"start":705.764,"end":709.117,"en":"Also under guides, you'll see they can help you with so much.","zh":"同樣在指導下，您會發現他們可以為您提供很多幫助。"},{"i":162,"start":710.272,"end":711.266,"en":"And that's why I'm a fan.","zh":"這就是我成為粉絲的原因。"},{"i":163,"start":711.314,"end":717.21,"en":"That's why I'm a big fan of Effect because improved type safety, guardrails for those","zh":"這就是為什麼我是 Effect 的忠實粉絲，因為它改進了類型安全性，為那些"},{"i":164,"start":717.723,"end":724.501,"en":"AI agents, a clear structure, clear rules on how you build your program and so many building","zh":"人工智慧代理、清晰的結構、關於如何構建程序的明確規則以及如此多的構建"},{"i":165,"start":724.533,"end":726.232,"en":"blocks which most programs need.","zh":"大多數程式需要的區塊。"},{"i":166,"start":727.433,"end":731.183,"en":"So yeah, if you're not using Effect yet, definitely give it a look.","zh":"所以，是的，如果您還沒有使用 Effect，請務必看看。"},{"i":167,"start":731.359,"end":736.198,"en":"It can look intimidating, but then again, you may not be writing the code and definitely","zh":"它可能看起來很嚇人，但話又說回來，您可能不會編寫程式碼，而且絕對"},{"i":168,"start":736.374,"end":741.685,"en":"take a look at that program I put together because that may be very interesting for seeing","zh":"看看我整理的那個程序，因為這可能會很有趣"},{"i":169,"start":741.75,"end":742.873,"en":"it all in action.","zh":"這一切都在行動。"}]},{"id":"igFarOfJYSc","title":"Stop managing AWS by hand","date":"20260820","file":"20260820_igFarOfJYSc_stop-managing-aws-by-hand.srt","cueCount":237,"issues":0,"duration":998,"cues":[{"i":1,"start":0.256,"end":4.119,"en":"AI can make building software, web applications, and so on easier.","zh":"人工智慧可以讓建立軟體、網路應用程式等變得更加容易。"},{"i":2,"start":4.264,"end":7.389,"en":"But building, of course, is just one building block.","zh":"但建造當然只是其中的一個組成部分。"},{"i":3,"start":7.79,"end":13.176,"en":"AI cannot just help with building software, it can also help with deploying it.","zh":"人工智慧不僅可以幫助建立軟體，還可以幫助部署軟體。"},{"i":4,"start":13.24,"end":16.639,"en":"It can also help you manage your AWS account.","zh":"它還可以幫助您管理您的 AWS 帳戶。"},{"i":5,"start":17.504,"end":24.029,"en":"Because if you ever tried to manage your AWS account manually, you obviously know there","zh":"因為如果您曾經嘗試手動管理您的 AWS 帳戶，您顯然知道這一點"},{"i":6,"start":24.077,"end":25.295,"en":"is a lot to learn here.","zh":"這裡有很多值得學習的地方。"},{"i":7,"start":25.68,"end":31.018,"en":"Lots of services, lots of different ways of configuring these services, lots of ways","zh":"很多服務，很多不同的配置這些服務的方法，很多方法"},{"i":8,"start":31.114,"end":33.313,"en":"of shooting shooting yourself in the foot.","zh":"搬石頭砸自己的腳。"},{"i":9,"start":34.245,"end":40.509,"en":"Nonetheless, AWS is of course a very powerful cloud provider, and thankfully AI can help","zh":"儘管如此，AWS 當然是一個非常強大的雲端供應商，值得慶幸的是人工智慧可以提供幫助"},{"i":10,"start":40.509,"end":43.417,"en":"you with managing AWS and your resources.","zh":"您可以管理 AWS 和您的資源。"},{"i":11,"start":43.562,"end":50.549,"en":"It can do it for you, but there are different levels of using AI here, and you can go","zh":"它可以為你做到這一點，但是這裡使用人工智慧有不同的級別，你可以去"},{"i":12,"start":50.549,"end":57.039,"en":"from very bad ideas all the way up to very safe, nonetheless very useful ways of leveraging","zh":"從非常糟糕的想法一直到非常安全但非常有用的利用方式"},{"i":13,"start":57.231,"end":59.609,"en":"AI to help you with AWS.","zh":"AI 可協助您使用 AWS。"},{"i":14,"start":60.924,"end":66.008,"en":"Now, if you first of all want to build something though, you may want to check out our","zh":"現在，如果您首先想要建立一些東西，您可能需要查看我們的"},{"i":15,"start":66.12,"end":66.553,"en":"courses.","zh":"課程。"},{"i":16,"start":66.601,"end":71.798,"en":"We got courses on a broad variety of AI coding agents, of technologies like Bun.","zh":"我們開設了有關各種人工智慧編碼代理以及 Bun 等技術的課程。"},{"i":17,"start":72.471,"end":77.25,"en":"We have an agents course which gives you all the knowledge about that and much, much","zh":"我們有一個代理課程，可以為您提供有關這方面的所有知識以及很多很多"},{"i":18,"start":77.363,"end":77.475,"en":"more.","zh":"更多的。"},{"i":19,"start":77.603,"end":82.029,"en":"And you find links below if you want to take your personal skills in the building area","zh":"如果您想在建築領域發揮個人技能，您可以找到下面的鏈接"},{"i":20,"start":82.029,"end":82.783,"en":"to the next level.","zh":"到一個新的水平。"},{"i":21,"start":83.537,"end":88.922,"en":"But now let's take a look at using AWS with AI and how AI can help you there.","zh":"但現在讓我們來看看將 AWS 與 AI 結合使用，以及 AI 如何在這方面為您提供幫助。"},{"i":22,"start":89.547,"end":91.839,"en":"And let's start with the bad approach.","zh":"讓我們從不好的方法開始。"},{"i":23,"start":92.416,"end":94.979,"en":"And that would be computer use.","zh":"那就是計算機的使用。"},{"i":24,"start":95.861,"end":100.475,"en":"Of course, you could just log into your AWS account as I did here.","zh":"當然，您可以像我在這裡一樣登入您的 AWS 帳戶。"},{"i":25,"start":100.988,"end":107.942,"en":"And then you could use ChatGPT or Claude and enable computer use and tell it to","zh":"然後你可以使用 ChatGPT 或 Claude 並啟用電腦使用並告訴它"},{"i":26,"start":107.974,"end":109.929,"en":"do whatever you want it to do here.","zh":"在這裡做任何你想讓它做的事。"},{"i":27,"start":110.298,"end":112.669,"en":"For example, manage some EC2 instances.","zh":"例如，管理一些 EC2 執行個體。"},{"i":28,"start":113.342,"end":115.746,"en":"You can do that, but it's not great.","zh":"你可以這樣做，但效果並不好。"},{"i":29,"start":116.227,"end":117.204,"en":"Why is it not great?","zh":"為什麼不太好呢？"},{"i":30,"start":117.268,"end":120.249,"en":"Because it's slow, because it's potentially expensive.","zh":"因為它很慢，因為它可能很昂貴。"},{"i":31,"start":120.313,"end":124.255,"en":"Computer use tends to use a decent amount of tokens.","zh":"計算機的使用往往會使用相當數量的代幣。"},{"i":32,"start":124.864,"end":126.034,"en":"And of course it's insecure.","zh":"當然這是不安全的。"},{"i":33,"start":126.547,"end":128.983,"en":"And why is that all the case?","zh":"為什麼會這樣呢？"},{"i":34,"start":129.047,"end":133.582,"en":"Well, that is, well, the slow and the token part is self-explanatory.","zh":"好吧，那就是，好吧，緩慢和象徵性的部分是不言自明的。"},{"i":35,"start":133.999,"end":139.832,"en":"Insecure, of course, is the case because AI, if used through computer use, can do everything","zh":"當然，情況並不安全，因為人工智慧如果透過電腦使用，可以做任何事情"},{"i":36,"start":139.928,"end":140.761,"en":"here you can do.","zh":"在這裡你可以做。"},{"i":37,"start":141.05,"end":142.877,"en":"Obviously, that's the idea behind computer use.","zh":"顯然，這就是電腦使用背後的想法。"},{"i":38,"start":143.085,"end":145.442,"en":"So yeah, you can do that, but You don't wanna do that.","zh":"所以是的，你可以這樣做，但你不想這樣做。"},{"i":39,"start":146.358,"end":153.07,"en":"Now what's better but still potentially bad is use the AWS CLI with","zh":"現在更好但仍然可能不好的是使用 AWS CLI"},{"i":40,"start":153.183,"end":154.644,"en":"broad permissions.","zh":"廣泛的權限。"},{"i":41,"start":155.752,"end":160.104,"en":"So of course you can use your IAM user account.","zh":"因此，您當然可以使用您的 IAM 使用者帳戶。"},{"i":42,"start":160.184,"end":164.649,"en":"So in case you don't know, AWS has the concept called IAM, which allows you to manage","zh":"如果您不知道，AWS 有一個稱為 IAM 的概念，它允許您管理"},{"i":43,"start":164.665,"end":165.195,"en":"permissions.","zh":"權限。"},{"i":44,"start":165.709,"end":167.202,"en":"And there you can create users.","zh":"您可以在那裡創建用戶。"},{"i":45,"start":167.395,"end":173.831,"en":"So for example, I have my user here and then I could basically let AI","zh":"例如，我在這裡有我的用戶，然後我基本上可以讓人工智慧"},{"i":46,"start":174.136,"end":179.137,"en":"assume my user's profile in the CLI and do stuff here.","zh":"在 CLI 中假設我的使用者設定檔並在此處執行操作。"},{"i":47,"start":179.81,"end":185.517,"en":"So for example, if I wanna get an overview over some of my resources, let's say my VPCs","zh":"舉例來說，如果我想了解一些資源的概覽，比如說我的 VPC"},{"i":48,"start":186.303,"end":189.781,"en":"and my security groups, I could of course spin up an agent here.","zh":"和我的安全團隊，我當然可以在這裡設立一個代理。"},{"i":49,"start":189.861,"end":193.628,"en":"I'm using Pi and I could ask it to use my SSO profile.","zh":"我正在使用 Pi，我可以要求它使用我的 SSO 設定檔。"},{"i":50,"start":193.692,"end":199.64,"en":"So that's like an IAM user but using single sign-on to manage multiple accounts via the","zh":"這就像 IAM 用戶，但使用單一登入透過"},{"i":51,"start":199.64,"end":200.024,"en":"CLI.","zh":"命令列介面。"},{"i":52,"start":200.201,"end":205.058,"en":"So I already did log in here locally on my machine and now I'm asking, the AI to use","zh":"所以我已經在我的機器上本地登入了，現在我問，要使用的人工智慧"},{"i":53,"start":205.058,"end":211.133,"en":"my logged-in CLI, so to say, use my profile and access the account and do something.","zh":"我登入的 CLI，也就是說，使用我的個人資料並存取該帳戶並執行某些操作。"},{"i":54,"start":211.566,"end":216.583,"en":"And I'm only asking it here to read something, to just give me an overview.","zh":"我只是要求它在這裡閱讀一些內容，只是為了給我一個概述。"},{"i":55,"start":216.632,"end":218.892,"en":"So clearly it should not create anything.","zh":"很明顯它不應該創造任何東西。"},{"i":56,"start":219.485,"end":225.128,"en":"But the thing is, I of course have no guarantee that AI will follow my rules here.","zh":"但問題是，我當然不能保證人工智慧會遵守我的規則。"},{"i":57,"start":225.176,"end":232.165,"en":"It may decide, unlikely, but it may decide that the best way of reading this information","zh":"它可能會決定（不太可能），但它可能會決定閱讀此資訊的最佳方式"},{"i":58,"start":232.165,"end":238.322,"en":"or of getting this information is to spin up, let's say, an AWS Lambda function, and","zh":"或取得此資訊的方法是啟動一個 AWS Lambda 函數，並且"},{"i":59,"start":238.562,"end":243.278,"en":"in that function, maybe analyze my account and produce a report.","zh":"在該功能中，也許可以分析我的帳戶並產生報告。"},{"i":60,"start":244.031,"end":245.01,"en":"It may do that.","zh":"它可能會這樣做。"},{"i":61,"start":245.539,"end":249.853,"en":"And then I would still get the result I wanted, but along the way, I would have paid","zh":"然後我仍然會得到我想要的結果，但一路走來，我會付出代價"},{"i":62,"start":249.95,"end":251.297,"en":"for that function execution.","zh":"用於該函數的執行。"},{"i":63,"start":252.227,"end":259.156,"en":"So things like that can happen if you allow AI to access your account with broad","zh":"因此，如果你允許人工智慧廣泛存取你的帳戶，類似的事情就會發生"},{"i":64,"start":259.188,"end":261.513,"en":"permissions, as I'm doing right here.","zh":"權限，就像我在這裡所做的那樣。"},{"i":65,"start":261.61,"end":267.479,"en":"So that is probably not what you want to do because you have no control over what AI","zh":"所以這可能不是你想要做的，因為你無法控制人工智慧的內容"},{"i":66,"start":267.607,"end":272.432,"en":"does, even if it does give you the intended result in the end.","zh":"確實如此，即使它最終確實給了你預期的結果。"},{"i":67,"start":272.561,"end":278.925,"en":"And even if these modern models and agents are unlikely to go rogue, but even without","zh":"即使這些現代模特兒和代理人不太可能變得無賴，但即使沒有"},{"i":68,"start":279.15,"end":284.12,"en":"bad intentions, it's an AI, it doesn't have intentions, but even without that, it may","zh":"惡意，它是人工智慧，它沒有意圖，但即使沒有意圖，它也可能"},{"i":69,"start":284.12,"end":285.659,"en":"do stuff you don't want it to do.","zh":"做你不希望它做的事情。"},{"i":70,"start":285.979,"end":289.602,"en":"So that is something to keep in mind here.","zh":"所以這是這裡需要記住的事情。"},{"i":71,"start":289.987,"end":296.304,"en":"So potentially better than this approach here where you have those broad permissions","zh":"因此，在您擁有廣泛權限的情況下，可能比這種方法更好"},{"i":72,"start":296.304,"end":303.229,"en":"and you just allow AI to use your profile is to create dedicated users or roles for","zh":"您只需允許人工智慧使用您的個人資料即可建立專用使用者或角色"},{"i":73,"start":303.501,"end":303.79,"en":"AI.","zh":"人工智慧."},{"i":74,"start":305.12,"end":310.618,"en":"So on IAM, you could of course create a new user for AI and give it the right permissions,","zh":"所以在 IAM 上，您當然可以為 AI 創建一個新用戶並賦予其正確的權限，"},{"i":75,"start":310.811,"end":312.542,"en":"and I'll get back to those right permissions.","zh":"我會恢復這些正確的權限。"},{"i":76,"start":312.75,"end":314.466,"en":"Or better, you could create a role.","zh":"或者更好的是，您可以創建一個角色。"},{"i":77,"start":315.379,"end":319.435,"en":"The difference is that users are permanent, roles are temporary.","zh":"差別在於用戶是永久的，角色是臨時的。"},{"i":78,"start":319.627,"end":325.318,"en":"So with roles, you can create temporary credentials that can be assumed by the AI.","zh":"因此，透過角色，您可以建立人工智慧可以使用的臨時憑證。"},{"i":79,"start":325.462,"end":330.691,"en":"And the advantage of that is that if the credentials end up in the AI session, if it","zh":"這樣做的好處是，如果憑證最終出現在人工智慧會話中，如果它"},{"i":80,"start":330.691,"end":335.392,"en":"decides to read your secret key or anything like that, and it's quite likely that this","zh":"決定讀取你的密鑰或類似的東西，很可能這"},{"i":81,"start":335.504,"end":341.087,"en":"may happen, then you know that those credentials will be invalid after a few hours.","zh":"可能會發生，那麼您就知道這些憑證將在幾個小時後失效。"},{"i":82,"start":341.601,"end":347.184,"en":"So if they end up in the training data or get exposed in some other way, the damage is","zh":"因此，如果它們最終出現在訓練資料中或以其他方式暴露，造成的損害就是"},{"i":83,"start":347.28,"end":352.205,"en":"contained and most likely there is no damage by the point in time those credentials may","zh":"包含並且很可能在這些憑證可能的時間點沒有受到損害"},{"i":84,"start":352.27,"end":354.147,"en":"get shared with others.","zh":"與他人分享。"},{"i":85,"start":354.195,"end":356.505,"en":"So that's why roles are better because it's temporary.","zh":"這就是為什麼角色更好，因為它是暫時的。"},{"i":86,"start":356.841,"end":362.568,"en":"And then for example, you could create a role which can be assumed by you.","zh":"例如，您可以建立一個可以由您擔任的角色。"},{"i":87,"start":362.857,"end":368.68,"en":"So here by my single sign-on profile and in the permissions here, for example, I have","zh":"因此，透過我的單一登入設定檔和這裡的權限，例如，我有"},{"i":88,"start":368.872,"end":370.043,"en":"read-only access.","zh":"只讀訪問。"},{"i":89,"start":370.139,"end":376.7,"en":"So I added a permission policy that's actually coming with AWS that gives very broad","zh":"因此，我添加了 AWS 附帶的權限策略，該策略提供了非常廣泛的權限"},{"i":90,"start":376.732,"end":381.239,"en":"service and resource access but only read-only.","zh":"服務和資源訪問，但僅限唯讀。"},{"i":91,"start":381.399,"end":387.84,"en":"So with that role, with that permission, whoever has that role can read","zh":"因此，有了這個角色，有了這個權限，任何擁有這個角色的人都可以閱讀"},{"i":92,"start":388.033,"end":392.151,"en":"basically my entire account, but they can't change anything.","zh":"基本上是我的整個帳戶，但他們無法更改任何內容。"},{"i":93,"start":392.519,"end":396.749,"en":"And that of course comes with the huge advantage that whoever is using that role can","zh":"當然，這帶來了巨大的優勢，即無論誰使用該角色都可以"},{"i":94,"start":396.829,"end":401.54,"en":"only do what I allow here and can't, for example, start an AWS Lambda function.","zh":"僅執行我允許的操作，例如，不能啟動 AWS Lambda 函數。"},{"i":95,"start":402.069,"end":407.613,"en":"So outside of an agent, I could assume that role with this command here.","zh":"因此，在代理之外，我可以使用此命令承擔該角色。"},{"i":96,"start":408.367,"end":410.806,"en":"And now I get these temporary credentials here.","zh":"現在我在這裡得到這些臨時憑證。"},{"i":97,"start":411.014,"end":414.015,"en":"And by the way, by the point of time you're watching the video, they will be invalid.","zh":"順便說一句，當您觀看影片時，它們將失效。"},{"i":98,"start":414.063,"end":416.213,"en":"So you don't need to write them down.","zh":"所以你不需要把它們寫下來。"},{"i":99,"start":417.353,"end":420.048,"en":"You see, they do expire at some point in time here.","zh":"你看，它們確實會在某個時間點過期。"},{"i":100,"start":420.417,"end":426.194,"en":"And now I could just copy that output here if I don't really care, start my AI agent,","zh":"現在，如果我不在乎的話，我可以將輸出複製到這裡，啟動我的人工智慧代理，"},{"i":101,"start":426.354,"end":428.633,"en":"paste all that credential information in here.","zh":"將所有憑證資訊貼到此處。"},{"i":102,"start":428.826,"end":433.864,"en":"You could also, of course, set up a .env file and store them in there and not directly","zh":"當然，您也可以設定一個 .env 檔案並將它們儲存在那裡，而不是直接儲存"},{"i":103,"start":434.201,"end":435.469,"en":"share them with your agent.","zh":"與您的代理人分享。"},{"i":104,"start":435.565,"end":438.694,"en":"But here, since they will expire and since I will delete the role too,","zh":"但在這裡，由於它們將過期並且我也會刪除該角色，"},{"i":105,"start":440.057,"end":441.5,"en":"I don't care, I'll just share it like this.","zh":"我不管，我就這樣分享吧。"},{"i":106,"start":441.836,"end":448.297,"en":"And then you could give your agent the task, use this role to gather information,","zh":"然後你可以給你的代理任務，使用這個角色來收集信息，"},{"i":107,"start":448.97,"end":455.911,"en":"and ask it to create that same overview as before, but now using that role that was assumed.","zh":"並要求它創建與以前相同的概述，但現在使用假定的角色。"},{"i":108,"start":456.264,"end":461.634,"en":"Now, I will say, in theory, since I'm running this on my system where I did log in with","zh":"現在，我會說，理論上，因為我在我的系統上運行這個，我確實用"},{"i":109,"start":461.634,"end":465.705,"en":"my single sign-on account, the agent could still use that.","zh":"我的單一登入帳戶，代理仍然可以使用它。"},{"i":110,"start":465.817,"end":472.76,"en":"So I may actually ensure that that single sign-on session is revoked","zh":"所以我實際上可以確保單點登入會話被撤銷"},{"i":111,"start":472.84,"end":477.799,"en":"and no longer active to be sure that the agent can't use it even in theory.","zh":"並且不再主動確保代理即使在理論上也無法使用它。"},{"i":112,"start":478.794,"end":482.998,"en":"Of course, I can also see what the agent is doing and I can see if it's using that role","zh":"當然，我也可以看到代理正在做什麼，我可以看到它是否正在使用該角色"},{"i":113,"start":483.19,"end":485.019,"en":"and it is, so I'm fine.","zh":"確實如此，所以我很好。"},{"i":114,"start":485.132,"end":490.186,"en":"But if you wanna be extra safe, you wanna make sure that there are no other ways of the","zh":"但如果你想更加安全，你需要確保沒有其他方法"},{"i":115,"start":490.186,"end":493.331,"en":"agent performing the task you ask it to perform.","zh":"代理執行您要求其執行的任務。"},{"i":116,"start":494.102,"end":499.445,"en":"Just to be safe because these agents can be really creative in achieving a certain goal","zh":"只是為了安全起見，因為這些代理商在實現某個目標方面非常有創造力"},{"i":117,"start":500.039,"end":504.417,"en":"and finding out all kinds of ways around the restrictions you gave them.","zh":"並找出各種方法來繞過你給他們的限制。"},{"i":118,"start":504.465,"end":506.71,"en":"So you may wanna keep that in mind.","zh":"所以你可能想記住這一點。"},{"i":119,"start":507.19,"end":512.448,"en":"But still, using specific restricted roles and permissions, of course, is better because","zh":"但是，使用特定的受限角色和權限當然更好，因為"},{"i":120,"start":512.625,"end":519.165,"en":"all of a sudden you have some control or quite a bit of control, to be fair.","zh":"公平地說，突然間你就擁有了一些控制權或相當多的控制權。"},{"i":121,"start":519.454,"end":524.102,"en":"Still, the agent can do all kinds of things, but only within the boundaries of the permissions","zh":"儘管如此，代理仍然可以做各種各樣的事情，但僅限於權限範圍內"},{"i":122,"start":524.102,"end":524.551,"en":"you gave it.","zh":"你給了它。"},{"i":123,"start":525.048,"end":530.033,"en":"What is still worth pointing out though is that even if you have a permission like I","zh":"但仍然值得指出的是，即使你有像我這樣的許可"},{"i":124,"start":530.033,"end":535.436,"en":"do here, which only grants read-only access, it's worth keeping in mind that this still,","zh":"在這裡做，只授予只讀訪問權限，值得記住的是，這仍然是，"},{"i":125,"start":535.628,"end":542.296,"en":"depending on the exact details of the policy, allows the agent to read everything in","zh":"根據保單的具體細節，允許代理商閱讀其中的所有內容"},{"i":126,"start":542.361,"end":543.707,"en":"your AWS account.","zh":"您的 AWS 帳號。"},{"i":127,"start":543.819,"end":548.676,"en":"So this is a very broad read-only policy, gives it full access to all my services essentially.","zh":"所以這是一個非常廣泛的只讀策略，本質上使它能夠完全存取我的所有服務。"},{"i":128,"start":549.173,"end":552.572,"en":"And therefore, of course, data exfiltration could still be an issue.","zh":"因此，當然，資料外洩仍然可能是一個問題。"},{"i":129,"start":552.636,"end":553.486,"en":"That is worth noting.","zh":"這是值得注意的。"},{"i":130,"start":553.982,"end":557.445,"en":"Just because something is read-only does not mean it's secure.","zh":"僅僅因為某些東西是只讀的並不意味著它是安全的。"},{"i":131,"start":558.327,"end":563.504,"en":"This permission in the end allows the agent to do, to read anything in my account.","zh":"該權限最終允許代理執行以下操作：讀取我帳戶中的任何內容。"},{"i":132,"start":563.921,"end":568.57,"en":"And of course, for example, due to a prompt injection attack or something like that,","zh":"當然，例如，由於即時注入攻擊或類似的情況，"},{"i":133,"start":569.147,"end":572.994,"en":"this could exfiltrate very sensitive data.","zh":"這可能會洩漏非常敏感的資料。"},{"i":134,"start":573.219,"end":576.585,"en":"It could exfiltrate data I have in an S3 bucket.","zh":"它可能會洩露我在 S3 儲存桶中的資料。"},{"i":135,"start":577.082,"end":579.502,"en":"It could exfiltrate all kinds of data.","zh":"它可以洩露各種資料。"},{"i":136,"start":579.583,"end":582.725,"en":"So read-only does not mean secure.","zh":"所以只讀並不意味著安全。"},{"i":137,"start":583.254,"end":584.905,"en":"Really important to keep that in mind.","zh":"記住這一點非常重要。"},{"i":138,"start":585.562,"end":590.323,"en":"And indeed, you may want to have more restricted roles and permission sets therefore,","zh":"事實上，您可能希望擁有更多受限制的角色和權限集，因此，"},{"i":139,"start":590.339,"end":591.557,"en":"not just for reading.","zh":"不只是為了閱讀。"},{"i":140,"start":591.749,"end":597.729,"en":"For example, you may want to use an agent also to maybe spin up and manage some EC2 instances,","zh":"例如，您可能還想使用代理程式來啟動和管理一些 EC2 實例，"},{"i":141,"start":598.065,"end":603.259,"en":"but But instead of giving the agent full access to everything related to EC2, you may","zh":"但是，您可以不讓代理人完全存取與 EC2 相關的所有內容"},{"i":142,"start":603.355,"end":609.27,"en":"want to have a very specific policy that restricts which resources the agent can read","zh":"想要有一個非常具體的策略來限制代理可以讀取哪些資源"},{"i":143,"start":609.303,"end":609.944,"en":"and write.","zh":"並寫。"},{"i":144,"start":610.361,"end":616.083,"en":"For example, here for managing EC2, I have a policy that restricts the amount of instances","zh":"例如，這裡為了管理EC2，我有一個限制實例數量的策略"},{"i":145,"start":616.195,"end":622.319,"en":"the agent can create to instance types that are rather cheap to make sure that yes, the","zh":"代理可以創建相當便宜的實例類型，以確保是的，"},{"i":146,"start":622.431,"end":629.02,"en":"agent can create EC2 instances and related resources, but I restrict which kind of resources","zh":"代理可以建立EC2實例和相關資源，但我限制了哪種資源"},{"i":147,"start":629.084,"end":635.231,"en":"to ensure sure that spinning up very expensive instances, for example, is not possible","zh":"例如，確保不可能啟動非常昂貴的實例"},{"i":148,"start":635.28,"end":636.773,"en":"to keep costs under control.","zh":"以控製成本。"},{"i":149,"start":636.869,"end":638.218,"en":"And you could do the same for reading.","zh":"你也可以對閱讀做同樣的事情。"},{"i":150,"start":638.314,"end":641.669,"en":"You could restrict what can be read and not allow everything.","zh":"您可以限制可以讀取的內容，並且不允許所有內容。"},{"i":151,"start":642.344,"end":647.61,"en":"And you may wonder, okay, how do I create these policies that look super complex?","zh":"您可能想知道，好吧，我該如何創建這些看起來超級複雜的策略？"},{"i":152,"start":647.706,"end":652.426,"en":"And even if you know a thing or two about it, it still is not fun to write them.","zh":"即使你對此了解一二，寫它們仍然沒有樂趣。"},{"i":153,"start":652.78,"end":659.085,"en":"Well, of course, for one, AWS has a visual builder, so you can really","zh":"嗯，當然，首先，AWS 有一個視覺化建構器，所以你真的可以"},{"i":154,"start":660.143,"end":666.699,"en":"use the AWS resources they give you to build up on blueprints and also build those policies","zh":"使用他們為您提供的 AWS 資源來建立藍圖並建立這些策略"},{"i":155,"start":666.715,"end":667.036,"en":"like this.","zh":"像這樣。"},{"i":156,"start":667.517,"end":674.313,"en":"But even easier than that, you can ask an agent to write IAM policies.","zh":"但比這更簡單的是，您可以要求代理程式編寫 IAM 策略。"},{"i":157,"start":674.41,"end":677.632,"en":"And with that, I don't mean write and automatically use.","zh":"就此而言，我的意思並不是說編寫並自動使用。"},{"i":158,"start":678.097,"end":681.11,"en":"I mean write, and then you can take a look at them.","zh":"我的意思是寫下來，然後你就可以看一下。"},{"i":159,"start":681.399,"end":686.897,"en":"And you don't need to be an expert to understand or to get the gist of a policy.","zh":"您無需成為專家即可理解或掌握政策的要點。"},{"i":160,"start":687.234,"end":691.969,"en":"Of course, if you skim over a policy like this, you can tell what this is about.","zh":"當然，如果你瀏覽這樣的政策，你就能知道它是關於什麼的。"},{"i":161,"start":692.145,"end":696.175,"en":"That describe actions are probably not about writing anything.","zh":"描述動作可能與寫任何東西無關。"},{"i":162,"start":696.882,"end":702.582,"en":"That these conditions probably are about restricting the instance types as I showed you.","zh":"正如我向您展示的那樣，這些條件可能與限制實例類型有關。"},{"i":163,"start":703.063,"end":709.646,"en":"So even without expert knowledge, you can analyze this policy and look over it to see","zh":"因此，即使沒有專業知識，您也可以分析該策略並查看它以了解"},{"i":164,"start":709.646,"end":711.461,"en":"that it's in line with what you wanted.","zh":"它符合你想要的。"},{"i":165,"start":711.958,"end":716.839,"en":"And it is also quite likely that the agent wrote a policy you're happy with, to be fair.","zh":"公平地說，代理人也很可能已經制定了您滿意的保單。"},{"i":166,"start":717.448,"end":722.69,"en":"So you can have an agent write the policy, then you can review it, then you can use it,","zh":"所以你可以讓代理人寫政策，然後你可以審查它，然後你可以使用它，"},{"i":167,"start":722.706,"end":724.341,"en":"and then you can have an agent use it.","zh":"然後你可以讓代理人使用它。"},{"i":168,"start":724.726,"end":727.371,"en":"That can be very, very powerful, of course.","zh":"當然，這可能非常非常強大。"},{"i":169,"start":727.547,"end":733.655,"en":"Now, there are safer alternatives though if you're not happy with letting the agent use","zh":"現在，如果您不滿意讓代理商使用，還有更安全的選擇"},{"i":170,"start":733.703,"end":734.665,"en":"the CLI.","zh":"CLI。"},{"i":171,"start":734.825,"end":741.109,"en":"And one safer option would be the AWS MCP server, which is very close to the","zh":"一種更安全的選擇是 AWS MCP 伺服器，它非常接近"},{"i":172,"start":741.253,"end":742.744,"en":"CLI but not quite.","zh":"CLI 但不完全是。"},{"i":173,"start":743.626,"end":749.22,"en":"You can install that and then also use roles and policies there to control what the can","zh":"您可以安裝它，然後也可以使用其中的角色和策略來控制可以執行的操作"},{"i":174,"start":749.236,"end":750.984,"en":"do through the MCP server.","zh":"透過 MCP 伺服器執行。"},{"i":175,"start":751.416,"end":758.181,"en":"And one nice thing about using the MCP instead of the CLI is that if a request is","zh":"使用 MCP 而不是 CLI 的一個好處是，如果請求是"},{"i":176,"start":758.197,"end":764.513,"en":"made through the MCP, there is a special condition you can check for in your IAM","zh":"透過 MCP 進行，您可以在 IAM 中檢查一個特殊條件"},{"i":177,"start":764.641,"end":765.218,"en":"policies.","zh":"政策。"},{"i":178,"start":765.282,"end":772.047,"en":"You can check whether a resource reading or editing request is made via MCP, and then","zh":"您可以檢查是否透過MCP發出了資源讀取或編輯請求，然後"},{"i":179,"start":772.159,"end":775.093,"en":"you can either deny or grant that access.","zh":"您可以拒絕或授予該存取權限。"},{"i":180,"start":775.141,"end":780.255,"en":"So you have an additional field for more fine-grained access so that you could set up","zh":"因此，您有一個額外的字段可以進行更細粒度的訪問，以便您可以設置"},{"i":181,"start":780.255,"end":786.358,"en":"a policy that clearly denies certain actions if made through the MCP to protect certain","zh":"明確拒絕透過 MCP 採取某些行動以保護某些行為的政策"},{"i":182,"start":786.374,"end":790.919,"en":"resources, because deny rules always take precedence in AWS.","zh":"資源，因為拒絕規則在 AWS 中始終優先。"},{"i":183,"start":791.257,"end":792.783,"en":"So that's a little bonus you get there.","zh":"所以這是你得到的一點好處。"},{"i":184,"start":792.959,"end":796.814,"en":"But other than that, using the CLI or the MCP is pretty close to each other.","zh":"但除此之外，使用 CLI 或 MCP 彼此非常接近。"},{"i":185,"start":797.055,"end":800.991,"en":"By the way, there also is of course another option besides the CLI and the MCP.","zh":"順便說一句，除了 CLI 和 MCP 之外，當然還有另一種選擇。"},{"i":186,"start":801.713,"end":804.942,"en":"You could also have the AI just write code, right?","zh":"你也可以讓人工智慧只寫程式碼，對吧？"},{"i":187,"start":805.006,"end":808.022,"en":"So you have these 3 options essentially.","zh":"所以你基本上有這 3 個選擇。"},{"i":188,"start":808.454,"end":809.832,"en":"CLI, MCP, code.","zh":"CLI、MCP、代碼。"},{"i":189,"start":809.88,"end":811.739,"en":"That is what we used thus far, the CLI.","zh":"這就是我們迄今為止所使用的 CLI。"},{"i":190,"start":812.139,"end":813.245,"en":"You could use the MCP.","zh":"您可以使用 MCP。"},{"i":191,"start":813.501,"end":820.118,"en":"And of course, the AI can also just write a short script that would use AWS SDKs to","zh":"當然，AI 也可以寫一個簡短的腳本，使用 AWS SDK 來"},{"i":192,"start":820.454,"end":821.88,"en":"manipulate the account.","zh":"操縱帳戶。"},{"i":193,"start":822.313,"end":825.869,"en":"Still, permissions are needed, so that doesn't change, but these are your options here.","zh":"不過，仍然需要權限，因此這不會改變，但這些是您的選擇。"},{"i":194,"start":826.478,"end":830.179,"en":"Now, the safer options use a different approach.","zh":"現在，更安全的選擇使用不同的方法。"},{"i":195,"start":830.323,"end":836.619,"en":"Instead of leveraging the CLI, MCP, or code, they are all about infrastructure as code.","zh":"它們不是利用 CLI、MCP 或程式碼，而是基礎設施即程式碼。"},{"i":196,"start":837.517,"end":840.932,"en":"And what does infrastructure as code mean now?","zh":"基礎設施即程式碼現在意味著什麼？"},{"i":197,"start":841.461,"end":845.244,"en":"That means using something like AWS CloudFormation.","zh":"這意味著使用 AWS CloudFormation 之類的東西。"},{"i":198,"start":845.612,"end":851.479,"en":"And AWS CloudFormation is all about setting up AWS resources in YAML using a certain","zh":"AWS CloudFormation 就是使用特定的 YAML 格式設定 AWS 資源。"},{"i":199,"start":851.479,"end":852.922,"en":"structure and syntax, of course.","zh":"當然是結構和語法。"},{"i":200,"start":853.467,"end":859.334,"en":"And then you can deploy such a template here through the CloudFormation service, which","zh":"然後你可以透過CloudFormation服務在這裡部署這樣的模板，"},{"i":201,"start":859.334,"end":865.025,"en":"is an official AWS thing, to create the actual resources based on that template.","zh":"是 AWS 的官方產品，用於根據該範本建立實際資源。"},{"i":202,"start":865.41,"end":870.336,"en":"And of course, you can have an AI agent write such a template for you, but then you're","zh":"當然，你可以讓人工智慧代理為你寫這樣的模板，但隨後你就"},{"i":203,"start":870.4,"end":875.607,"en":"leveraging an agent for creating the template and you can still deploy it on your own","zh":"利用代理來建立模板，您仍然可以自行部署它"},{"i":204,"start":875.687,"end":876.395,"en":"as a human.","zh":"作為一個人。"},{"i":205,"start":876.845,"end":881.819,"en":"So the agent can write the template or use some other infrastructure as code solution.","zh":"因此，代理可以編寫模板或使用其他一些基礎設施作為程式碼解決方案。"},{"i":206,"start":881.868,"end":882.647,"en":"I'll get back to it.","zh":"我會回過頭來談談。"},{"i":207,"start":883.149,"end":884.658,"en":"And then in the safest option,","zh":"然後在最安全的選擇中，"},{"i":208,"start":888.44,"end":890.033,"en":"you review plus deploy.","zh":"您進行審查並部署。"},{"i":209,"start":890.339,"end":893.8,"en":"So you don't let the agent deploy it automatically or anything like that.","zh":"所以你不要讓代理自動部署它或類似的東西。"},{"i":210,"start":894.186,"end":895.941,"en":"Instead, you do it manually.","zh":"相反，您可以手動執行此操作。"},{"i":211,"start":896.021,"end":898.564,"en":"You just use an agent to generate that template just as it may","zh":"您只需使用代理來產生該模板即可"},{"i":212,"start":900.34,"end":901.623,"en":"generate other code.","zh":"產生其他程式碼。"},{"i":213,"start":901.799,"end":905.618,"en":"And as mentioned, there are other infrastructure as code solutions.","zh":"如前所述，還有其他基礎架構即程式碼解決方案。"},{"i":214,"start":905.666,"end":909.757,"en":"CloudFormation can be a bit clunky, but if agents write it, it is quite okay, I have","zh":"CloudFormation可能有點笨重，但是如果代理寫的話，那是完全可以的，我有"},{"i":215,"start":909.757,"end":910.03,"en":"to say.","zh":"說。"},{"i":216,"start":910.543,"end":914.409,"en":"But you could be using Terraform, you could be using Pulumi, which allows you to use","zh":"但是你可以使用 Terraform，你可以使用 Pulumi，它允許你使用"},{"i":217,"start":914.409,"end":918.805,"en":"TypeScript to define your AWS resources, for example, which can be really nice.","zh":"例如，用於定義 AWS 資源的 TypeScript 非常好。"},{"i":218,"start":919.463,"end":924.083,"en":"You can use Alchemy, which is a rather new solution that also uses TypeScript but then","zh":"您可以使用 Alchemy，這是一個相當新的解決方案，也使用 TypeScript，但隨後"},{"i":219,"start":924.115,"end":926.329,"en":"uses the Effect library.","zh":"使用效果庫。"},{"i":220,"start":926.762,"end":932.858,"en":"To basically blend Effect and all the rules and the safety you get from using the Effect","zh":"基本上混合效果和所有規則以及使用效果所獲得的安全性"},{"i":221,"start":932.858,"end":937.558,"en":"library and create your AWS resources in TypeScript then.","zh":"然後使用 TypeScript 建立您的 AWS 資源。"},{"i":222,"start":938.135,"end":941.039,"en":"But whatever you use, you can have an agent write that.","zh":"但無論你使用什麼，你都可以讓代理來寫。"},{"i":223,"start":941.199,"end":946.942,"en":"And then in the safe solution, you have an agent write it, you review, plus the agent","zh":"然後在安全的解決方案中，你有一個代理人寫它，你審查，再加上代理人"},{"i":224,"start":947.118,"end":948.161,"en":"deploys, let's say.","zh":"部署，比方說。"},{"i":225,"start":948.498,"end":953.887,"en":"And in the safest option, you deploy so that you're super safe and sure that the agent","zh":"在最安全的選項中，您進行部署，以便超級安全並確保代理"},{"i":226,"start":953.887,"end":956.374,"en":"is not doing anything in your production environment.","zh":"不在您的生產環境中執行任何操作。"},{"i":227,"start":956.759,"end":957.769,"en":"Instead, you're doing it.","zh":"相反，你正在這樣做。"},{"i":228,"start":958.763,"end":965.047,"en":"And that's therefore a set of options you have for letting an AI help you","zh":"因此，這就是讓人工智慧幫助你的一組選項"},{"i":229,"start":965.64,"end":971.155,"en":"manage your AWS account, your resources, and a couple of things you should simply consider","zh":"管理您的 AWS 帳戶、資源以及您應該簡單考慮的一些事項"},{"i":230,"start":971.267,"end":972.277,"en":"and be aware of.","zh":"並注意。"},{"i":231,"start":972.725,"end":979.282,"en":"Because AI can make working with AWS so much more convenient, you really","zh":"因為 AI 可以讓使用 AWS 變得更方便，您真的"},{"i":232,"start":979.282,"end":980.372,"en":"shouldn't sleep on it.","zh":"不應該睡在上面。"},{"i":233,"start":980.725,"end":986.64,"en":"And which approach you then use simply depends on your own personal preferences, risk","zh":"然後您使用哪種方法完全取決於您自己的個人喜好、風險"},{"i":234,"start":986.656,"end":989.685,"en":"profile, and of course, which company you're working at.","zh":"個人資料，當然還有您在哪家公司工作。"},{"i":235,"start":989.927,"end":990.477,"en":"And so on.","zh":"等等。"},{"i":236,"start":991.48,"end":996.654,"en":"But not doing any of that is probably not a good idea, which is why I wanted to share","zh":"但不這樣做可能不是一個好主意，這就是為什麼我想分享"},{"i":237,"start":996.654,"end":996.784,"en":"this.","zh":"這。"}]},{"id":"G-v1hkQ8Sf8","title":"Self-hosted durable objects are pretty interesting!","date":"20260813","file":"20260813_G-v1hkQ8Sf8_self-hosted-durable-objects-are-pretty-interesting.srt","cueCount":301,"issues":0,"duration":1178,"cues":[{"i":1,"start":0.176,"end":4.623,"en":"Last week, Ryan Dahl, the creator of Deno, launched Svelte.","zh":"上週，Deno 的創建者 Ryan Dahl 推出了 Svelte。"},{"i":2,"start":5.233,"end":6.63,"en":"And Svelte is quite interesting.","zh":"Svelte 非常有趣。"},{"i":3,"start":6.694,"end":12.04,"en":"It's a self-hosted distributed durable objects and workers implementation.","zh":"它是一個自架的分散式持久化物件和工作人員實作。"},{"i":4,"start":12.634,"end":13.935,"en":"What does that mean though?","zh":"但這意味著什麼？"},{"i":5,"start":14.962,"end":18.382,"en":"Durable objects are Cloudflare durable objects.","zh":"持久化物件是 Cloudflare 持久化物件。"},{"i":6,"start":18.43,"end":23.889,"en":"It's a service by Cloudflare and it's a service that's all about giving you a worker","zh":"這是 Cloudflare 提供的一項服務，它的目的是為您提供一個工作人員"},{"i":7,"start":24.916,"end":26.184,"en":"with some extra stuff.","zh":"還有一些額外的東西。"},{"i":8,"start":26.746,"end":32.324,"en":"Because a durable object in the end is just like a worker, an event handler function","zh":"因為持​​久性物件最終就像一個worker，一個事件處理函數"},{"i":9,"start":32.373,"end":35.675,"en":"sitting somewhere in the cloud waiting for an event to happen.","zh":"坐在雲端的某個地方等待事件發生。"},{"i":10,"start":35.723,"end":40.051,"en":"An event could be an HTTP request arriving at it, that would be quite common.","zh":"事件可以是到達它的 HTTP 請求，這很常見。"},{"i":11,"start":40.388,"end":42.039,"en":"It could also be a cron trigger.","zh":"它也可能是 cron 觸發器。"},{"i":12,"start":42.472,"end":47.697,"en":"Cloudflare gives you different events you can use to trigger an event handler, a worker.","zh":"Cloudflare 為您提供了不同的事件，您可以使用它們來觸發事件處理程序（即工作人員）。"},{"i":13,"start":48.082,"end":50.839,"en":"You can think of it as AWS Lambda in case you know that.","zh":"如果您知道的話，您可以將其視為 AWS Lambda。"},{"i":14,"start":51.432,"end":56.257,"en":"Now, a durable object is basically an enhanced version of that, which does not mean it's","zh":"現在，耐用物件基本上是其增強版本，這並不意味著它是"},{"i":15,"start":56.482,"end":60.732,"en":"always better, but for certain use cases, it's better because a durable object has that","zh":"總是更好，但對於某些用例，更好，因為耐用的物件具有"},{"i":16,"start":60.732,"end":65.161,"en":"event handler function or actually multiple functions if you need them as you'll see,","zh":"事件處理函數或實際上是多個函數（如果您需要的話），如您所見，"},{"i":17,"start":65.643,"end":68.419,"en":"but it also comes with persistent storage.","zh":"但它還附帶持久存儲。"},{"i":18,"start":68.916,"end":74.725,"en":"Typically modern durable objects created on Cloudflare come with a SQLite storage attached","zh":"通常，在 Cloudflare 上建立的現代持久性物件都附帶 SQLite 存儲"},{"i":19,"start":75.03,"end":77.213,"en":"and persistent really means persistent.","zh":"而堅持確實意味著堅持。"},{"i":20,"start":77.517,"end":81.224,"en":"It's not just for a few hours or definitely not for one request.","zh":"這不僅僅是幾個小時或絕對不是一個請求。"},{"i":21,"start":81.272,"end":84.145,"en":"Instead, it's there for weeks, months, years.","zh":"相反，它會在那裡存在數週、數月、數年。"},{"i":22,"start":84.755,"end":89.869,"en":"It's really a function with some fixed storage attached to it.","zh":"它實際上是一個附加了一些固定存儲的功能。"},{"i":23,"start":89.949,"end":94.694,"en":"Great for building distributed systems since you can have different handlers for different","zh":"非常適合建立分散式系統，因為您可以針對不同的情況使用不同的處理程序"},{"i":24,"start":94.694,"end":98.445,"en":"events and every handler can memorize stuff and store data.","zh":"事件和每個處理程序都可以記住內容並儲存資料。"},{"i":25,"start":98.942,"end":103.495,"en":"To make this really useful though, every durable object also comes with a fixed address,","zh":"為了使其真正有用，每個持久性物件還帶有一個固定位址，"},{"i":26,"start":103.559,"end":109.778,"en":"which is kind of required so that a future request that is about the same thing can reach","zh":"這是必需的，以便將來關於同一件事的請求可以到達"},{"i":27,"start":109.842,"end":112.391,"en":"the same function and operate on the same data.","zh":"相同的功能並對相同的數據進行操作。"},{"i":28,"start":112.696,"end":117.578,"en":"Persistent data wouldn't be worth a lot if you had no way of controlling which request","zh":"如果您無法控制哪個請求，持久性資料就沒有太大價值"},{"i":29,"start":117.61,"end":118.092,"en":"gets there.","zh":"到達那裡。"},{"i":30,"start":118.879,"end":120.951,"en":"So that is a durable object.","zh":"所以這是一個耐用的物體。"},{"i":31,"start":121.208,"end":128.178,"en":"And unlike workers, it is also all about saving that storage or having that storage.","zh":"與工人不同的是，這還在於節省儲存空間或擁有該儲存空間。"},{"i":32,"start":128.451,"end":131.776,"en":"Now, that's all good, but let's see some example maybe.","zh":"現在，這一切都很好，但讓我們來看一些例子。"},{"i":33,"start":131.824,"end":135.855,"en":"And for that, I prepared a little repo which you find attached where I have the same","zh":"為此，我準備了一個小倉庫，您可以在其中找到我有相同內容的附件"},{"i":34,"start":135.904,"end":138.602,"en":"examples both in the Svelte and the Cloudflare version.","zh":"Svelte 和 Cloudflare 版本中的範例。"},{"i":35,"start":138.65,"end":141.541,"en":"And we'll get back to Svelte, but let's start with Cloudflare.","zh":"我們將回到 Svelte，但讓我們從 Cloudflare 開始。"},{"i":36,"start":142.182,"end":145.05,"en":"There in the source folder, you can take a look at the counter.","zh":"在來源資料夾中，您可以查看計數器。"},{"i":37,"start":145.162,"end":148.367,"en":"It's a very basic example to understand what durable objects are.","zh":"這是一個了解什麼是耐用物件的非常基本的範例。"},{"i":38,"start":148.895,"end":152.837,"en":"You see, I have a class Counter which extends DurableObject, which is coming from Cloudflare.","zh":"您看，我有一個繼承自 Cloudflare 的 DurableObject 的 Counter 類別。"},{"i":39,"start":153.702,"end":155.753,"en":"And then I have 2 methods in there.","zh":"然後我有兩種方法。"},{"i":40,"start":155.865,"end":160.367,"en":"I mentioned we can have multiple entry points with durable objects for doing different","zh":"我提到我們可以有多個具有持久性物件的入口點來執行不同的操作"},{"i":41,"start":160.367,"end":160.687,"en":"stuff.","zh":"東西."},{"i":42,"start":161.152,"end":163.491,"en":"Both times we are operating on some storage.","zh":"這兩次我們都在一些存儲上進行操作。"},{"i":43,"start":164.052,"end":168.794,"en":"Here, since it's a basic counter example, it's all about getting a value out of the counter","zh":"在這裡，由於這是一個基本的計數器範例，因此所有內容都是從計數器中獲取值"},{"i":44,"start":169.083,"end":170.749,"en":"or putting a value back into it.","zh":"或將一個值放回其中。"},{"i":45,"start":171.102,"end":175.027,"en":"An incremented version of that value in this case here.","zh":"在本例中為該值的遞增版本。"},{"i":46,"start":175.203,"end":179.289,"en":"So managing a counter, but a counter persisted in the cloud.","zh":"因此管理一個計數器，但計數器仍然存在於雲端。"},{"i":47,"start":179.337,"end":183.198,"en":"So it is always there, so to say.","zh":"所以可以這麼說，它總是存在的。"},{"i":48,"start":184.24,"end":189.399,"en":"Now to reach that durable object, we have an entry point, an index.ts file here.","zh":"現在為了到達那個持久對象，我們有一個入口點，這裡有一個 index.ts 檔案。"},{"i":49,"start":189.847,"end":192.219,"en":"And in there we have an actual worker.","zh":"在那裡我們有一個真正的工人。"},{"i":50,"start":192.491,"end":198.548,"en":"So a durable object without a fixed address and without storage because this worker has","zh":"因此，一個沒有固定位址且沒有儲存的持久對象，因為該工作人員有"},{"i":51,"start":198.596,"end":199.445,"en":"a simple job.","zh":"一個簡單的工作。"},{"i":52,"start":200.022,"end":205.294,"en":"It should handle all incoming requests and then forward them to the different durable","zh":"它應該處理所有傳入的請求，然後將它們轉發到不同的持久"},{"i":53,"start":205.534,"end":210.967,"en":"objects based on the URL because the URL is that fixed address in the end.","zh":"基於 URL 的對象，因為 URL 最終就是那個固定位址。"},{"i":54,"start":211.479,"end":216.399,"en":"So in that worker, we take a look at the URL and we extract the name in the end from","zh":"因此，在該工作程序中，我們查看 URL，並從最後提取名稱"},{"i":55,"start":216.511,"end":223.37,"en":"the URL, so from the path in the end, and we take a look if we have a counter","zh":"URL，所以從最後的路徑來看，我們看看是否有計數器"},{"i":56,"start":223.722,"end":224.219,"en":"resource.","zh":"資源。"},{"i":57,"start":224.395,"end":229.5,"en":"So actually we extract 2 segments from the URL, the type of durable object and then the","zh":"所以實際上我們從 URL 中提取 2 段，即持久性物件的類型，然後是"},{"i":58,"start":229.5,"end":231.106,"en":"exact name of it.","zh":"它的確切名稱。"},{"i":59,"start":231.684,"end":236.791,"en":"And we check if it's a counter we wanna take a look at, a tickets durable object, which","zh":"我們檢查它是否是一個我們想要查看的計數器，一個票證耐用對象，"},{"i":60,"start":236.823,"end":237.466,"en":"we'll get back to.","zh":"我們稍後會回來。"},{"i":61,"start":237.787,"end":240.116,"en":"And then we also have an AI agent, which I'll also get back.","zh":"然後我們還有一個人工智慧代理，我也會把它拿回來。"},{"i":62,"start":240.501,"end":243.81,"en":"Now you may be wondering, okay, this is a bit too quick.","zh":"現在您可能想知道，好吧，這有點太快了。"},{"i":63,"start":244.067,"end":249.19,"en":"Fixed name, now we have counters and that is not the name, but instead the resource.","zh":"固定名稱，現在我們有了計數器，這不是名稱，而是資源。"},{"i":64,"start":249.271,"end":250.202,"en":"What's the name about then?","zh":"那叫什麼名字呢？"},{"i":65,"start":250.7,"end":251.889,"en":"Let's see it in action.","zh":"讓我們看看它的實際效果。"},{"i":66,"start":252.707,"end":259.648,"en":"I have this demo MD file and I already deployed everything so I can send","zh":"我有這個演示 MD 文件，並且我已經部署了所有內容，因此我可以發送"},{"i":67,"start":259.68,"end":261.251,"en":"this request here.","zh":"這個請求在這裡。"},{"i":68,"start":261.86,"end":268.272,"en":"I deployed my durable objects worker setup, by the way, in case you're interested, that","zh":"我部署了我的持久對象工作人員設置，順便說一句，如果您有興趣的話，"},{"i":69,"start":268.272,"end":274.54,"en":"is done with help of a Wrangler JSONC file which basically configures what you wanna","zh":"是在 Wrangler JSONC 文件的幫助下完成的，該文件基本上配置了您想要的內容"},{"i":70,"start":274.604,"end":276.944,"en":"deploy and how these things are related.","zh":"部署以及這些事物之間的關係。"},{"i":71,"start":277.008,"end":282.923,"en":"You see here I'm registering 3 durable objects and then I also have one main entry point","zh":"你看，我在這裡註冊了 3 個持久對象，然後我還有一個主要入口點"},{"i":72,"start":282.923,"end":288.147,"en":"which is that main worker that is responsible for distributing work, so to say.","zh":"可以說，這是負責分配工作的主要工人。"},{"i":73,"start":288.724,"end":295.053,"en":"So I have that up and running and therefore I can now send a request like this to this","zh":"所以我已經啟動並運行了，因此我現在可以向此發送這樣的請求"},{"i":74,"start":295.598,"end":297.969,"en":"domain and then with this path.","zh":"網域，然後使用此路徑。"},{"i":75,"start":298.081,"end":301.734,"en":"Now this path, as you can see, consists of 2 segments and here's why.","zh":"現在，正如您所看到的，這條路徑由 2 段組成，原因如下。"},{"i":76,"start":302.391,"end":305.019,"en":"I have that counter durable object, right?","zh":"我有那個櫃檯耐用的東西，對嗎？"},{"i":77,"start":306.157,"end":306.637,"en":"This one here.","zh":"這裡這個。"},{"i":78,"start":306.974,"end":312.149,"en":"And I want to reach that for every request that targets my worker here that then has","zh":"我希望針對我的員工提出的每個請求都能達到這個目標"},{"i":79,"start":312.261,"end":314.553,"en":"a first path segment of counters.","zh":"計數器的第一路徑段。"},{"i":80,"start":314.65,"end":315.804,"en":"That's just my definition.","zh":"這只是我的定義。"},{"i":81,"start":315.852,"end":317.086,"en":"It's my code, my project.","zh":"這是我的程式碼，我的專案。"},{"i":82,"start":317.15,"end":319.603,"en":"I could have chosen a different identifier, but that is mine.","zh":"我本來可以選擇不同的標識符，但那是我的。"},{"i":83,"start":320.517,"end":325.294,"en":"However, a durable object is actually replicatable.","zh":"然而，持久性物件實際上是可複製的。"},{"i":84,"start":326.063,"end":331.465,"en":"So here I define a durable object, but then we can have multiple instances, which makes","zh":"所以這裡我定義了一個持久對象，但是然後我們可以有多個實例，這使得"},{"i":85,"start":331.465,"end":331.593,"en":"sense.","zh":"感覺。"},{"i":86,"start":331.658,"end":332.507,"en":"It's a class, right?","zh":"這是一個班級吧？"},{"i":87,"start":332.555,"end":333.357,"en":"It's a blueprint.","zh":"這是一個藍圖。"},{"i":88,"start":333.405,"end":339.144,"en":"We can have multiple instances of that class and every instance is separate from the","zh":"我們可以有該類別的多個實例，並且每個實例都與"},{"i":89,"start":339.256,"end":340.073,"en":"other instances.","zh":"其他情況。"},{"i":90,"start":340.618,"end":346.486,"en":"So we have one definition that, but then potentially 10 or 100 or 1 million versions","zh":"所以我們有一個定義，但可能有 10 個、100 個或 100 萬個版本"},{"i":91,"start":346.63,"end":347.864,"en":"of that durable object.","zh":"那個耐用的物品。"},{"i":92,"start":348.089,"end":351.423,"en":"And it's the individual instances that have the fixed name.","zh":"具有固定名稱的是各個實例。"},{"i":93,"start":352.08,"end":357.467,"en":"So I identify which kind of instance I'm interested in, which type of durable object,","zh":"所以我確定我感興趣的實例類型，持久性物件的類型，"},{"i":94,"start":357.627,"end":359.711,"en":"but then the name is the last segment.","zh":"但名稱是最後一段。"},{"i":95,"start":360.016,"end":362.372,"en":"Alice, for example, to get Alice's counter.","zh":"以愛麗絲為例，獲取愛麗絲的櫃檯。"},{"i":96,"start":363.014,"end":365.963,"en":"So if I send this, I get the current value, which here is 2.","zh":"所以如果我發送這個，我會得到當前值，這裡是 2。"},{"i":97,"start":366.749,"end":370.051,"en":"And I can then also send that other request here.","zh":"然後我也可以在此處發送其他請求。"},{"i":98,"start":372.215,"end":373.61,"en":"To increment that counter.","zh":"增加該計數器。"},{"i":99,"start":374.54,"end":377.489,"en":"And if I now get it again, I get 3 here too.","zh":"如果我現在再次得到它，我也會在這裡得到 3。"},{"i":100,"start":378.21,"end":385.184,"en":"If I get the counter of Max, I get 0 because this is a new version of the durable","zh":"如果我得到 Max 的計數器，我得到 0，因為這是耐用的新版本"},{"i":101,"start":385.184,"end":390.81,"en":"object which was now created in this second where I sent the request because they are","zh":"現在在我發送請求的那一秒創建了對象，因為它們是"},{"i":102,"start":390.81,"end":392.141,"en":"of course created lazily.","zh":"當然是懶惰創建的。"},{"i":103,"start":392.493,"end":396.052,"en":"But now I sent the request to a durable object that didn't exist before.","zh":"但現在我將請求發送到一個以前不存在的持久性物件。"},{"i":104,"start":396.276,"end":399.37,"en":"So a new instance was created, but now it stays there.","zh":"因此創建了一個新實例，但現在它保留在那裡。"},{"i":105,"start":399.466,"end":401.759,"en":"Now it has its storage which is persisted.","zh":"現在它的儲存是持久的。"},{"i":106,"start":402.16,"end":404.244,"en":"You're not paying for uptime, no worries.","zh":"您無需為正常運行時間付費，不用擔心。"},{"i":107,"start":404.694,"end":408.206,"en":"It will go to sleep essentially, but the storage will be persisted.","zh":"它本質上會進入睡眠狀態，但儲存將被持久化。"},{"i":108,"start":408.543,"end":413.45,"en":"So if I send a request to increment the counter, for example, it is now 1.","zh":"例如，如果我發送一個增加計數器的請求，那麼它現在是 1。"},{"i":109,"start":414.044,"end":417.524,"en":"I'm operating on that same object, but now I have 2 versions of that counter object.","zh":"我正在對同一個物件進行操作，但現在我有該計數器物件的 2 個版本。"},{"i":110,"start":417.668,"end":420.074,"en":"That is how durable objects work.","zh":"這就是耐用物件的工作原理。"},{"i":111,"start":420.716,"end":424.581,"en":"Now, a more interesting realistic example would be the tickets example.","zh":"現在，一個更有趣的現實範例是門票範例。"},{"i":112,"start":425.671,"end":430.82,"en":"It's the same shape, but here the idea is that you could be building a system where people","zh":"它的形狀相同，但這裡的想法是你可以建立一個系統，人們可以在其中"},{"i":113,"start":430.82,"end":434.715,"en":"can buy tickets and you have a limited amount of tickets.","zh":"可以買票，門票數量有限。"},{"i":114,"start":435.004,"end":435.757,"en":"Here it's 5.","zh":"這裡是 5。"},{"i":115,"start":436.286,"end":442.442,"en":"Now, of course, you wanna make sure that it's not really possible for 2 people to send","zh":"現在，當然，您想確保 2 個人實際上不可能發送"},{"i":116,"start":442.442,"end":448.71,"en":"a request at about the same time and both get the last ticket, which wouldn't work, but","zh":"大約在同一時間發出請求，並且都獲得了最後一張票，這是行不通的，但是"},{"i":117,"start":448.71,"end":451.852,"en":"it would work technically depending on how you set things up.","zh":"從技術上講，它的工作原理取決於您的設定方式。"},{"i":118,"start":452.365,"end":454.224,"en":"With durable objects, you're safe.","zh":"有了耐用的物品，你就安全了。"},{"i":119,"start":454.368,"end":460.059,"en":"Not only is one advantage that you can easily build distributed systems, but another","zh":"可以輕鬆建立分散式系統不僅是一個優點，而且是另一個優點"},{"i":120,"start":460.059,"end":466.679,"en":"advantage which I didn't mention yet is that Cloudflare, will guarantee that requests","zh":"我還沒有提到的優點是 Cloudflare 將保證請求"},{"i":121,"start":466.871,"end":472.255,"en":"are processed in order, or to be precise, they can be processed in parallel, but the","zh":"是按順序處理的，或者準確的說是可以並行處理的，但是"},{"i":122,"start":472.255,"end":476.246,"en":"storage will be touched and mutated in order.","zh":"儲存將按順序被觸及和變異。"},{"i":123,"start":476.727,"end":482.191,"en":"So it's not possible with durable objects on Cloudflare and also on Svelte, as you will","zh":"因此，在 Cloudflare 和 Svelte 上使用持久性物件是不可能的，正如您所做的那樣"},{"i":124,"start":482.191,"end":486.759,"en":"later see, to buy the last ticket twice, for example.","zh":"後來看看，例如把最後一張票買兩次。"},{"i":125,"start":486.999,"end":488.329,"en":"So that would be one good example.","zh":"這將是一個很好的例子。"},{"i":126,"start":488.986,"end":494.419,"en":"And again, it's not just about preventing that simultaneous purchase, it's also about","zh":"再說一遍，這不僅是為了防止同時購買，也是為了"},{"i":127,"start":495.252,"end":498.574,"en":"having that advantage of building distributed systems if you want to do that.","zh":"如果您想這樣做，那麼擁有建立分散式系統的優勢。"},{"i":128,"start":499.279,"end":505.729,"en":"So here I in the end have again just a counter if you're looking at it like this, because","zh":"所以如果你這樣看的話，我最終還是有一個計數器，因為"},{"i":129,"start":505.841,"end":508.906,"en":"I have a capacity, we can get the capacity and we can change it.","zh":"我有能力，我們可以獲得能力並且可以改變它。"},{"i":130,"start":508.97,"end":513.398,"en":"It's, it's a counter, but it's a good example for a more realistic durable object.","zh":"它是，它是一個計數器，但它是一個更現實的耐用物件的好例子。"},{"i":131,"start":514.024,"end":520.939,"en":"So here to also show this, of course I can send this request to get some meetup tickets.","zh":"所以在這裡也表明這一點，我當然可以發送此請求以獲得一些聚會門票。"},{"i":132,"start":520.987,"end":522.174,"en":"Again, the logic is the same.","zh":"同樣，邏輯是相同的。"},{"i":133,"start":522.27,"end":527.551,"en":"We have our durable object type and then we have concrete instances with different names","zh":"我們有持久性物件類型，然後有不同名稱的具體實例"},{"i":134,"start":527.905,"end":529.431,"en":"and the names are totally up to you.","zh":"名字完全由你決定。"},{"i":135,"start":529.511,"end":534.924,"en":"But here if you go for meetup or meetups or whatever, or you can use whatever you want,","zh":"但在這裡，如果你去參加聚會或聚會或其他什麼，或者你可以使用任何你想要的東西，"},{"i":136,"start":535.133,"end":538.024,"en":"you see now I have a capacity of 5, sold 0.","zh":"你看現在我的產能是5，賣了0。"},{"i":137,"start":538.65,"end":544.288,"en":"If I send that other request, that POST request which is about selling and I also change","zh":"如果我發送其他請求，即關於銷售的 POST 請求，我也會更改"},{"i":138,"start":544.288,"end":548.255,"en":"this to meetups, now you see we sold 1, I have remaining 4.","zh":"這是聚會，現在你看我們賣了 1 個，我還剩下 4 個。"},{"i":139,"start":548.785,"end":554.243,"en":"If I do that again and again and again, at some point we're out of tickets here.","zh":"如果我一次又一次地這樣做，到了某個時候我們這裡的票就賣完了。"},{"i":140,"start":556.157,"end":558.494,"en":"That is an example for a durable object.","zh":"這是耐用物體的例子。"},{"i":141,"start":558.97,"end":564.059,"en":"Now, another example would be an AI agent, and agents are pretty good examples for durable","zh":"現在，另一個例子是人工智慧代理，代理是持久性的很好的例子"},{"i":142,"start":564.156,"end":570.673,"en":"objects because if you think about it, an AI agent, for one, often should run","zh":"對象，因為如果你想一想，人工智慧代理，例如，通常應該運行"},{"i":143,"start":570.705,"end":571.929,"en":"somewhere in the cloud.","zh":"在雲端的某個地方。"},{"i":144,"start":572.541,"end":574.844,"en":"You may not want it to run on your system.","zh":"您可能不希望它在您的系統上運作。"},{"i":145,"start":574.893,"end":577.802,"en":"Maybe you also want to share it with colleagues, something like this.","zh":"也許你也想與同事分享，類似這樣的事。"},{"i":146,"start":578.207,"end":579.066,"en":"So that's one thing.","zh":"所以這是一回事。"},{"i":147,"start":580.122,"end":582.018,"en":"In addition, it's definitely stateful.","zh":"此外，它絕對是有狀態的。"},{"i":148,"start":582.371,"end":583.688,"en":"It has this conversation.","zh":"有這樣的對話。"},{"i":149,"start":584.042,"end":587.447,"en":"Every request you send to the agent has just one message.","zh":"您發送給代理的每個請求都只有一條訊息。"},{"i":150,"start":587.833,"end":593.166,"en":"Of course, you could manage the history on your system and send the entire history with","zh":"當然，您可以管理系統上的歷史記錄並使用以下命令發送整個歷史記錄"},{"i":151,"start":593.198,"end":594.484,"en":"every request.","zh":"每一個請求。"},{"i":152,"start":594.982,"end":599.303,"en":"But if you don't wanna do that, if you wanna save some bandwidth, you could manage the","zh":"但如果你不想這樣做，如果你想節省一些頻寬，你可以管理"},{"i":153,"start":599.303,"end":602.066,"en":"history on the server instead in the durable object.","zh":"伺服器上的歷史記錄而不是持久性物件中的歷史記錄。"},{"i":154,"start":602.211,"end":603.271,"en":"So state makes sense.","zh":"所以狀態是有道理的。"},{"i":155,"start":603.496,"end":607.88,"en":"And it's not just the conversation history, the context, it's also, for example, files","zh":"它不僅僅是對話歷史記錄、上下文，還有文件等"},{"i":156,"start":607.977,"end":610.83,"en":"which you maybe want to upload so that the agent can operate on them.","zh":"您可能想要上傳這些內容，以便代理可以對其進行操作。"},{"i":157,"start":611.503,"end":616.088,"en":"Now I will say that especially with CELD, which we'll take a look at in a second, you","zh":"現在我要說的是，尤其是對於 CELD，我們稍後會討論，您"},{"i":158,"start":616.088,"end":621.01,"en":"don't have a file system, at least right now, in your cells, in your durable objects.","zh":"至少現在，在您的單元中、在您的耐用物件中沒有檔案系統。"},{"i":159,"start":621.378,"end":627.021,"en":"But you could kind of replicate it by attaching an S3 bucket, for example, or for small","zh":"但是您可以透過附加 S3 儲存桶來複製它，例如，或者對於小型儲存桶"},{"i":160,"start":627.15,"end":629.41,"en":"files you could also store them in SQLite.","zh":"您也可以將它們儲存在 SQLite 中。"},{"i":161,"start":630.436,"end":633.209,"en":"And that is what we'll be doing here in this demo, essentially.","zh":"本質上，這就是我們在本演示中要做的事情。"},{"i":162,"start":634.3,"end":640.813,"en":"So what we can do here then is still as before expose methods, in this case just one","zh":"那麼我們在這裡能做的仍然是像以前一樣公開方法，在這種情況下只有一個"},{"i":163,"start":640.861,"end":646.46,"en":"chat method, but in there we retrieve our history from that","zh":"聊天方法，但我們從中檢索歷史記錄"},{"i":164,"start":647.615,"end":652.652,"en":"storage and also our dataset, which is any files we may have.","zh":"儲存以及我們的資料集，即我們可能擁有的任何文件。"},{"i":165,"start":653.213,"end":660.207,"en":"And then we also take a look at what we got here and we return a response, we answer","zh":"然後我們也看看我們在這裡得到了什麼並返回一個回應，我們回答"},{"i":166,"start":660.993,"end":663.285,"en":"with a response that is AI generated.","zh":"並由人工智慧產生響應。"},{"i":167,"start":663.958,"end":667.212,"en":"And if we got a file, by the way, I'm storing that in the database, as I mentioned.","zh":"順便說一句，如果我們得到一個文件，我會將其儲存在資料庫中，正如我所提到的。"},{"i":168,"start":667.565,"end":670.996,"en":"Now here I'm using the AI SDK by Vercel.","zh":"現在我用的是 Vercel 的 AI SDK。"},{"i":169,"start":671.172,"end":672.663,"en":"That's why this code is quite lean.","zh":"這就是為什麼這段程式碼非常精簡。"},{"i":170,"start":672.935,"end":674.715,"en":"But indeed, I am setting up an agent here.","zh":"但事實上，我在這裡設立了一個代理人。"},{"i":171,"start":675.179,"end":680.117,"en":"I'm registering some tools, tools which are defined here, tools which allow the agent","zh":"我正在註冊一些工具，這裡定義的工具，允許代理的工具"},{"i":172,"start":680.453,"end":681.992,"en":"to actually read a file.","zh":"實際讀取文件。"},{"i":173,"start":682.056,"end":684.285,"en":"So get it from the database and read it.","zh":"所以從資料庫中獲取並讀取它。"},{"i":174,"start":684.621,"end":687.41,"en":"And also to run some code, some standard JavaScript code.","zh":"還可以運行一些程式碼，一些標準的 JavaScript 程式碼。"},{"i":175,"start":687.907,"end":694.142,"en":"JavaScript, because in both Cloudflare Workers and especially also you have, um,","zh":"JavaScript，因為在 Cloudflare Workers 中，尤其是，嗯，"},{"i":176,"start":695.376,"end":697.876,"en":"it's not a sandbox, it's not a Linux environment.","zh":"它不是沙箱，也不是 Linux 環境。"},{"i":177,"start":697.924,"end":703.004,"en":"You can't install arbitrary tools or execute arbitrary code in there, but you can execute","zh":"您不能在其中安裝任意工具或執行任意程式碼，但您可以執行"},{"i":178,"start":703.02,"end":703.982,"en":"JavaScript code in there.","zh":"JavaScript 程式碼就在那裡。"},{"i":179,"start":705.136,"end":711.129,"en":"Um, you still may wanna do this in a sandbox instead, uh, but here to keep things simple,","zh":"嗯，你可能仍然想在沙箱中執行此操作，但是為了簡單起見，"},{"i":180,"start":711.241,"end":712.972,"en":"we're just executing it in place.","zh":"我們只是就地執行它。"},{"i":181,"start":713.741,"end":714.959,"en":"So that's what's happening here.","zh":"這就是這裡發生的事情。"},{"i":182,"start":715.167,"end":717.939,"en":"And with that, I can send requests like this.","zh":"這樣，我就可以發送這樣的請求。"},{"i":183,"start":718.052,"end":718.806,"en":"This to","zh":"這到"},{"i":184,"start":720.057,"end":725.963,"en":"upload my sales CSV file, which is part of my project, and ask a question like which","zh":"上傳我的銷售 CSV 檔案（這是我的專案的一部分），然後提出一個問題，例如"},{"i":185,"start":727.022,"end":729.798,"en":"units, which product sold the most units.","zh":"單位，哪種產品銷售量最多。"},{"i":186,"start":730.231,"end":734.74,"en":"Or I could also ask for what's the overall revenue.","zh":"或者我也可以問一下總收入是多少。"},{"i":187,"start":736.024,"end":738.928,"en":"And now this will upload this file, send this request.","zh":"現在這將上傳該文件，發送該請求。"},{"i":188,"start":738.976,"end":739.939,"en":"It can take a short while.","zh":"這可能需要一段時間。"},{"i":189,"start":740.276,"end":742.234,"en":"We'll store the file in the database.","zh":"我們將該檔案儲存在資料庫中。"},{"i":190,"start":742.282,"end":747.662,"en":"So in following conversations, we shouldn't need to send that file and still be able","zh":"因此，在接下來的對話中，我們不需要發送該文件，但仍然能夠"},{"i":191,"start":747.662,"end":749.157,"en":"to ask questions about it.","zh":"詢問有關它的問題。"},{"i":192,"start":750.058,"end":755.171,"en":"And we should get back a response by the agent, which is now running in the cloud here.","zh":"我們應該得到代理的回應，該代理現在在雲端中運行。"},{"i":193,"start":757.12,"end":757.14,"en":"Yeah.","zh":"是的。"},{"i":194,"start":757.14,"end":762.44,"en":"And indeed, I could now send a follow-up message without a file.","zh":"事實上，我現在可以在沒有文件的情況下發送後續訊息。"},{"i":195,"start":762.958,"end":764.359,"en":"And for example, send,","zh":"例如，發送，"},{"i":196,"start":767.197,"end":772.582,"en":"what is the most popular product in sales CSV.","zh":"銷售 CSV 中最受歡迎的產品是什麼。"},{"i":197,"start":772.646,"end":777.719,"en":"And since I uploaded it before, due to the tools we gave this agent, it should be able","zh":"而且由於我之前上傳過，由於我們為該代理提供的工具，它應該能夠"},{"i":198,"start":777.847,"end":783.049,"en":"to use these tools in the cloud in this durable object and then answer this question.","zh":"在這個持久性物件中使用雲端中的這些工具然後回答這個問題。"},{"i":199,"start":783.547,"end":784.574,"en":"And it is able to do that.","zh":"它能夠做到這一點。"},{"i":200,"start":784.847,"end":788.186,"en":"So that is durable objects, but that is not Svelte, right?","zh":"那是耐用的物體，但那不是 Svelte，對吧？"},{"i":201,"start":788.443,"end":792.441,"en":"Well, it almost is because Svelte is the same thing but self-deployed.","zh":"嗯，這幾乎是因為 Svelte 是同一件事，但卻是自行部署的。"},{"i":202,"start":792.938,"end":796.855,"en":"With Cloudflare durable objects, you get a lot of convenience, but of course you're paying","zh":"使用 Cloudflare 耐用對象，您可以獲得很多便利，但當然您需要付費"},{"i":203,"start":796.952,"end":797.61,"en":"for them.","zh":"對於他們來說。"},{"i":204,"start":798.669,"end":805.466,"en":"Self-deployed, you're also paying, but per VPS, not per durable object or CEL as it's","zh":"自行部署，您也需要付費，但按 VPS 付費，而不是按耐用物件或 CEL 付費"},{"i":205,"start":805.466,"end":807.518,"en":"called in CEL's case.","zh":"在 CEL 的案例中被稱為。"},{"i":206,"start":808.207,"end":813.722,"en":"So the idea is that you can still have that same wrangler.json file we had for Cloudflare","zh":"所以我們的想法是，您仍然可以擁有與 Cloudflare 相同的 wrangler.json 文件"},{"i":207,"start":813.802,"end":816.992,"en":"because they really want to have that compatibility, at least to some degree.","zh":"因為他們確實希望擁有這種相容性，至少在某種程度上是如此。"},{"i":208,"start":817.089,"end":818.499,"en":"Many features are still missing.","zh":"許多功能仍然缺失。"},{"i":209,"start":818.547,"end":822.459,"en":"It's also in alpha, so things are broken to some extent or can be broken.","zh":"它也處於阿爾法階段，所以事情在某種程度上被破壞或可能被破壞。"},{"i":210,"start":823.261,"end":825.713,"en":"But generally the idea is to have similarity.","zh":"但一般來說，這個想法是具有相似性。"},{"i":211,"start":826.21,"end":828.727,"en":"And indeed, just as with Cloudflare, we have an entry point.","zh":"事實上，就像 Cloudflare 一樣，我們有一個入口點。"},{"i":212,"start":829.096,"end":833.776,"en":"And we have our durable objects or again, as they're called, cells that are registered.","zh":"我們有耐用的對象，或者再次，正如它們所說的，已註冊的單元。"},{"i":213,"start":834.385,"end":838.617,"en":"Then in the index.ts file, just as in the Cloudflare case, we take a look at the incoming","zh":"然後在index.ts檔案中，就像在Cloudflare案例中一樣，我們看一下傳入的"},{"i":214,"start":838.649,"end":843.025,"en":"request and we route that and we trigger our different cells.","zh":"請求，我們路由它並觸發不同的單元格。"},{"i":215,"start":843.682,"end":847.417,"en":"And such a cell looks almost like a durable object in Cloudflare.","zh":"這樣的單元看起來幾乎就像 Cloudflare 中的耐用物件。"},{"i":216,"start":847.689,"end":850.126,"en":"It's a class, but it does not extend anything.","zh":"它是一個類，但它不擴展任何東西。"},{"i":217,"start":850.206,"end":854.502,"en":"Instead, it has this constructor where it receives the durable object state that will","zh":"相反，它有一個建構函數，它接收持久物件狀態，該狀態將"},{"i":218,"start":854.582,"end":856.537,"en":"be passed in automatically by celled.","zh":"由 celled 自動傳入。"},{"i":219,"start":857.307,"end":859.359,"en":"And then here we have a fetch function.","zh":"然後這裡我們有一個獲取函數。"},{"i":220,"start":859.807,"end":864.552,"en":"Instead of one function per functionality, we have one shared function.","zh":"我們不是每個功能一個函數，而是一個共享函數。"},{"i":221,"start":864.841,"end":869.426,"en":"And in there we then take another look at the incoming request and for example differentiate","zh":"然後，我們再次查看傳入的請求，例如區分"},{"i":222,"start":869.426,"end":870.644,"en":"by method.","zh":"透過方法。"},{"i":223,"start":870.708,"end":875.741,"en":"But of course you could also again take a look at the URL and then we still access the","zh":"當然，你也可以再次查看 URL，然後我們仍然可以訪問"},{"i":224,"start":875.741,"end":876.719,"en":"storage as before.","zh":"儲存如前。"},{"i":225,"start":876.783,"end":880.134,"en":"And that's the same for the counter, for the ticket, for the agent.","zh":"對於櫃檯、機票、代理人都是一樣的。"},{"i":226,"start":880.486,"end":886.498,"en":"And therefore here I actually did already deploy this to an EC2 instance on AWS and I","zh":"因此，我實際上已經將其部署到 AWS 上的 EC2 實例，並且我"},{"i":227,"start":886.498,"end":889.876,"en":"then tunneled it to my local device, which is This is why I have a localhost address.","zh":"然後將其通過隧道傳輸到我的本地設備，這就是我擁有本地主機地址的原因。"},{"i":228,"start":890.215,"end":895.649,"en":"So I can again grab that counter here, for example, and then send this counter again,","zh":"例如，我可以再次在這裡抓取該計數器，然後再次發送該計數器，"},{"i":229,"start":895.698,"end":896.652,"en":"let's say to max.","zh":"讓我們說最大。"},{"i":230,"start":897.056,"end":902.064,"en":"And just as with Cloudflare Durable Objects, a new cell will be created on demand when","zh":"就像 Cloudflare Durable Objects 一樣，當以下情況發生時，將根據需要建立一個新單元："},{"i":231,"start":902.242,"end":904.593,"en":"needed, but then the storage will be persisted.","zh":"需要，但隨後存儲將持久化。"},{"i":232,"start":904.706,"end":907.257,"en":"And just as with Durable Objects, it's SQLite.","zh":"就像持久化物件一樣，它就是 SQLite。"},{"i":233,"start":907.923,"end":909.5,"en":"And if I change that,","zh":"如果我改變這一點"},{"i":234,"start":913.269,"end":915.647,"en":"that of course therefore also has an effect.","zh":"這當然也有影響。"},{"i":235,"start":916.172,"end":917.15,"en":"And is persisted.","zh":"並且是堅持下來的。"},{"i":236,"start":917.359,"end":919.684,"en":"Now, how do you deploy this though?","zh":"現在，您如何部署它？"},{"i":237,"start":920.181,"end":927.028,"en":"Well, when using Svelte, what you do is you install the Svelte binary typically on your","zh":"那麼，當使用 Svelte 時，您要做的就是通常將 Svelte 二進位檔案安裝在您的電腦上"},{"i":238,"start":927.076,"end":933.089,"en":"device, your MacBook for example, and on the node, on the EC2 instance where you wanna","zh":"設備（例如您的 MacBook）以及您想要的節點上的 EC2 執行個體上"},{"i":239,"start":933.57,"end":934.613,"en":"run your Svelte.","zh":"運行你的 Svelte。"},{"i":240,"start":934.853,"end":940.273,"en":"It's also worth noting that you're not limite
